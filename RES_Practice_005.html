<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RES Practice #005</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#65708a;--accent:#315efb;--good:#137a43;--bad:#b42318}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:820px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#172554,#315efb);color:white;padding:25px;border-radius:20px;box-shadow:0 8px 24px #0002}
.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:4px 0;opacity:.92}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.pill{background:white;border-radius:999px;padding:9px 14px;box-shadow:0 3px 12px #0001;font-weight:bold}.progress{height:10px;background:#dce3f2;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:var(--accent);width:0}
.card{background:var(--card);padding:22px;border-radius:18px;box-shadow:0 5px 20px #0001;margin-top:14px}.tag{font-size:12px;color:var(--muted);font-weight:bold;text-transform:uppercase}
.q{font-size:20px;line-height:1.42;margin:10px 0 18px}.opt{width:100%;text-align:left;border:1px solid #d8deea;background:white;padding:13px 15px;margin:7px 0;border-radius:12px;font-size:16px;cursor:pointer}
.opt:hover{border-color:var(--accent);background:#f7f9ff}.opt:disabled{cursor:default}.correct{border-color:#54b67a!important;background:#edf9f1!important}.wrong{border-color:#e57a72!important;background:#fff0ef!important}
.feedback{display:none;margin-top:15px;padding:14px;border-radius:12px;line-height:1.45}.good{display:block;background:#edf9f1;color:#0b6335}.bad{display:block;background:#fff0ef;color:#8f1d16}
button.next{display:none;margin-top:15px;border:0;background:var(--accent);color:white;padding:12px 18px;border-radius:11px;font-weight:bold;cursor:pointer}.end{text-align:center}.end h2{font-size:30px}
.small{font-size:13px;color:var(--muted);line-height:1.45}.restart{border:0;background:var(--accent);color:#fff;padding:12px 18px;border-radius:11px;font-weight:bold;cursor:pointer}
</style></head><body><div class="wrap">
<div class="hero"><h1>🏠 RES Practice #005</h1><p>20 questions · Mixed Paper 1 & Paper 2 · Practice Mode</p><p>Target: 16/20 (80%)</p></div>
<div id="quiz"><div class="stats"><div class="pill" id="num"></div><div class="pill" id="score"></div></div><div class="progress"><div class="bar" id="bar"></div></div>
<div class="card"><div class="tag" id="topic"></div><div class="q" id="question"></div><div id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next" onclick="nextQ()">Next Question →</button></div>
<p class="small">These are revision questions, not official CEA examination questions. Policy-sensitive answers are framed to current official information checked in Oct 2026.</p></div></div>
<script>const qs=[{"q": "An option to renew in a tenancy gives:", "opts": ["A contractual mechanism to obtain a further term if its conditions are met", "Automatic freehold title", "A mortgage right", "A tax rebate"], "ans": 0, "exp": "It is a contractual right to seek/obtain renewal according to specified conditions.", "topic": "P1 Landlord Tenant"}, {"q": "A buyer asks a salesperson to decide whether to sign a complex legal document immediately. The salesperson should:", "opts": ["Explain the transaction facts within competence and recommend legal advice for legal interpretation", "Act as the buyer's solicitor", "Sign for the buyer without authority", "Tell the buyer legal advice is unnecessary"], "ans": 0, "exp": "Salespersons should work within competence and refer legal interpretation to qualified lawyers.", "topic": "P2 Professional"}, {"q": "A market comparative analysis is most useful for:", "opts": ["Helping assess an asking/offer range using relevant comparable market evidence", "Guaranteeing the final sale price", "Replacing a formal valuation in every legal context", "Determining citizenship"], "ans": 0, "exp": "Comparable market evidence can inform pricing but does not guarantee a transaction price or replace all formal valuations.", "topic": "P2 Marketing"}, {"q": "A buyer comparing a fixed and floating housing loan should understand that:", "opts": ["A fixed rate is fixed for its specified period while a floating rate can vary under its formula", "Both can never change", "Floating rates are set by the salesperson", "Fixed rates eliminate all refinancing risk forever"], "ans": 0, "exp": "Rate structure affects payment risk; the exact package terms must be checked.", "topic": "P2 Finance"}, {"q": "Under the idea of caveat emptor, a buyer should generally:", "opts": ["Never inspect a property", "Exercise reasonable care and due diligence rather than assume every matter is guaranteed", "Ignore title documents", "Rely only on advertisements"], "ans": 1, "exp": "Caveat emptor means 'buyer beware', though it does not excuse actionable misrepresentation or required disclosures.", "topic": "P1 Contract"}, {"q": "A salesperson receives two genuine offers for a seller's property. The salesperson should generally:", "opts": ["Transmit only the higher offer", "Transmit all offers to the principal unless lawfully instructed otherwise", "Choose the preferred buyer personally", "Hide the earlier offer"], "ans": 1, "exp": "An agent's duties include transmitting offers to the principal so the principal can decide.", "topic": "P1 Agency"}, {"q": "A landlord gives a person permission to use one parking space but no exclusive possession of premises. This is most consistent with:", "opts": ["Licence", "Freehold estate", "Mortgage", "Joint tenancy"], "ans": 0, "exp": "Permission to use land without the hallmarks of a lease is commonly a licence.", "topic": "P1 Licence"}, {"q": "Which agency is most directly associated with public housing in Singapore?", "opts": ["HDB", "SLA", "MAS", "BCA"], "ans": 0, "exp": "HDB develops and administers public housing policies and programmes.", "topic": "P1 Agencies"}, {"q": "Commission in estate agency work should be:", "opts": ["Agreed transparently in accordance with the agency agreement and rules", "Hidden until completion", "Fixed by URA for every transaction", "Paid by any party regardless of representation"], "ans": 0, "exp": "Commission arrangements should be transparent and properly documented under applicable rules.", "topic": "P2 Agency Agreement"}, {"q": "A Singapore Permanent Resident family nucleus buying an HDB resale flat is subject to rules including:", "opts": ["Applicable SPR-status duration and family eligibility requirements", "No eligibility rules at all", "Automatic eligibility on first day of SPR", "Ownership of unlimited HDB flats"], "ans": 0, "exp": "HDB applies citizenship/SPR duration, family nucleus and other prevailing eligibility conditions.", "topic": "P2 HDB"}, {"q": "Consideration in contract law generally means:", "opts": ["A party thinking carefully", "Something of value exchanged for a promise, subject to legal rules", "Only cash paid in full", "A planning application"], "ans": 1, "exp": "Consideration is the legally recognised value given in exchange for a promise.", "topic": "P1 Contract"}, {"q": "Property tax is distinct from BSD because property tax is generally:", "opts": ["A recurring tax on property ownership, while BSD relates to acquisition documents", "Always paid only once at purchase", "A salesperson registration fee", "A mortgage penalty"], "ans": 0, "exp": "Property tax and stamp duty are different taxes with different charging events.", "topic": "P2 Tax"}, {"q": "A fixed-term tenancy is one that:", "opts": ["Runs for an agreed definite period", "Has no identifiable duration at all", "Automatically transfers freehold", "Exists only verbally"], "ans": 0, "exp": "A fixed term has a defined commencement/end or ascertainable duration.", "topic": "P1 Landlord Tenant"}, {"q": "Actual authority is authority:", "opts": ["Granted by the principal to the agent, expressly or impliedly", "Created only by a third party's imagination", "Given by CEA for every transaction", "Arising only after completion"], "ans": 0, "exp": "Actual authority comes from the principal-agent relationship, expressly or by implication.", "topic": "P1 Agency"}, {"q": "A void contract is generally treated as:", "opts": ["Fully enforceable", "Having no legal effect as a valid contract", "A lease exceeding seven years", "An equitable mortgage"], "ans": 1, "exp": "A void agreement does not operate as a valid enforceable contract.", "topic": "P1 Contract"}, {"q": "When marketing commercial property, a salesperson should verify:", "opts": ["Permitted use, title/tenure and material transaction particulars", "Only wall colour", "Only seller's preferred completion date", "Nothing if photos look accurate"], "ans": 0, "exp": "Commercial transactions require accurate information on use, title and other material particulars.", "topic": "P2 Commercial"}, {"q": "A typical HDB resale flat's Minimum Occupation Period is generally:", "opts": ["5 years, subject to the flat type/scheme and prevailing rules", "6 months", "1 year for every flat", "20 years"], "ans": 0, "exp": "For common subsidised/resale categories, current HDB terms specify a 5-year MOP, though special categories can differ.", "topic": "P2 HDB"}, {"q": "If a mortgagor defaults, a mortgagee may, subject to law and mortgage terms:", "opts": ["Exercise available enforcement remedies", "Automatically imprison the mortgagor", "Change zoning without approval", "Acquire neighbouring land"], "ans": 0, "exp": "Mortgage enforcement remedies may include sale or other remedies, subject to statutory/contractual requirements.", "topic": "P1 Mortgage"}, {"q": "A salesperson should advise a client who needs legal interpretation of a complex OTP clause to:", "opts": ["Seek advice from a solicitor", "Rely on the salesperson as if the salesperson were the client's lawyer", "Ignore the clause", "Ask the property photographer"], "ans": 0, "exp": "Salespersons should recognise professional boundaries and refer legal issues to solicitors where appropriate.", "topic": "P2 Professional"}, {"q": "For HDB resale, eligibility is ultimately determined by:", "opts": ["HDB under prevailing policies, rules and regulations", "The salesperson personally", "The seller's neighbour", "The buyer's bank only"], "ans": 0, "exp": "HDB retains authority to determine eligibility under prevailing rules.", "topic": "P2 HDB"}];
let i=0,score=0,locked=false;
const letters=['A','B','C','D'];
function render(){
 locked=false;
 if(i>=qs.length){finish();return}
 const q=qs[i];
 document.getElementById('num').textContent=(i+1)+' / '+qs.length;
 document.getElementById('score').textContent='Score: '+score;
 document.getElementById('bar').style.width=(i/qs.length*100)+'%';
 document.getElementById('topic').textContent=q.topic;
 document.getElementById('question').textContent=q.q;
 const box=document.getElementById('options');box.innerHTML='';
 q.opts.forEach((o,k)=>{let b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+letters[k]+'.</b> '+o;b.onclick=()=>choose(k,b);box.appendChild(b)});
 let f=document.getElementById('feedback');f.className='feedback';f.innerHTML='';
 document.getElementById('next').style.display='none';
}
function choose(k,b){
 if(locked)return;locked=true;
 const q=qs[i], buttons=[...document.querySelectorAll('.opt')];
 buttons.forEach(x=>x.disabled=true);buttons[q.ans].classList.add('correct');
 const f=document.getElementById('feedback');
 if(k===q.ans){score++;f.className='feedback good';f.innerHTML='<b>✓ Correct.</b> '+q.exp}
 else{b.classList.add('wrong');f.className='feedback bad';f.innerHTML='<b>✗ Not quite. Correct answer: '+letters[q.ans]+'.</b><br>'+q.exp}
 document.getElementById('score').textContent='Score: '+score;
 document.getElementById('next').style.display='inline-block';
}
function nextQ(){i++;render()}
function finish(){
 document.getElementById('bar').style.width='100%';
 let pct=Math.round(score/qs.length*100),msg=pct>=80?'Strong attempt — move on, then revisit your wrong answers.':pct>=60?'Getting there — review the explanations and retry later.':'Use this set as revision: focus on why each wrong option was wrong.';
 document.getElementById('quiz').innerHTML='<div class="card end"><h2>'+score+' / '+qs.length+' ('+pct+'%)</h2><p>'+msg+'</p><button class="restart" onclick="location.reload()">Try Again</button><p class="small">Practice material only. Always check current CEA/HDB/IRAS/URA rules for policy-sensitive topics.</p></div>';
}
render();
</script></body></html>
