<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RES Paper 1 Practice #018</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f4f6f8;margin:0;color:#18212b}
.wrap{max-width:760px;margin:auto;padding:20px} .card{background:white;border-radius:16px;padding:22px;box-shadow:0 3px 16px #0001}
h1{font-size:1.45rem;margin:0 0 6px} .meta{color:#65717e;margin-bottom:14px} .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.badge{background:#eef2f6;border-radius:999px;padding:7px 11px;font-weight:650} .bar{height:9px;background:#e8edf2;border-radius:9px;overflow:hidden;margin:14px 0}
.bar>div{height:100%;background:#374151;width:0} .q{font-size:1.08rem;font-weight:700;line-height:1.45;margin:16px 0}
.topic{font-size:.85rem;color:#65717e} button.option{width:100%;text-align:left;padding:13px 14px;margin:7px 0;border:1px solid #ccd4dc;background:#fff;border-radius:11px;font-size:1rem;cursor:pointer}
button.option:hover{background:#f7f9fb} button.option:disabled{cursor:default} .correct{border-color:#25804b!important;background:#eefaf3!important} .wrong{border-color:#b83b3b!important;background:#fff1f1!important}
.feedback{margin-top:14px;padding:13px;border-radius:10px;background:#f5f7fa;line-height:1.45;display:none} .next,.start{border:0;border-radius:10px;background:#1f2937;color:white;padding:12px 18px;font-weight:700;cursor:pointer;margin-top:14px}
.result{text-align:center;display:none} .big{font-size:2.2rem;font-weight:800} small{color:#65717e}
</style></head><body><div class="wrap"><div class="card">
<div id="quiz">
<h1>RES Paper 1 · Practice #018</h1>
<div class="meta">20 questions · Medium / Exam Standard 🟠 · Choices reshuffle every attempt</div>
<div class="top"><span class="badge" id="progress">Question 1 / 20</span><span class="badge" id="score">Score 0</span><span class="badge" id="timer">00:00</span></div>
<div class="bar"><div id="bar"></div></div><div class="topic" id="topic"></div><div class="q" id="q"></div><div id="options"></div>
<div class="feedback" id="feedback"></div><button class="next" id="next" style="display:none">Next Question</button>
</div>
<div class="result" id="result"><h1>Practice #018 Complete</h1><div class="big" id="final"></div><p id="timing"></p><p><small>Retry reshuffles every question's A/B/C/D choices, so learn the answer—not the letter.</small></p><button class="start" id="retry">Retry Practice</button></div>
</div></div>
<script>
const BASE=[{"topic": "L1 Property", "q": "Which statement best distinguishes direct real estate from a REIT?", "options": ["Direct real estate involves a direct property interest; a REIT is an indirect investment vehicle holding real-estate assets", "A REIT gives every unit-holder title to a particular strata lot", "Direct real estate is necessarily more liquid than a listed REIT", "REITs cannot derive rental income"], "answer": 0, "explanation": "The notes distinguish direct property ownership/interests from investment through a REIT."}, {"topic": "L1 Agencies", "q": "Which agency is most directly associated with land titles and management of State land?", "options": ["SLA", "URA", "BCA", "MAS"], "answer": 0, "explanation": "The notes associate SLA with land administration, land titles and State land."}, {"topic": "L2 Land", "q": "Which is the best example of an incorporeal hereditament?", "options": ["An easement", "A building", "A tree rooted in the land", "Soil"], "answer": 0, "explanation": "An easement is an intangible right connected with land; buildings, trees and soil are corporeal."}, {"topic": "L2 Land", "q": "When deciding whether an item has become a fixture, which pair of tests is central?", "options": ["Degree and purpose of annexation", "Price and age of the item", "Ownership and market value", "Planning use and plot ratio"], "answer": 0, "explanation": "The fixture analysis in the notes uses degree and purpose/object of annexation."}, {"topic": "L3 Future Interest", "q": "O grants a life estate to A, and when A dies the property returns to O. O's future interest is a:", "options": ["Reversion", "Remainder", "Licence", "Charge"], "answer": 0, "explanation": "A reversion is the future interest retained by the grantor when possession returns to the grantor."}, {"topic": "L3 Future Interest", "q": "O grants a life estate to A, then the property is to pass to B. B's future interest is a:", "options": ["Remainder", "Reversion", "Mortgage", "Licence"], "answer": 0, "explanation": "A future interest given to a third party after a life estate is a remainder."}, {"topic": "L4 Registration", "q": "Which dealing is within the class identified in the notes as capable of notification on title?", "options": ["A lease exceeding 7 years", "A six-month informal permission", "A renovation quotation", "A property advertisement"], "answer": 0, "explanation": "The notes identify transfers, mortgages, charges and leases exceeding seven years as dealings notified on title."}, {"topic": "L4 Easement", "q": "A landowner has a legally recognised right of way across neighbouring land to reach a public road. This is most likely:", "options": ["An easement", "A lease", "A mortgage", "A tenancy at will"], "answer": 0, "explanation": "A right of way over another's land is a classic easement."}, {"topic": "L5 Trust", "q": "Which statement best captures a trust?", "options": ["A trustee may hold legal title for the benefit of a beneficiary with an equitable interest", "The beneficiary must always hold the legal title personally", "A trust is merely a licence to occupy", "A trust automatically removes all ownership restrictions"], "answer": 0, "explanation": "The notes distinguish the trustee's legal interest from the beneficiary's equitable/beneficial interest."}, {"topic": "L5 Gift", "q": "Which statement most accurately distinguishes a gift of property from a sale?", "options": ["A gift is intended to transfer property gratuitously rather than for contractual consideration", "A gift always requires market-value consideration", "A gift cannot involve land", "A gift and sale are legally identical"], "answer": 0, "explanation": "A gift is a voluntary/gratuitous transfer rather than an exchange for contractual consideration."}, {"topic": "L6 Contract", "q": "Which set correctly states the '3Ps' used in the notes for certainty of a real-estate offer?", "options": ["Parties, Property, Price", "Parties, Possession, Period", "Principal, Property, Payment", "Property, Price, Performance"], "answer": 0, "explanation": "The 3Ps are Parties, Property and Price."}, {"topic": "L6 Contract", "q": "Which statement best distinguishes a condition from a warranty?", "options": ["A condition is generally more fundamental; breach may justify stronger remedies than breach of a warranty", "A warranty is always more fundamental", "They are identical in importance and remedy", "Breach of a warranty always automatically ends the contract"], "answer": 0, "explanation": "The notes distinguish a condition as a more fundamental term from a warranty."}, {"topic": "L7 Tenancy", "q": "A tenant grants T2 possession for a shorter period than the tenant's own remaining term and retains a reversion. This is:", "options": ["A sublease", "An assignment of the whole term", "A mortgage", "A novation"], "answer": 0, "explanation": "A sublease leaves the original tenant with a reversion because less than the whole remaining term is granted."}, {"topic": "L7 Tenancy", "q": "Which combination is identified in the notes as essential to a valid lease?", "options": ["Exclusive possession, a certain/definite term, and intention to create a lease", "Payment of commission, a caveat and a mortgage", "A dominant tenement, servient tenement and right of way", "A will, probate and transmission"], "answer": 0, "explanation": "The notes identify exclusive possession, certainty of term and intention to create a lease."}, {"topic": "L8 Tort", "q": "According to the trainer notes, caveat emptor does not protect against:", "options": ["Negligent or fraudulent misrepresentation", "Every defect a buyer could discover", "Every change in market price", "Every refusal by a seller to accept an offer"], "answer": 0, "explanation": "The trainer questionnaire states caveat emptor does not apply where negligent or fraudulent misrepresentation occurs."}, {"topic": "L8 Agency", "q": "Actual authority differs from apparent authority because:", "options": ["Actual authority arises from the principal-agent relationship; apparent authority concerns the appearance of authority to a third party attributable to the principal", "Apparent authority is always express and written", "Actual authority exists only where there is no agency relationship", "There is no distinction"], "answer": 0, "explanation": "The notes distinguish actual authority from the principal's representation to third parties creating apparent authority."}, {"topic": "L9 Market", "q": "An increase in mortgage interest rates is most directly what kind of factor affecting property demand?", "options": ["A macro factor that may weaken demand by increasing financing cost", "A fixture test", "A title encumbrance", "A form of tenure"], "answer": 0, "explanation": "Interest rates are macro-economic factors and can affect demand through financing cost."}, {"topic": "L9 Players", "q": "Which participant most directly creates new real-estate products by developing land/buildings?", "options": ["Developer", "Tenant", "Mortgagee", "Beneficiary"], "answer": 0, "explanation": "Developers are identified as market players who create new property products."}, {"topic": "L1 Planning", "q": "A site has an area of 900 sq m and plot ratio 3.0. Ignoring other controls, what is the potential GFA?", "options": ["2700 sq m", "900 sq m", "300 sq m", "300 sq m"], "answer": 0, "explanation": "Potential GFA is calculated as site area × plot ratio."}, {"topic": "L4 Caveat", "q": "A buyer has exercised an OTP and thereby acquired an equitable interest pending completion. Which statement best fits the notes?", "options": ["The buyer may have a caveatable interest", "Only the registered proprietor can ever lodge a caveat", "A salesperson may lodge a caveat merely for unpaid commission", "A caveat itself transfers legal title to the buyer"], "answer": 0, "explanation": "The notes use an exercised OTP buyer as an example of a party with an equitable/caveatable interest."}];
let qs=[],idx=0,score=0,answered=false,startTime=0,timerId=null;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeAttempt(){
 qs=BASE.map(x=>{let arr=x.options.map((t,i)=>({t,ok:i===x.answer}));shuffle(arr);return {...x,choices:arr}});
 idx=0;score=0;answered=false;startTime=Date.now();clearInterval(timerId);timerId=setInterval(tick,1000);tick();
 $("quiz").style.display="block";$("result").style.display="none";render();
}
function tick(){let s=Math.floor((Date.now()-startTime)/1000);$("timer").textContent=fmt(s)}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function render(){
 answered=false;let x=qs[idx];$("progress").textContent=`Question ${idx+1} / ${qs.length}`;$("score").textContent=`Score ${score}`;
 $("bar").style.width=((idx)/qs.length*100)+"%";$("topic").textContent=x.topic;$("q").textContent=x.q;$("feedback").style.display="none";$("next").style.display="none";
 let box=$("options");box.innerHTML="";x.choices.forEach((c,i)=>{let b=document.createElement("button");b.className="option";b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${c.t}`;b.onclick=()=>choose(i,b);box.appendChild(b)})
}
function choose(i,b){
 if(answered)return;answered=true;let x=qs[idx],buttons=[...document.querySelectorAll(".option")];buttons.forEach(z=>z.disabled=true);
 if(x.choices[i].ok){score++;b.classList.add("correct")}else{b.classList.add("wrong");let ci=x.choices.findIndex(c=>c.ok);buttons[ci].classList.add("correct")}
 let ci=x.choices.findIndex(c=>c.ok), letter=String.fromCharCode(65+ci);$("score").textContent=`Score ${score}`;
 $("feedback").innerHTML=`<b>${x.choices[i].ok?"Correct ✓":"Not quite ✗"}</b><br>Correct answer: <b>${letter}. ${x.choices[ci].t}</b><br><br>${x.explanation}`;
 $("feedback").style.display="block";$("next").style.display="inline-block";$("next").textContent=idx===qs.length-1?"See Results":"Next Question";
}
$("next").onclick=()=>{if(idx<qs.length-1){idx++;render()}else finish()};
function finish(){
 clearInterval(timerId);let secs=Math.floor((Date.now()-startTime)/1000),pct=Math.round(score/qs.length*100);
 $("quiz").style.display="none";$("result").style.display="block";$("final").textContent=`${score} / ${qs.length} · ${pct}%`;
 $("timing").textContent=`Total time: ${fmt(secs)} · Average: ${Math.round(secs/qs.length)} sec/question`;
}
$("retry").onclick=makeAttempt;makeAttempt();
</script></body></html>
