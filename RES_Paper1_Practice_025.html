<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RES Paper 1 Practice #025</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f4f6f8;margin:0;color:#18212b}
.wrap{max-width:760px;margin:auto;padding:20px} .card{background:white;border-radius:16px;padding:22px;box-shadow:0 3px 16px #0001}
h1{font-size:1.45rem;margin:0 0 6px} .meta{color:#65717e;margin-bottom:14px} .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.badge{background:#eef2f6;border-radius:999px;padding:7px 11px;font-weight:650} .bar{height:9px;background:#e8edf2;border-radius:9px;overflow:hidden;margin:14px 0}
.bar>div{height:100%;background:#374151;width:0} .q{font-size:1.08rem;font-weight:700;line-height:1.45;margin:16px 0}
.topic{font-size:.85rem;color:#65717e} button.option{width:100%;text-align:left;padding:13px 14px;margin:7px 0;border:1px solid #ccd4dc;background:#fff;border-radius:11px;font-size:1rem;cursor:pointer}
button.option:hover{background:#f7f9fb} button.option:disabled{cursor:default} .correct{border-color:#25804b!important;background:#eefaf3!important} .wrong{border-color:#b83b3b!important;background:#fff1f1!important}
.feedback{margin-top:14px;padding:13px;border-radius:10px;background:#f5f7fa;line-height:1.45;display:none} .next,.start{border:0;border-radius:10px;background:#1f2937;color:white;padding:12px 18px;font-weight:700;cursor:pointer;margin-top:14px}
.result{text-align:center;display:none} .big{font-size:2.2rem;font-weight:800} small{color:#65717e}
</style></head><body><div class="wrap"><div class="card">
<div id="quiz">
<h1>RES Paper 1 · Practice #025</h1>
<div class="meta">20 questions · Medium / Exam Standard 🟠 · Choices reshuffle every attempt</div>
<div class="top"><span class="badge" id="progress">Question 1 / 20</span><span class="badge" id="score">Score 0</span><span class="badge" id="timer">00:00</span></div>
<div class="bar"><div id="bar"></div></div><div class="topic" id="topic"></div><div class="q" id="q"></div><div id="options"></div>
<div class="feedback" id="feedback"></div><button class="next" id="next" style="display:none">Next Question</button>
</div>
<div class="result" id="result"><h1>Practice #025 Complete</h1><div class="big" id="final"></div><p id="timing"></p><p><small>Retry reshuffles every question's A/B/C/D choices, so learn the answer—not the letter.</small></p><button class="start" id="retry">Retry Practice</button></div>
</div></div>
<script>
const BASE=[{"topic": "L1 Planning", "q": "A site has an area of 750 sq m and plot ratio 2.8. Ignoring other controls, what is the potential GFA?", "options": ["2100 sq m", "750 sq m", "267.9 sq m", "280 sq m"], "answer": 0, "explanation": "Potential GFA is calculated as site area × plot ratio."}, {"topic": "L1 Planning", "q": "A buyer asks what zoning in the Master Plan mainly indicates.", "options": ["The broad planning intention for permitted land use", "The registered ownership share of each proprietor", "The guaranteed present use of every unit", "The property's mortgage priority"], "answer": 0, "explanation": "Zoning expresses the broad planning land-use intention; it is not ownership, title priority or a guarantee of every unit's existing use."}, {"topic": "L2 Land", "q": "A freestanding appliance is brought into a flat and is not attached to the land. On these facts alone, it is most likely:", "options": ["A chattel/fitting", "A fixture", "An easement", "A restrictive covenant"], "answer": 0, "explanation": "A movable item not sufficiently annexed is generally treated as a chattel/fitting rather than a fixture."}, {"topic": "L2 Land", "q": "When deciding whether an item has become a fixture, which pair of tests is central?", "options": ["Degree and purpose of annexation", "Price and age of the item", "Ownership and market value", "Planning use and plot ratio"], "answer": 0, "explanation": "The fixture analysis in the notes uses degree and purpose/object of annexation."}, {"topic": "L3 Future Interest", "q": "O grants a life estate to A, and when A dies the property returns to O. O's future interest is a:", "options": ["Reversion", "Remainder", "Licence", "Charge"], "answer": 0, "explanation": "A reversion is the future interest retained by the grantor when possession returns to the grantor."}, {"topic": "L3 State Land", "q": "Land sold under a Government Land Sales lease remains subject to what interest retained by the State?", "options": ["A reversionary interest", "A remainder interest", "A tenancy in common", "An easement by necessity"], "answer": 0, "explanation": "With leasehold State land, the State retains the reversionary interest."}, {"topic": "L4 Caveat", "q": "A salesperson is owed commission and wants to lodge a caveat solely to pressure the owner to pay. According to the notes:", "options": ["Unpaid commission alone does not give the salesperson the required property interest to lodge a caveat", "Any unpaid debt automatically creates a caveatable interest", "The salesperson becomes a mortgagee", "The caveat automatically transfers title"], "answer": 0, "explanation": "A caveat requires an appropriate interest in the land; an unpaid commission claim alone is not such an interest."}, {"topic": "L4 Licence", "q": "A cinema patron is permitted to enter and occupy a seat for a screening. In the notes this is best characterised as:", "options": ["A licence", "A lease", "An easement", "A freehold estate"], "answer": 0, "explanation": "The course notes use cinema admission as an example of a licence: permission rather than an estate in land."}, {"topic": "L5 Co-ownership", "q": "A and B own property as joint tenants. B dies without prior severance. What is the key consequence?", "options": ["B's interest accrues to A by right of survivorship", "B's distinct share necessarily passes under B's will", "The property becomes State land", "A and B automatically become tenants in common"], "answer": 0, "explanation": "Right of survivorship is the defining feature of joint tenancy in the notes."}, {"topic": "L5 Succession", "q": "A person dies leaving a valid will. Which grant most directly evidences the executor's authority to administer the estate?", "options": ["Grant of probate", "Letters of administration", "Temporary Occupation Licence", "Certificate of title"], "answer": 0, "explanation": "A grant of probate is associated with an executor administering a testate estate."}, {"topic": "L6 Contract", "q": "Which is a recognised way contractual obligations may be discharged?", "options": ["Performance, agreement, breach or frustration depending on circumstances", "Only registration of title", "Only payment of commission", "Only expiry of a caveat"], "answer": 0, "explanation": "The contract lesson covers discharge by performance, agreement, breach and frustration."}, {"topic": "L6 Contract", "q": "A false statement of fact induces a buyer to enter a contract. Which concept is most directly engaged?", "options": ["Misrepresentation", "Frustration", "Novation", "Merger"], "answer": 0, "explanation": "A false inducing statement of fact points to misrepresentation."}, {"topic": "L7 Tenancy", "q": "Which combination is identified in the notes as essential to a valid lease?", "options": ["Exclusive possession, a certain/definite term, and intention to create a lease", "Payment of commission, a caveat and a mortgage", "A dominant tenement, servient tenement and right of way", "A will, probate and transmission"], "answer": 0, "explanation": "The notes identify exclusive possession, certainty of term and intention to create a lease."}, {"topic": "L7 Tenancy", "q": "A tenant transfers the entire remaining lease term to T2. This is most accurately:", "options": ["An assignment", "A sublease", "A surrender", "A licence"], "answer": 0, "explanation": "Assignment transfers the tenant's entire remaining lease interest."}, {"topic": "L8 Agency", "q": "A salesperson receives an offer below the seller's asking price. Which action best reflects the agent's duty in the notes?", "options": ["Transmit the offer to the client rather than suppress it merely because it is low", "Reject it personally without authority", "Ignore it because it is below asking", "Accept it automatically for the seller"], "answer": 0, "explanation": "The agency syllabus includes the duty to transmit all offers to the client."}, {"topic": "L8 Agency", "q": "An agent acts without prior authority, but the principal later validly approves the act. This is:", "options": ["Ratification", "Frustration", "Severance", "Merger"], "answer": 0, "explanation": "Ratification is later approval by the principal of an unauthorised act, subject to the applicable requirements."}, {"topic": "L9 Market", "q": "An increase in mortgage interest rates is most directly what kind of factor affecting property demand?", "options": ["A macro factor that may weaken demand by increasing financing cost", "A fixture test", "A title encumbrance", "A form of tenure"], "answer": 0, "explanation": "Interest rates are macro-economic factors and can affect demand through financing cost."}, {"topic": "L9 Market", "q": "Which statement best reflects the notes' comparison of short-term property supply and demand?", "options": ["Supply tends to be relatively inelastic in the short term, while demand can respond more readily to market stimulants", "Both are completely fixed", "Supply is always perfectly elastic", "Demand cannot respond to interest rates"], "answer": 0, "explanation": "Real-estate supply usually takes time to adjust, while demand can respond faster to market conditions."}, {"topic": "L6 Contract", "q": "A property advertisement stating an asking price will most commonly be analysed first as:", "options": ["An invitation to treat", "An acceptance", "A completed conveyance", "A deed"], "answer": 0, "explanation": "The notes treat advertisements generally as invitations to treat—an invitation for others to make offers."}, {"topic": "L4 Registration", "q": "Which dealing is within the class identified in the notes as capable of notification on title?", "options": ["A lease exceeding 7 years", "A six-month informal permission", "A renovation quotation", "A property advertisement"], "answer": 0, "explanation": "The notes identify transfers, mortgages, charges and leases exceeding seven years as dealings notified on title."}];
let qs=[],idx=0,score=0,answered=false,startTime=0,timerId=null;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeAttempt(){
 qs=BASE.map(x=>{let arr=x.options.map((t,i)=>({t,ok:i===x.answer}));shuffle(arr);return {...x,choices:arr}});
 idx=0;score=0;answered=false;startTime=Date.now();clearInterval(timerId);timerId=setInterval(tick,1000);tick();
 $("quiz").style.display="block";$("result").style.display="none";render();
}
function tick(){let s=Math.floor((Date.now()-startTime)/1000);$("timer").textContent=fmt(s)}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function render(){
 answered=false;let x=qs[idx];$("progress").textContent=`Question ${idx+1} / ${qs.length}`;$("score").textContent=`Score ${score}`;
 $("bar").style.width=((idx)/qs.length*100)+"%";$("topic").textContent=x.topic;$("q").textContent=x.q;$("feedback").style.display="none";$("next").style.display="none";
 let box=$("options");box.innerHTML="";x.choices.forEach((c,i)=>{let b=document.createElement("button");b.className="option";b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${c.t}`;b.onclick=()=>choose(i,b);box.appendChild(b)})
}
function choose(i,b){
 if(answered)return;answered=true;let x=qs[idx],buttons=[...document.querySelectorAll(".option")];buttons.forEach(z=>z.disabled=true);
 if(x.choices[i].ok){score++;b.classList.add("correct")}else{b.classList.add("wrong");let ci=x.choices.findIndex(c=>c.ok);buttons[ci].classList.add("correct")}
 let ci=x.choices.findIndex(c=>c.ok), letter=String.fromCharCode(65+ci);$("score").textContent=`Score ${score}`;
 $("feedback").innerHTML=`<b>${x.choices[i].ok?"Correct ✓":"Not quite ✗"}</b><br>Correct answer: <b>${letter}. ${x.choices[ci].t}</b><br><br>${x.explanation}`;
 $("feedback").style.display="block";$("next").style.display="inline-block";$("next").textContent=idx===qs.length-1?"See Results":"Next Question";
}
$("next").onclick=()=>{if(idx<qs.length-1){idx++;render()}else finish()};
function finish(){
 clearInterval(timerId);let secs=Math.floor((Date.now()-startTime)/1000),pct=Math.round(score/qs.length*100);
 $("quiz").style.display="none";$("result").style.display="block";$("final").textContent=`${score} / ${qs.length} · ${pct}%`;
 $("timing").textContent=`Total time: ${fmt(secs)} · Average: ${Math.round(secs/qs.length)} sec/question`;
}
$("retry").onclick=makeAttempt;makeAttempt();
</script></body></html>
