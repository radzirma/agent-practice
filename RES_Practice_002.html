<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RES Practice #002</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#65708a;--accent:#315efb;--good:#137a43;--bad:#b42318}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:820px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#172554,#315efb);color:white;padding:25px;border-radius:20px;box-shadow:0 8px 24px #0002}
.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:4px 0;opacity:.92}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.pill{background:white;border-radius:999px;padding:9px 14px;box-shadow:0 3px 12px #0001;font-weight:bold}.progress{height:10px;background:#dce3f2;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:var(--accent);width:0}
.card{background:var(--card);padding:22px;border-radius:18px;box-shadow:0 5px 20px #0001;margin-top:14px}.tag{font-size:12px;color:var(--muted);font-weight:bold;text-transform:uppercase}
.q{font-size:20px;line-height:1.42;margin:10px 0 18px}.opt{width:100%;text-align:left;border:1px solid #d8deea;background:white;padding:13px 15px;margin:7px 0;border-radius:12px;font-size:16px;cursor:pointer}
.opt:hover{border-color:var(--accent);background:#f7f9ff}.opt:disabled{cursor:default}.correct{border-color:#54b67a!important;background:#edf9f1!important}.wrong{border-color:#e57a72!important;background:#fff0ef!important}
.feedback{display:none;margin-top:15px;padding:14px;border-radius:12px;line-height:1.45}.good{display:block;background:#edf9f1;color:#0b6335}.bad{display:block;background:#fff0ef;color:#8f1d16}
button.next{display:none;margin-top:15px;border:0;background:var(--accent);color:white;padding:12px 18px;border-radius:11px;font-weight:bold;cursor:pointer}.end{text-align:center}.end h2{font-size:30px}
.small{font-size:13px;color:var(--muted);line-height:1.45}.restart{border:0;background:var(--accent);color:#fff;padding:12px 18px;border-radius:11px;font-weight:bold;cursor:pointer}
</style></head><body><div class="wrap">
<div class="hero"><h1>🏠 RES Practice #002</h1><p>20 questions · Mixed Paper 1 & Paper 2 · Practice Mode</p><p>Target: 16/20 (80%)</p></div>
<div id="quiz"><div class="stats"><div class="pill" id="num"></div><div class="pill" id="score"></div></div><div class="progress"><div class="bar" id="bar"></div></div>
<div class="card"><div class="tag" id="topic"></div><div class="q" id="question"></div><div id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next" onclick="nextQ()">Next Question →</button></div>
<p class="small">These are revision questions, not official CEA examination questions. Policy-sensitive answers are framed to current official information checked in Oct 2026.</p></div></div>
<script>const qs=[{"q": "Two siblings own a property 70:30. This is most consistent with:", "opts": ["Tenancy in common", "Joint tenancy necessarily", "A licence", "An easement"], "ans": 0, "exp": "Specified unequal beneficial shares are characteristic of tenancy in common.", "topic": "P1 Co-ownership"}, {"q": "A purchaser acquires a property subject to a registered right of way benefiting neighbouring land. The purchaser should generally expect:", "opts": ["The registered easement may continue to burden the property", "The right disappears simply because ownership changed", "The neighbour becomes co-owner", "The mortgage is discharged"], "ans": 0, "exp": "Proprietary easements can bind successors according to land law and registration rules.", "topic": "P1 Easements"}, {"q": "A co-owner wants his 40% interest to pass under his will rather than automatically to the other co-owner. Which form of co-ownership better fits that intention?", "opts": ["Tenancy in common", "Joint tenancy", "Licence", "Periodic tenancy"], "ans": 0, "exp": "A tenant in common owns a distinct share without survivorship, so the share can pass through the estate.", "topic": "P1 Co-ownership"}, {"q": "In a property offer, the '3Ps' commonly refer to:", "opts": ["Parties, Property, Price", "Price, Planning, Possession", "Property, Profit, Permission", "Parties, Payment, Planning"], "ans": 0, "exp": "Parties, Property and Price are key terms for certainty of an offer in property transactions.", "topic": "P1 Contract"}, {"q": "Why is the real estate market commonly divided into submarkets?", "opts": ["Every property has the same characteristics", "Property demand and supply can differ by type, location and user group", "Only residential property has a market", "Government agencies prohibit a single property market"], "ans": 1, "exp": "Property types, locations and socioeconomic/user characteristics create distinct demand and supply conditions.", "topic": "P1 Market"}, {"q": "A future interest is an interest where:", "opts": ["The right to possession/enjoyment is to arise in the future", "The property has not been built only", "The buyer has not viewed the unit", "Rent is paid monthly"], "ans": 0, "exp": "A future interest concerns entitlement whose possession/enjoyment is postponed.", "topic": "P1 Future Interest"}, {"q": "An encumbrance on title is most accurately understood as:", "opts": ["A physical renovation only", "A right, interest or burden affecting the land/title", "A property's postal code", "A valuation method"], "ans": 1, "exp": "Encumbrances include interests or burdens such as mortgages, easements or restrictive covenants.", "topic": "P1 Title"}, {"q": "During the applicable HDB MOP, owners generally cannot:", "opts": ["Invest in another residential property in Singapore or overseas, subject to prevailing HDB rules", "Live in the HDB flat", "Pay their mortgage", "Renovate with required approvals"], "ans": 0, "exp": "Current HDB terms restrict acquisition/investment in other residential property during the MOP.", "topic": "P2 HDB"}, {"q": "A salesperson copying another agent's property photos without permission may create:", "opts": ["Professional and potentially intellectual-property concerns", "Automatic title transfer", "A valid exclusive listing", "An HDB grant"], "ans": 0, "exp": "Marketing material should be used lawfully and with proper authority.", "topic": "P2 Advertising"}, {"q": "BSD is generally payable when a person:", "opts": ["Buys or acquires property in Singapore through a dutiable instrument", "Rents a hotel room for one night", "Views a property", "Registers as a salesperson"], "ans": 0, "exp": "Buyer's Stamp Duty applies to dutiable acquisitions of Singapore property.", "topic": "P2 Stamp Duty"}, {"q": "A salesperson discovers a material error in a live advertisement. The proper course is to:", "opts": ["Correct/remove the inaccurate information promptly", "Leave it until someone complains", "Blame the portal", "Continue using it because it already has views"], "ans": 0, "exp": "Professional marketing requires prompt correction of known inaccuracies.", "topic": "P2 Advertising"}, {"q": "If a buyer pays 25% cash/CPF equity on a $1,000,000 purchase before other costs, the amount is:", "opts": ["$250,000", "$25,000", "$750,000", "$100,000"], "ans": 0, "exp": "25% × $1,000,000 = $250,000.", "topic": "P2 Calculation"}, {"q": "If commission is contractually agreed at 2% of a $1,500,000 transaction price before GST, the base commission is:", "opts": ["$30,000", "$3,000", "$15,000", "$300,000"], "ans": 0, "exp": "2% × $1,500,000 = $30,000 before applicable GST.", "topic": "P2 Calculation"}, {"q": "A landlord and tenant agree to replace the tenant with a new tenant and release the old tenant, with all relevant parties consenting. This is most consistent with:", "opts": ["Novation", "Easement", "Mortgage", "Caveat"], "ans": 0, "exp": "Novation substitutes a contracting party with consent and creates the new contractual relationship.", "topic": "P1 Landlord Tenant"}, {"q": "The Estate Agents Act framework primarily regulates:", "opts": ["Estate agency work, estate agents and salespersons", "Only architects", "Only property developers", "Only mortgage banks"], "ans": 0, "exp": "The estate agency industry is regulated under the Estate Agents Act and subsidiary regulations.", "topic": "P2 Regulation"}, {"q": "A caveat found during a title search should:", "opts": ["Be investigated to understand the claimed interest before proceeding", "Always be ignored", "Be treated as furniture", "Automatically be deleted by the salesperson"], "ans": 0, "exp": "A caveat signals a claimed interest and should be addressed through proper legal/conveyancing processes.", "topic": "P2 Conveyancing"}, {"q": "The mortgagor is generally:", "opts": ["The borrower/property owner granting the mortgage security", "The lender only", "The tenant's agent", "The planning authority"], "ans": 0, "exp": "The mortgagor grants the mortgage; the mortgagee is the secured lender.", "topic": "P1 Mortgage"}, {"q": "A salesperson knowingly states a false material fact that induces a buyer to contract. The most relevant issue is:", "opts": ["Misrepresentation", "Easement", "Mortgage priority", "Adverse possession"], "ans": 0, "exp": "A false material statement inducing a contract raises misrepresentation issues.", "topic": "P1 Contract"}, {"q": "A collective sale (en bloc) involves:", "opts": ["A statutory/collective process for sale of strata development interests subject to applicable requirements", "A normal one-room tenancy", "An HDB room rental", "A mortgage refinancing only"], "ans": 0, "exp": "Collective sales are governed by specific statutory processes and thresholds/procedures.", "topic": "P2 Collective Sale"}, {"q": "Negligence generally requires consideration of:", "opts": ["Duty of care, breach, causation and legally recognised loss", "Only whether a contract exists", "Only whether commission was paid", "Only whether title is freehold"], "ans": 0, "exp": "Negligence analysis typically asks whether a duty existed, it was breached, and the breach caused recoverable damage.", "topic": "P1 Negligence"}];
let i=0,score=0,locked=false;
const letters=['A','B','C','D'];
function render(){
 locked=false;
 if(i>=qs.length){finish();return}
 const q=qs[i];
 document.getElementById('num').textContent=(i+1)+' / '+qs.length;
 document.getElementById('score').textContent='Score: '+score;
 document.getElementById('bar').style.width=(i/qs.length*100)+'%';
 document.getElementById('topic').textContent=q.topic;
 document.getElementById('question').textContent=q.q;
 const box=document.getElementById('options');box.innerHTML='';
 q.opts.forEach((o,k)=>{let b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+letters[k]+'.</b> '+o;b.onclick=()=>choose(k,b);box.appendChild(b)});
 let f=document.getElementById('feedback');f.className='feedback';f.innerHTML='';
 document.getElementById('next').style.display='none';
}
function choose(k,b){
 if(locked)return;locked=true;
 const q=qs[i], buttons=[...document.querySelectorAll('.opt')];
 buttons.forEach(x=>x.disabled=true);buttons[q.ans].classList.add('correct');
 const f=document.getElementById('feedback');
 if(k===q.ans){score++;f.className='feedback good';f.innerHTML='<b>✓ Correct.</b> '+q.exp}
 else{b.classList.add('wrong');f.className='feedback bad';f.innerHTML='<b>✗ Not quite. Correct answer: '+letters[q.ans]+'.</b><br>'+q.exp}
 document.getElementById('score').textContent='Score: '+score;
 document.getElementById('next').style.display='inline-block';
}
function nextQ(){i++;render()}
function finish(){
 document.getElementById('bar').style.width='100%';
 let pct=Math.round(score/qs.length*100),msg=pct>=80?'Strong attempt — move on, then revisit your wrong answers.':pct>=60?'Getting there — review the explanations and retry later.':'Use this set as revision: focus on why each wrong option was wrong.';
 document.getElementById('quiz').innerHTML='<div class="card end"><h2>'+score+' / '+qs.length+' ('+pct+'%)</h2><p>'+msg+'</p><button class="restart" onclick="location.reload()">Try Again</button><p class="small">Practice material only. Always check current CEA/HDB/IRAS/URA rules for policy-sensitive topics.</p></div>';
}
render();
</script></body></html>
