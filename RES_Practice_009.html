<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RES Practice #009</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#65708a;--accent:#315efb;--good:#137a43;--bad:#b42318}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:820px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#172554,#315efb);color:white;padding:25px;border-radius:20px;box-shadow:0 8px 24px #0002}
.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:4px 0;opacity:.92}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.pill{background:white;border-radius:999px;padding:9px 14px;box-shadow:0 3px 12px #0001;font-weight:bold}.progress{height:10px;background:#dce3f2;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:var(--accent);width:0}
.card{background:var(--card);padding:22px;border-radius:18px;box-shadow:0 5px 20px #0001;margin-top:14px}.tag{font-size:12px;color:var(--muted);font-weight:bold;text-transform:uppercase}
.q{font-size:20px;line-height:1.42;margin:10px 0 18px}.opt{width:100%;text-align:left;border:1px solid #d8deea;background:white;padding:13px 15px;margin:7px 0;border-radius:12px;font-size:16px;cursor:pointer}
.opt:hover{border-color:var(--accent);background:#f7f9ff}.opt:disabled{cursor:default}.correct{border-color:#54b67a!important;background:#edf9f1!important}.wrong{border-color:#e57a72!important;background:#fff0ef!important}
.feedback{display:none;margin-top:15px;padding:14px;border-radius:12px;line-height:1.45}.good{display:block;background:#edf9f1;color:#0b6335}.bad{display:block;background:#fff0ef;color:#8f1d16}
button.next{display:none;margin-top:15px;border:0;background:var(--accent);color:white;padding:12px 18px;border-radius:11px;font-weight:bold;cursor:pointer}.end{text-align:center}.end h2{font-size:30px}
.small{font-size:13px;color:var(--muted);line-height:1.45}.restart{border:0;background:var(--accent);color:#fff;padding:12px 18px;border-radius:11px;font-weight:bold;cursor:pointer}
</style></head><body><div class="wrap">
<div class="hero"><h1>🏠 RES Practice #009</h1><p>20 questions · Mixed Paper 1 & Paper 2 · Practice Mode</p><p>Target: 16/20 (80%)</p></div>
<div id="quiz"><div class="stats"><div class="pill" id="num"></div><div class="pill" id="score"></div></div><div class="progress"><div class="bar" id="bar"></div></div>
<div class="card"><div class="tag" id="topic"></div><div class="q" id="question"></div><div id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next" onclick="nextQ()">Next Question →</button></div>
<p class="small">These are revision questions, not official CEA examination questions. Policy-sensitive answers are framed to current official information checked in Oct 2026.</p></div></div>
<script>const qs=[{"q": "A warranty in a contract is generally:", "opts": ["A term whose breach ordinarily sounds in damages without automatically ending the contract", "Always a criminal offence", "The same as ownership title", "An easement"], "ans": 0, "exp": "Breach of warranty generally gives a damages remedy rather than a right to terminate solely because of that breach.", "topic": "P1 Contract"}, {"q": "A non-exclusive listing generally allows:", "opts": ["The client to appoint more than one estate agent, subject to the agreements", "Only one salesperson in Singapore to market it", "No written terms", "No commission in any circumstance"], "ans": 0, "exp": "Non-exclusive appointments permit multiple agencies subject to their terms and applicable rules.", "topic": "P2 Listing"}, {"q": "A salesperson presenting market data should:", "opts": ["Identify reliable sources and avoid cherry-picking data that misleads the client", "Use only the highest transaction ever", "Invent transactions if supply is low", "Guarantee future appreciation"], "ans": 0, "exp": "Professional advice should be evidence-based, balanced and not misleading.", "topic": "P2 Marketing"}, {"q": "An advertisement uses 'sea view forever' although an approved development may obstruct it. The claim is risky because:", "opts": ["It may be misleading and future views cannot be guaranteed without proper basis", "Views are legally guaranteed by every sale", "Advertisements need not be accurate", "Only buyers are responsible for all claims"], "ans": 0, "exp": "Absolute unsupported claims about future conditions can mislead consumers.", "topic": "P2 Advertising"}, {"q": "A trust separates, conceptually:", "opts": ["Legal ownership/control from beneficial interest", "Freehold from leasehold only", "Residential from industrial zoning", "Buyer from seller's agent"], "ans": 0, "exp": "Trusts distinguish legal title/trustee functions from beneficial ownership enjoyed by beneficiaries.", "topic": "P1 Trust"}, {"q": "An exclusive estate agency agreement generally differs from a non-exclusive agreement because:", "opts": ["Only the appointed estate agent has the agreed exclusive appointment for the specified period, subject to the agreement", "It transfers ownership to the estate agent", "It removes the seller's legal capacity", "It is always perpetual"], "ans": 0, "exp": "Exclusivity concerns the scope of appointment during the agreed period; it does not transfer ownership.", "topic": "P1 Agency"}, {"q": "A buyer asks whether an ABSD remission definitely applies. The salesperson should:", "opts": ["Check current IRAS conditions and recommend tax/legal advice where facts are complex", "Guarantee remission based on memory", "Ignore deadlines", "Assume marriage always removes ABSD"], "ans": 0, "exp": "Remissions are conditional and time-sensitive; current official rules should be verified.", "topic": "P2 Stamp Duty"}, {"q": "A residential property acquired before the 4 July 2025 SSD change should be assessed using:", "opts": ["The SSD rules applicable to its acquisition date", "Automatically the newest four-year rule regardless of acquisition date", "No SSD rules", "HDB MOP rules only"], "ans": 0, "exp": "SSD treatment depends on acquisition date; the July 2025 change applies to acquisitions on/after its effective date.", "topic": "P2 Stamp Duty"}, {"q": "The purpose of damages for breach of contract is generally to:", "opts": ["Punish every breach criminally", "Compensate for legally recoverable loss caused by the breach", "Transfer title automatically", "Cancel all taxes"], "ans": 1, "exp": "Contract damages are principally compensatory, subject to rules on causation, remoteness and mitigation.", "topic": "P1 Contract"}, {"q": "For joint residential purchasers with different ABSD profiles, IRAS generally applies:", "opts": ["The highest applicable ABSD rate to the entire property value, subject to remission rules", "The lowest rate automatically", "No ABSD ever", "An average of the two rates in all cases"], "ans": 0, "exp": "IRAS states the highest applicable ABSD rate generally applies for joint buyers of different profiles, subject to relevant remission provisions.", "topic": "P2 Stamp Duty"}, {"q": "A buyer asks whether a strata unit includes a particular car park as an accessory lot. The salesperson should:", "opts": ["Verify the title/strata documents", "Assume every car park belongs to the nearest unit", "Rely on the seller's memory only", "Check the paint colour"], "ans": 0, "exp": "Legal ownership of strata/accessory lots should be established from title and strata documentation.", "topic": "P2 Strata"}, {"q": "A buyer purchases at $900,000 and has $180,000 available as equity before costs. Equity is what percentage of price?", "opts": ["20%", "10%", "25%", "80%"], "ans": 0, "exp": "$180,000 ÷ $900,000 = 20%.", "topic": "P2 Calculation"}, {"q": "Which agency regulates the real estate agency industry and salespersons?", "opts": ["CEA", "URA", "SLA", "CPF Board"], "ans": 0, "exp": "CEA regulates estate agencies and salespersons under the Estate Agents Act framework.", "topic": "P1 Agencies"}, {"q": "Loan-to-value (LTV) limits primarily affect:", "opts": ["The maximum proportion of property value/price that may be financed by the housing loan, subject to rules", "The property's zoning", "The seller's legal capacity", "The MCST's by-laws"], "ans": 0, "exp": "LTV controls the proportion that can be financed, subject to borrower/loan circumstances and prevailing rules.", "topic": "P2 Finance"}, {"q": "A tenant asks to sublet despite a clause prohibiting subletting without landlord consent. The salesperson should:", "opts": ["Point out the covenant and obtain required consent rather than ignore it", "Say all tenants have an absolute right to sublet", "Create a new title", "Tell the tenant to conceal it"], "ans": 0, "exp": "Lease covenants and required consent must be respected.", "topic": "P2 Leasing"}, {"q": "Before representing that a property may lawfully be rented to a particular occupier/use, a salesperson should:", "opts": ["Check applicable HDB/URA/other occupancy and use rules", "Assume every property permits every use", "Rely only on the tenant's verbal assurance", "Ignore occupancy limits"], "ans": 0, "exp": "Permitted use, occupancy and letting restrictions are regulatory matters that should be verified.", "topic": "P2 Leasing"}, {"q": "A salesperson facing a conflict between personal interest and a client's interest should:", "opts": ["Properly disclose/manage the conflict and comply with professional duties", "Hide it if the deal is profitable", "Always favour personal interest", "Ask the other salesperson to hide it"], "ans": 0, "exp": "Conflicts must be properly disclosed and managed; fiduciary/professional duties remain important.", "topic": "P2 Ethics"}, {"q": "Privity of contract between original landlord and tenant arises because:", "opts": ["They are parties to the tenancy contract", "They own neighbouring land", "They use the same salesperson", "They pay the same tax rate"], "ans": 0, "exp": "Privity of contract is the legal relationship between contracting parties.", "topic": "P1 Landlord Tenant"}, {"q": "A person holds legal title solely for another person's benefit under an express arrangement. The relationship is most consistent with:", "opts": ["Trust", "Easement", "Licence", "Periodic tenancy"], "ans": 0, "exp": "A trust can separate legal title held by trustee from beneficial interest held for beneficiary.", "topic": "P1 Trust"}, {"q": "For the 2026 RES examination, Paper 2 includes topics on:", "opts": ["Regulation/marketing and property transactions", "Only land law", "Only valuation mathematics", "Only building construction"], "ans": 0, "exp": "CEA's current syllabus places Competency Units 3 and 4 in Paper 2.", "topic": "P2 Overview"}];
let i=0,score=0,locked=false;
const letters=['A','B','C','D'];
function render(){
 locked=false;
 if(i>=qs.length){finish();return}
 const q=qs[i];
 document.getElementById('num').textContent=(i+1)+' / '+qs.length;
 document.getElementById('score').textContent='Score: '+score;
 document.getElementById('bar').style.width=(i/qs.length*100)+'%';
 document.getElementById('topic').textContent=q.topic;
 document.getElementById('question').textContent=q.q;
 const box=document.getElementById('options');box.innerHTML='';
 q.opts.forEach((o,k)=>{let b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+letters[k]+'.</b> '+o;b.onclick=()=>choose(k,b);box.appendChild(b)});
 let f=document.getElementById('feedback');f.className='feedback';f.innerHTML='';
 document.getElementById('next').style.display='none';
}
function choose(k,b){
 if(locked)return;locked=true;
 const q=qs[i], buttons=[...document.querySelectorAll('.opt')];
 buttons.forEach(x=>x.disabled=true);buttons[q.ans].classList.add('correct');
 const f=document.getElementById('feedback');
 if(k===q.ans){score++;f.className='feedback good';f.innerHTML='<b>✓ Correct.</b> '+q.exp}
 else{b.classList.add('wrong');f.className='feedback bad';f.innerHTML='<b>✗ Not quite. Correct answer: '+letters[q.ans]+'.</b><br>'+q.exp}
 document.getElementById('score').textContent='Score: '+score;
 document.getElementById('next').style.display='inline-block';
}
function nextQ(){i++;render()}
function finish(){
 document.getElementById('bar').style.width='100%';
 let pct=Math.round(score/qs.length*100),msg=pct>=80?'Strong attempt — move on, then revisit your wrong answers.':pct>=60?'Getting there — review the explanations and retry later.':'Use this set as revision: focus on why each wrong option was wrong.';
 document.getElementById('quiz').innerHTML='<div class="card end"><h2>'+score+' / '+qs.length+' ('+pct+'%)</h2><p>'+msg+'</p><button class="restart" onclick="location.reload()">Try Again</button><p class="small">Practice material only. Always check current CEA/HDB/IRAS/URA rules for policy-sensitive topics.</p></div>';
}
render();
</script></body></html>
