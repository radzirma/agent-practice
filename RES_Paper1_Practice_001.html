<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RES Paper 1 Practice 1</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;margin:0;background:#f4f6f8;color:#18212b}.wrap{max-width:820px;margin:auto;padding:18px}.card{background:white;border-radius:16px;padding:22px;box-shadow:0 4px 20px #0001;margin-top:14px}h1{font-size:1.45rem;margin:.2rem 0}.sub{color:#5c6875}.top{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}.pill{background:#eef2f6;padding:8px 12px;border-radius:999px;font-weight:700}.bar{height:9px;background:#e6ebef;border-radius:8px;overflow:hidden;margin:14px 0}.bar>div{height:100%;background:#1f7a4d;width:0}.topic{font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#667}.q{font-size:1.12rem;font-weight:750;line-height:1.45;margin:10px 0 16px}button.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin:9px 0;border:1px solid #cfd7df;border-radius:11px;background:#fff;font-size:1rem;cursor:pointer}button.opt:hover{background:#f7f9fb}button.opt.correct{background:#e7f6ec;border-color:#3a9b61}button.opt.wrong{background:#fdeaea;border-color:#c95151}button:disabled{cursor:default;color:inherit}.feedback{display:none;margin-top:15px;padding:13px;border-radius:10px;background:#f3f6f8;line-height:1.45}.next{display:none;margin-top:15px;border:0;border-radius:10px;background:#18212b;color:#fff;padding:12px 18px;font-weight:800;cursor:pointer}.result{display:none;text-align:center}.big{font-size:2.2rem;font-weight:900}.home{color:#185b9d;text-decoration:none}@media(max-width:520px){.wrap{padding:10px}.card{padding:16px}}</style></head><body><div class="wrap"><a class="home" href="index.html">← All Paper 1 Sets</a><div class="card"><div class="top"><div><h1>RES Paper 1 — Practice 1</h1><div class="sub">20 questions • Medium difficulty • Training-note based</div></div><div><span class="pill" id="timer">00:00</span> <span class="pill" id="score">0/20</span></div></div><div class="bar"><div id="prog"></div></div><div id="quiz"><div class="topic" id="topic"></div><div class="q" id="q"></div><div id="opts"></div><div class="feedback" id="fb"></div><button class="next" id="next">Next question →</button></div><div class="result" id="result"><div class="big" id="final"></div><p id="timefinal"></p><p id="summary"></p><button class="next" style="display:inline-block" onclick="location.reload()">Try again</button> <a href="index.html"><button class="next" style="display:inline-block">Choose another set</button></a></div></div></div>
<script>const qs=[{"topic": "Planning & Development", "q": "A buyer wants to know whether a shophouse site may legally be redeveloped for a substantially different use. Which information is MOST directly relevant first?", "opts": ["The planning zoning and applicable development controls", "The owner’s preferred selling price", "The age of the existing building only", "The amount of the existing mortgage"], "ans": 0, "exp": "Planning zoning and development controls determine what uses and development parameters may be permitted."}, {"topic": "Planning & Development", "q": "A proposed development exceeds the intensity allowed under the prevailing planning parameters. Which issue should the salesperson recognise?", "opts": ["The title automatically becomes void", "The proposal may require planning approval and cannot be assumed permissible", "The buyer automatically obtains an easement", "The property becomes personal property"], "ans": 1, "exp": "Development intensity is a planning matter; exceeding parameters cannot simply be assumed to be allowed."}, {"topic": "Government Agencies", "q": "Which agency is MOST closely associated with land-use planning and the Master Plan in Singapore?", "opts": ["IRAS", "MAS", "URA", "LTA"], "ans": 2, "exp": "URA is the planning authority associated with land-use planning and the Master Plan."}, {"topic": "Government Agencies", "q": "A client asks about property tax assessment. Which agency is the most relevant?", "opts": ["SLA", "BCA", "JTC", "IRAS"], "ans": 3, "exp": "IRAS administers property tax matters."}, {"topic": "Government Agencies", "q": "A client wants official land title and land information. Which agency is most directly relevant?", "opts": ["SLA", "MAS", "HDB", "BCA"], "ans": 0, "exp": "SLA is the key agency for State land and land/title information services."}, {"topic": "Government Agencies", "q": "Which agency is most directly associated with regulation of banks and housing-loan macroprudential measures?", "opts": ["URA", "MAS", "JTC", "LTA"], "ans": 1, "exp": "MAS is Singapore’s financial regulator and is relevant to financing controls."}, {"topic": "Real Estate Market", "q": "Which is a macro factor that may affect property demand across several market segments?", "opts": ["A leaking tap in one unit", "A seller repainting one bedroom", "Interest-rate movements", "A single tenant renewing a lease"], "ans": 2, "exp": "Interest rates are a broad macroeconomic factor that can affect demand and prices."}, {"topic": "Real Estate Market", "q": "Two condominiums are physically similar but located in different districts and attract different buyer groups. This best illustrates that real estate markets are:", "opts": ["Perfectly homogeneous", "Identical to stock markets", "Free from location effects", "Segmented into submarkets"], "ans": 3, "exp": "Property markets function through submarkets by type, location and socioeconomic characteristics."}, {"topic": "Real Estate Market", "q": "Which statement BEST distinguishes direct real estate from a listed REIT investment?", "opts": ["A REIT unit is an interest in a listed investment vehicle rather than direct title to a specific unit", "Direct real estate is always more liquid", "REITs cannot own real estate", "Direct property has no transaction costs"], "ans": 0, "exp": "REIT investors own units in the investment vehicle, not direct title to a specific property."}, {"topic": "Real Estate Market", "q": "A developer builds new condominium units for sale. In the property market, the developer is primarily a:", "opts": ["Tenant-consumer", "Supplier/producer of new property product", "Mortgagee only", "Government regulator"], "ans": 1, "exp": "Developers add new property product to market supply."}, {"topic": "Real Estate Market", "q": "An owner buys a shop and operates his own business from it. He is best described as a:", "opts": ["Landlord only", "Tenant", "Owner-user", "Facilitator"], "ans": 2, "exp": "An owner-user both owns and occupies/uses the property."}, {"topic": "Real Estate Market", "q": "Banks, lawyers and estate agents are commonly grouped as which type of market participant?", "opts": ["Developers", "Tenants", "Owner-users", "Facilitators"], "ans": 3, "exp": "They facilitate property transactions rather than primarily produce or consume space."}, {"topic": "Real Estate Market", "q": "A cooling measure reduces the ability of some purchasers to finance additional properties. The MOST likely immediate market effect is on:", "opts": ["Demand", "Physical land area", "Building age", "Legal definition of land"], "ans": 0, "exp": "Cooling measures commonly influence demand and purchasing capacity."}, {"topic": "Exam Application", "q": "A question gives market transaction statistics and asks what trend is supported by the data. Which competency level is being tested most directly?", "opts": ["Remembering a definition only", "Applying/interpreting information", "Reciting an agency name only", "Spelling legal terminology"], "ans": 1, "exp": "The notes classify sourcing and interpreting market data as an application-level skill."}, {"topic": "Land", "q": "Which item is MOST likely part of “land” in the legal sense?", "opts": ["A tenant’s removable suitcase", "A visitor’s mobile phone", "A naturally rooted tree", "Loose dining chairs"], "ans": 2, "exp": "The legal concept of land includes the surface, buildings, trees/plants, minerals and relevant airspace."}, {"topic": "Fixtures", "q": "A heavy machine is bolted to the floor specifically so that it functions as a permanent part of the premises. Which is the BEST approach to deciding whether it is a fixture?", "opts": ["Look only at its purchase price", "Treat every machine as a chattel", "Ask whether it is insured", "Apply degree and purpose of annexation"], "ans": 3, "exp": "The fixture analysis focuses on degree and purpose/object of annexation."}, {"topic": "Fixtures", "q": "A decorative sculpture rests on its own weight and can be removed without damage. It was placed merely for display. It is MOST likely:", "opts": ["A chattel", "A fixture", "An easement", "A covenant"], "ans": 0, "exp": "An item resting by its own weight for display is more likely a chattel, subject to the fixture tests."}, {"topic": "Fixtures", "q": "Why does the fixture/chattel distinction matter in a property sale?", "opts": ["Chattels automatically become easements", "Fixtures generally pass with the land unless otherwise dealt with", "Fixtures cannot be owned", "Chattels are always registered on title"], "ans": 1, "exp": "Common-law fixtures are generally transferred with the land, while chattels remain personal property unless included."}, {"topic": "Land", "q": "Which is an example of an incorporeal hereditament?", "opts": ["Soil", "Building", "Easement", "Swimming pool structure"], "ans": 2, "exp": "An easement is an intangible right relating to land and is an incorporeal hereditament."}, {"topic": "Land", "q": "Which is an example of a corporeal hereditament?", "opts": ["Restrictive covenant", "Easement", "Licence", "Building"], "ans": 3, "exp": "Buildings are tangible components of land and are corporeal hereditaments."}];let i=0,score=0,answered=false;const start=Date.now();const letters=['A','B','C','D'];function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}setInterval(()=>{document.getElementById('timer').textContent=fmt(Math.floor((Date.now()-start)/1000))},1000);function render(){answered=false;let x=qs[i];topic.textContent=x.topic;q.textContent=(i+1)+'. '+x.q;opts.innerHTML='';fb.style.display='none';next.style.display='none';x.opts.forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+letters[j]+'.</b> '+o;b.onclick=()=>pick(j,b);opts.appendChild(b)});prog.style.width=((i)/qs.length*100)+'%';scoreEl()}function scoreEl(){document.getElementById('score').textContent=score+'/20'}function pick(j,b){if(answered)return;answered=true;let x=qs[i];[...opts.children].forEach((el,k)=>{el.disabled=true;if(k===x.ans)el.classList.add('correct')});if(j===x.ans){score++;fb.innerHTML='<b>Correct.</b> '+x.exp}else{b.classList.add('wrong');fb.innerHTML='<b>Not quite.</b> Correct answer: <b>'+letters[x.ans]+'. '+x.opts[x.ans]+'</b><br>'+x.exp}fb.style.display='block';next.style.display='inline-block';scoreEl()}next.onclick=()=>{i++;if(i<qs.length)render();else finish()};function finish(){quiz.style.display='none';result.style.display='block';prog.style.width='100%';let sec=Math.floor((Date.now()-start)/1000),pct=Math.round(score/qs.length*100);final.textContent=score+'/20 ('+pct+'%)';timefinal.textContent='Time taken: '+fmt(sec);summary.textContent=pct>=80?'Strong result. Review any misses, then move to the next set.':pct>=60?'Pass-range practice score, but review the explanations before moving on.':'Good diagnostic attempt — review the weak topics and retry later.'}render();</script></body></html>
