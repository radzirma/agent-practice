<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RES Practice #003</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#65708a;--accent:#315efb;--good:#137a43;--bad:#b42318}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:820px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#172554,#315efb);color:white;padding:25px;border-radius:20px;box-shadow:0 8px 24px #0002}
.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:4px 0;opacity:.92}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.pill{background:white;border-radius:999px;padding:9px 14px;box-shadow:0 3px 12px #0001;font-weight:bold}.progress{height:10px;background:#dce3f2;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:var(--accent);width:0}
.card{background:var(--card);padding:22px;border-radius:18px;box-shadow:0 5px 20px #0001;margin-top:14px}.tag{font-size:12px;color:var(--muted);font-weight:bold;text-transform:uppercase}
.q{font-size:20px;line-height:1.42;margin:10px 0 18px}.opt{width:100%;text-align:left;border:1px solid #d8deea;background:white;padding:13px 15px;margin:7px 0;border-radius:12px;font-size:16px;cursor:pointer}
.opt:hover{border-color:var(--accent);background:#f7f9ff}.opt:disabled{cursor:default}.correct{border-color:#54b67a!important;background:#edf9f1!important}.wrong{border-color:#e57a72!important;background:#fff0ef!important}
.feedback{display:none;margin-top:15px;padding:14px;border-radius:12px;line-height:1.45}.good{display:block;background:#edf9f1;color:#0b6335}.bad{display:block;background:#fff0ef;color:#8f1d16}
button.next{display:none;margin-top:15px;border:0;background:var(--accent);color:white;padding:12px 18px;border-radius:11px;font-weight:bold;cursor:pointer}.end{text-align:center}.end h2{font-size:30px}
.small{font-size:13px;color:var(--muted);line-height:1.45}.restart{border:0;background:var(--accent);color:#fff;padding:12px 18px;border-radius:11px;font-weight:bold;cursor:pointer}
</style></head><body><div class="wrap">
<div class="hero"><h1>🏠 RES Practice #003</h1><p>20 questions · Mixed Paper 1 & Paper 2 · Practice Mode</p><p>Target: 16/20 (80%)</p></div>
<div id="quiz"><div class="stats"><div class="pill" id="num"></div><div class="pill" id="score"></div></div><div class="progress"><div class="bar" id="bar"></div></div>
<div class="card"><div class="tag" id="topic"></div><div class="q" id="question"></div><div id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next" onclick="nextQ()">Next Question →</button></div>
<p class="small">These are revision questions, not official CEA examination questions. Policy-sensitive answers are framed to current official information checked in Oct 2026.</p></div></div>
<script>const qs=[{"q": "A built-in cabinet firmly attached as part of a home's permanent design is more likely to be:", "opts": ["A fixture", "A licence", "An easement", "A chose in action"], "ans": 0, "exp": "Its attachment and intended permanent use point toward fixture status.", "topic": "P1 Fixtures"}, {"q": "Which document is associated with an individual strata lot?", "opts": ["Subsidiary strata certificate of title", "Passport", "Certificate of incorporation only", "Property tax bill only"], "ans": 0, "exp": "Strata lots are associated with subsidiary strata title documentation.", "topic": "P1 Title"}, {"q": "A contract's object is unlawful. Which essential contract requirement is most directly missing?", "opts": ["Legality", "Postal district", "Mortgage priority", "Zoning classification only"], "ans": 0, "exp": "A valid contract requires a lawful object/purpose.", "topic": "P1 Contract"}, {"q": "Tenancy in common differs from joint tenancy because tenants in common:", "opts": ["Hold distinct undivided shares with no right of survivorship", "Can never sell their shares", "Must hold equal shares", "Are always spouses"], "ans": 0, "exp": "Tenants in common have distinct shares, which may be unequal, and no survivorship applies.", "topic": "P1 Co-ownership"}, {"q": "A subsidiary proprietor in a strata development generally owns:", "opts": ["The strata lot and an interest/share in common property according to strata framework", "Only the common corridor", "No proprietary interest", "The entire development alone"], "ans": 0, "exp": "Strata ownership combines title to the lot with an associated share in common property.", "topic": "P2 Strata"}, {"q": "A salesperson should not promise a buyer that an MCST will approve a renovation because:", "opts": ["Approval depends on applicable by-laws/rules and the relevant decision-maker", "Salespersons control MCST decisions", "All renovations are automatically approved", "Renovation never requires approval"], "ans": 0, "exp": "The salesperson cannot guarantee another body's approval; requirements should be verified.", "topic": "P2 Strata"}, {"q": "A registered mortgage shown on a title is:", "opts": ["A registered interest/encumbrance affecting the property", "Proof the property is fully paid", "A tenancy agreement", "A planning permission"], "ans": 0, "exp": "A legal mortgage is an interest/encumbrance that may be reflected on the title.", "topic": "P1 Mortgage"}, {"q": "In a tenancy transaction, an inventory list is useful mainly to:", "opts": ["Record items/condition relevant to handover and later disputes", "Transfer legal title to the tenant", "Set zoning", "Calculate ABSD"], "ans": 0, "exp": "A clear inventory/condition record can reduce disputes about contents and condition.", "topic": "P2 Leasing"}, {"q": "A seller promises to repair a minor cupboard before completion. If legally classified only as a warranty and breached, the usual remedy is more likely:", "opts": ["Damages rather than automatic termination", "Automatic transfer of title to buyer", "Criminal conviction", "Creation of easement"], "ans": 0, "exp": "Breach of warranty ordinarily leads to damages rather than a right to terminate solely for that breach.", "topic": "P1 Contract"}, {"q": "A seller bought a residential property in 2024. To assess SSD, the salesperson should:", "opts": ["Apply the rules tied to the property's acquisition date rather than blindly using the post-4-Jul-2025 regime", "Always use a four-year period", "Assume SSD never applies", "Use ABSD rates instead"], "ans": 0, "exp": "SSD regimes depend on acquisition date; current changes are not automatically retroactive.", "topic": "P2 Stamp Duty"}, {"q": "Marketing an industrial unit as suitable for any business whatsoever is risky because:", "opts": ["Industrial premises are subject to planning/use controls and approvals", "Industrial property has no permitted-use rules", "Every business is automatically industrial", "Zoning applies only to HDB"], "ans": 0, "exp": "Industrial premises have permitted-use/planning requirements; suitability must be verified.", "topic": "P2 Industrial"}, {"q": "An agent's fiduciary duty requires the agent primarily to:", "opts": ["Put undisclosed personal interests first", "Act loyally and in the principal's interests within the agency", "Guarantee a profit", "Ignore conflicts"], "ans": 1, "exp": "Fiduciary duties include loyalty, good faith and proper management/disclosure of conflicts.", "topic": "P1 Agency"}, {"q": "The Total Debt Servicing Ratio (TDSR) framework is concerned with:", "opts": ["A borrower's total monthly debt obligations relative to income under prevailing rules", "The property's floor area", "The seller's commission", "The remaining lease only"], "ans": 0, "exp": "TDSR is a borrower-level debt-servicing framework used in property financing.", "topic": "P2 Finance"}, {"q": "An agent is expressly authorised to accept offers only above $1.5m but privately accepts $1.4m without authority. The first issue to examine is:", "opts": ["Scope of the agent's authority", "Fixture status", "Zoning", "Mortgage redemption"], "ans": 0, "exp": "Whether the agent could bind the principal depends first on actual/apparent authority and the surrounding facts.", "topic": "P1 Agency"}, {"q": "A buyer says, 'The bank gave me an in-principle assessment, so the property is definitely affordable.' The salesperson should:", "opts": ["Explain that final financing, duties and other costs still need verification", "Guarantee the loan", "Ignore stamp duty", "Treat in-principle assessment as final legal approval"], "ans": 0, "exp": "In-principle financing is not the same as final approval and buyers must consider total transaction costs.", "topic": "P2 Finance"}, {"q": "A right of way over a neighbour's land is a common example of:", "opts": ["An easement", "A mortgage", "A trust", "A periodic tenancy"], "ans": 0, "exp": "A right of way is a classic easement.", "topic": "P1 Easements"}, {"q": "ABSD liability is determined by the buyer's profile:", "opts": ["On the date of purchase/acquisition", "Five years after completion", "When the property is eventually sold", "When the salesperson advertises it"], "ans": 0, "exp": "IRAS determines applicable ABSD based on the buyer's profile at the date of purchase.", "topic": "P2 Stamp Duty"}, {"q": "The HFE Letter is relevant to an HDB resale buyer because it consolidates information relating to:", "opts": ["Eligibility to buy, grants and HDB housing loan eligibility where applicable", "Private condo MCST voting only", "Industrial zoning", "Seller's property tax only"], "ans": 0, "exp": "The HFE process helps buyers understand HDB purchase eligibility and relevant housing support/financing eligibility.", "topic": "P2 HDB"}, {"q": "A tenancy security deposit is generally:", "opts": ["Held/used according to the tenancy agreement and applicable law, not automatically the landlord's income", "Always non-refundable regardless of terms", "A substitute for stamp duty", "A mortgage"], "ans": 0, "exp": "Deposit rights depend on the tenancy terms and applicable law; it is not automatically forfeited.", "topic": "P2 Leasing"}, {"q": "A salesperson must be registered with:", "opts": ["CEA through the applicable regulatory framework", "URA as a salesperson", "IRAS as an estate agent", "SLA as a valuer"], "ans": 0, "exp": "CEA is the regulator for estate agents and salespersons.", "topic": "P2 Regulation"}];
let i=0,score=0,locked=false;
const letters=['A','B','C','D'];
function render(){
 locked=false;
 if(i>=qs.length){finish();return}
 const q=qs[i];
 document.getElementById('num').textContent=(i+1)+' / '+qs.length;
 document.getElementById('score').textContent='Score: '+score;
 document.getElementById('bar').style.width=(i/qs.length*100)+'%';
 document.getElementById('topic').textContent=q.topic;
 document.getElementById('question').textContent=q.q;
 const box=document.getElementById('options');box.innerHTML='';
 q.opts.forEach((o,k)=>{let b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+letters[k]+'.</b> '+o;b.onclick=()=>choose(k,b);box.appendChild(b)});
 let f=document.getElementById('feedback');f.className='feedback';f.innerHTML='';
 document.getElementById('next').style.display='none';
}
function choose(k,b){
 if(locked)return;locked=true;
 const q=qs[i], buttons=[...document.querySelectorAll('.opt')];
 buttons.forEach(x=>x.disabled=true);buttons[q.ans].classList.add('correct');
 const f=document.getElementById('feedback');
 if(k===q.ans){score++;f.className='feedback good';f.innerHTML='<b>✓ Correct.</b> '+q.exp}
 else{b.classList.add('wrong');f.className='feedback bad';f.innerHTML='<b>✗ Not quite. Correct answer: '+letters[q.ans]+'.</b><br>'+q.exp}
 document.getElementById('score').textContent='Score: '+score;
 document.getElementById('next').style.display='inline-block';
}
function nextQ(){i++;render()}
function finish(){
 document.getElementById('bar').style.width='100%';
 let pct=Math.round(score/qs.length*100),msg=pct>=80?'Strong attempt — move on, then revisit your wrong answers.':pct>=60?'Getting there — review the explanations and retry later.':'Use this set as revision: focus on why each wrong option was wrong.';
 document.getElementById('quiz').innerHTML='<div class="card end"><h2>'+score+' / '+qs.length+' ('+pct+'%)</h2><p>'+msg+'</p><button class="restart" onclick="location.reload()">Try Again</button><p class="small">Practice material only. Always check current CEA/HDB/IRAS/URA rules for policy-sensitive topics.</p></div>';
}
render();
</script></body></html>
