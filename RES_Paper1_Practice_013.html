<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RES Paper 1 Practice #013</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f4f6f8;margin:0;color:#18212b}
.wrap{max-width:760px;margin:auto;padding:20px} .card{background:white;border-radius:16px;padding:22px;box-shadow:0 3px 16px #0001}
h1{font-size:1.45rem;margin:0 0 6px} .meta{color:#65717e;margin-bottom:14px} .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.badge{background:#eef2f6;border-radius:999px;padding:7px 11px;font-weight:650} .bar{height:9px;background:#e8edf2;border-radius:9px;overflow:hidden;margin:14px 0}
.bar>div{height:100%;background:#374151;width:0} .q{font-size:1.08rem;font-weight:700;line-height:1.45;margin:16px 0}
.topic{font-size:.85rem;color:#65717e} button.option{width:100%;text-align:left;padding:13px 14px;margin:7px 0;border:1px solid #ccd4dc;background:#fff;border-radius:11px;font-size:1rem;cursor:pointer}
button.option:hover{background:#f7f9fb} button.option:disabled{cursor:default} .correct{border-color:#25804b!important;background:#eefaf3!important} .wrong{border-color:#b83b3b!important;background:#fff1f1!important}
.feedback{margin-top:14px;padding:13px;border-radius:10px;background:#f5f7fa;line-height:1.45;display:none} .next,.start{border:0;border-radius:10px;background:#1f2937;color:white;padding:12px 18px;font-weight:700;cursor:pointer;margin-top:14px}
.result{text-align:center;display:none} .big{font-size:2.2rem;font-weight:800} small{color:#65717e}
</style></head><body><div class="wrap"><div class="card">
<div id="quiz">
<h1>RES Paper 1 · Practice #013</h1>
<div class="meta">20 questions · Medium / Exam Standard 🟠 · Choices reshuffle every attempt</div>
<div class="top"><span class="badge" id="progress">Question 1 / 20</span><span class="badge" id="score">Score 0</span><span class="badge" id="timer">00:00</span></div>
<div class="bar"><div id="bar"></div></div><div class="topic" id="topic"></div><div class="q" id="q"></div><div id="options"></div>
<div class="feedback" id="feedback"></div><button class="next" id="next" style="display:none">Next Question</button>
</div>
<div class="result" id="result"><h1>Practice #013 Complete</h1><div class="big" id="final"></div><p id="timing"></p><p><small>Retry reshuffles every question's A/B/C/D choices, so learn the answer—not the letter.</small></p><button class="start" id="retry">Retry Practice</button></div>
</div></div>
<script>
const BASE=[{"topic": "L1 Planning", "q": "A buyer asks what zoning in the Master Plan mainly indicates.", "options": ["The broad planning intention for permitted land use", "The registered ownership share of each proprietor", "The guaranteed present use of every unit", "The property's mortgage priority"], "answer": 0, "explanation": "Zoning expresses the broad planning land-use intention; it is not ownership, title priority or a guarantee of every unit's existing use."}, {"topic": "L1 Property", "q": "Which statement best distinguishes direct real estate from a REIT?", "options": ["Direct real estate involves a direct property interest; a REIT is an indirect investment vehicle holding real-estate assets", "A REIT gives every unit-holder title to a particular strata lot", "Direct real estate is necessarily more liquid than a listed REIT", "REITs cannot derive rental income"], "answer": 0, "explanation": "The notes distinguish direct property ownership/interests from investment through a REIT."}, {"topic": "L2 Land", "q": "A freestanding appliance is brought into a flat and is not attached to the land. On these facts alone, it is most likely:", "options": ["A chattel/fitting", "A fixture", "An easement", "A restrictive covenant"], "answer": 0, "explanation": "A movable item not sufficiently annexed is generally treated as a chattel/fitting rather than a fixture."}, {"topic": "L2 Land", "q": "When deciding whether an item has become a fixture, which pair of tests is central?", "options": ["Degree and purpose of annexation", "Price and age of the item", "Ownership and market value", "Planning use and plot ratio"], "answer": 0, "explanation": "The fixture analysis in the notes uses degree and purpose/object of annexation."}, {"topic": "L3 Mortgage", "q": "A legal mortgage is best described as:", "options": ["Security over property for repayment of a debt", "A transfer by gift without consideration", "A personal permission to occupy land", "A right of survivorship"], "answer": 0, "explanation": "The notes define a mortgage as security for a debt/loan."}, {"topic": "L3 State Land", "q": "Land sold under a Government Land Sales lease remains subject to what interest retained by the State?", "options": ["A reversionary interest", "A remainder interest", "A tenancy in common", "An easement by necessity"], "answer": 0, "explanation": "With leasehold State land, the State retains the reversionary interest."}, {"topic": "L4 Caveat", "q": "A buyer has exercised an OTP and thereby acquired an equitable interest pending completion. Which statement best fits the notes?", "options": ["The buyer may have a caveatable interest", "Only the registered proprietor can ever lodge a caveat", "A salesperson may lodge a caveat merely for unpaid commission", "A caveat itself transfers legal title to the buyer"], "answer": 0, "explanation": "The notes use an exercised OTP buyer as an example of a party with an equitable/caveatable interest."}, {"topic": "L4 Easement", "q": "A landowner has a legally recognised right of way across neighbouring land to reach a public road. This is most likely:", "options": ["An easement", "A lease", "A mortgage", "A tenancy at will"], "answer": 0, "explanation": "A right of way over another's land is a classic easement."}, {"topic": "L5 Succession", "q": "A person dies leaving a valid will. Which grant most directly evidences the executor's authority to administer the estate?", "options": ["Grant of probate", "Letters of administration", "Temporary Occupation Licence", "Certificate of title"], "answer": 0, "explanation": "A grant of probate is associated with an executor administering a testate estate."}, {"topic": "L5 Co-ownership", "q": "Which feature best describes tenancy in common?", "options": ["Each co-owner has a distinct undivided share that can pass through the owner's estate", "The survivor automatically takes the deceased's share", "The co-owners have no proprietary interest", "All shares must always be equal"], "answer": 0, "explanation": "Tenants in common hold distinct undivided shares and there is no automatic survivorship."}, {"topic": "L6 Contract", "q": "Which set correctly states the '3Ps' used in the notes for certainty of a real-estate offer?", "options": ["Parties, Property, Price", "Parties, Possession, Period", "Principal, Property, Payment", "Property, Price, Performance"], "answer": 0, "explanation": "The 3Ps are Parties, Property and Price."}, {"topic": "L6 Contract", "q": "A buyer says, 'I accept your offer, provided completion is delayed by two months.' This is most likely:", "options": ["A counter-offer", "An unqualified acceptance", "A completed conveyance", "A deed"], "answer": 0, "explanation": "Changing a term while purporting to accept is a counter-offer rather than an unqualified acceptance."}, {"topic": "L7 Tenancy", "q": "Why does privity of contract exist between the original landlord and tenant?", "options": ["They are parties to the lease contract", "They necessarily own the property jointly", "Every lease is a mortgage", "They occupy the same physical space"], "answer": 0, "explanation": "Privity of contract arises from being parties to the contract."}, {"topic": "L7 Tenancy", "q": "A tenant remains in possession after the lawful tenancy has ended, without a new tenancy being granted. The concept most closely fitting the notes is:", "options": ["Tenancy at sufferance", "Tenancy in common", "Joint tenancy", "Easement by necessity"], "answer": 0, "explanation": "The notes distinguish tenancy at sufferance from fixed and periodic tenancies."}, {"topic": "L8 Agency", "q": "A salesperson receives an offer below the seller's asking price. Which action best reflects the agent's duty in the notes?", "options": ["Transmit the offer to the client rather than suppress it merely because it is low", "Reject it personally without authority", "Ignore it because it is below asking", "Accept it automatically for the seller"], "answer": 0, "explanation": "The agency syllabus includes the duty to transmit all offers to the client."}, {"topic": "L8 Tort", "q": "According to the trainer notes, caveat emptor does not protect against:", "options": ["Negligent or fraudulent misrepresentation", "Every defect a buyer could discover", "Every change in market price", "Every refusal by a seller to accept an offer"], "answer": 0, "explanation": "The trainer questionnaire states caveat emptor does not apply where negligent or fraudulent misrepresentation occurs."}, {"topic": "L9 Market", "q": "Which is the best example of segmenting the property market into submarkets?", "options": ["Analysing condominium demand separately by location and buyer socioeconomic characteristics", "Treating every Singapore property as identical", "Classifying only by the seller's name", "Ignoring property type and location"], "answer": 0, "explanation": "The syllabus describes submarkets by property type, location and socioeconomic characteristics, among other dimensions."}, {"topic": "L9 Market", "q": "Which statement best reflects the notes' comparison of short-term property supply and demand?", "options": ["Supply tends to be relatively inelastic in the short term, while demand can respond more readily to market stimulants", "Both are completely fixed", "Supply is always perfectly elastic", "Demand cannot respond to interest rates"], "answer": 0, "explanation": "Real-estate supply usually takes time to adjust, while demand can respond faster to market conditions."}, {"topic": "L4 Easement", "q": "When the same person comes to own both the dominant and servient tenements, which concept may extinguish the easement?", "options": ["Merger", "Ratification", "Novation", "Frustration"], "answer": 0, "explanation": "The notes cover merger as a way an easement may be extinguished."}, {"topic": "L9 Market", "q": "An increase in mortgage interest rates is most directly what kind of factor affecting property demand?", "options": ["A macro factor that may weaken demand by increasing financing cost", "A fixture test", "A title encumbrance", "A form of tenure"], "answer": 0, "explanation": "Interest rates are macro-economic factors and can affect demand through financing cost."}];
let qs=[],idx=0,score=0,answered=false,startTime=0,timerId=null;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeAttempt(){
 qs=BASE.map(x=>{let arr=x.options.map((t,i)=>({t,ok:i===x.answer}));shuffle(arr);return {...x,choices:arr}});
 idx=0;score=0;answered=false;startTime=Date.now();clearInterval(timerId);timerId=setInterval(tick,1000);tick();
 $("quiz").style.display="block";$("result").style.display="none";render();
}
function tick(){let s=Math.floor((Date.now()-startTime)/1000);$("timer").textContent=fmt(s)}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function render(){
 answered=false;let x=qs[idx];$("progress").textContent=`Question ${idx+1} / ${qs.length}`;$("score").textContent=`Score ${score}`;
 $("bar").style.width=((idx)/qs.length*100)+"%";$("topic").textContent=x.topic;$("q").textContent=x.q;$("feedback").style.display="none";$("next").style.display="none";
 let box=$("options");box.innerHTML="";x.choices.forEach((c,i)=>{let b=document.createElement("button");b.className="option";b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${c.t}`;b.onclick=()=>choose(i,b);box.appendChild(b)})
}
function choose(i,b){
 if(answered)return;answered=true;let x=qs[idx],buttons=[...document.querySelectorAll(".option")];buttons.forEach(z=>z.disabled=true);
 if(x.choices[i].ok){score++;b.classList.add("correct")}else{b.classList.add("wrong");let ci=x.choices.findIndex(c=>c.ok);buttons[ci].classList.add("correct")}
 let ci=x.choices.findIndex(c=>c.ok), letter=String.fromCharCode(65+ci);$("score").textContent=`Score ${score}`;
 $("feedback").innerHTML=`<b>${x.choices[i].ok?"Correct ✓":"Not quite ✗"}</b><br>Correct answer: <b>${letter}. ${x.choices[ci].t}</b><br><br>${x.explanation}`;
 $("feedback").style.display="block";$("next").style.display="inline-block";$("next").textContent=idx===qs.length-1?"See Results":"Next Question";
}
$("next").onclick=()=>{if(idx<qs.length-1){idx++;render()}else finish()};
function finish(){
 clearInterval(timerId);let secs=Math.floor((Date.now()-startTime)/1000),pct=Math.round(score/qs.length*100);
 $("quiz").style.display="none";$("result").style.display="block";$("final").textContent=`${score} / ${qs.length} · ${pct}%`;
 $("timing").textContent=`Total time: ${fmt(secs)} · Average: ${Math.round(secs/qs.length)} sec/question`;
}
$("retry").onclick=makeAttempt;makeAttempt();
</script></body></html>
