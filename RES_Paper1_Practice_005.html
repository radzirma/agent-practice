<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RES Paper 1 Practice 5</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;margin:0;background:#f4f6f8;color:#18212b}.wrap{max-width:820px;margin:auto;padding:18px}.card{background:white;border-radius:16px;padding:22px;box-shadow:0 4px 20px #0001;margin-top:14px}h1{font-size:1.45rem;margin:.2rem 0}.sub{color:#5c6875}.top{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}.pill{background:#eef2f6;padding:8px 12px;border-radius:999px;font-weight:700}.bar{height:9px;background:#e6ebef;border-radius:8px;overflow:hidden;margin:14px 0}.bar>div{height:100%;background:#1f7a4d;width:0}.topic{font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#667}.q{font-size:1.12rem;font-weight:750;line-height:1.45;margin:10px 0 16px}button.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin:9px 0;border:1px solid #cfd7df;border-radius:11px;background:#fff;font-size:1rem;cursor:pointer}button.opt:hover{background:#f7f9fb}button.opt.correct{background:#e7f6ec;border-color:#3a9b61}button.opt.wrong{background:#fdeaea;border-color:#c95151}button:disabled{cursor:default;color:inherit}.feedback{display:none;margin-top:15px;padding:13px;border-radius:10px;background:#f3f6f8;line-height:1.45}.next{display:none;margin-top:15px;border:0;border-radius:10px;background:#18212b;color:#fff;padding:12px 18px;font-weight:800;cursor:pointer}.result{display:none;text-align:center}.big{font-size:2.2rem;font-weight:900}.home{color:#185b9d;text-decoration:none}@media(max-width:520px){.wrap{padding:10px}.card{padding:16px}}</style></head><body><div class="wrap"><a class="home" href="index.html">← All Paper 1 Sets</a><div class="card"><div class="top"><div><h1>RES Paper 1 — Practice 5</h1><div class="sub">20 questions • Medium difficulty • Training-note based</div></div><div><span class="pill" id="timer">00:00</span> <span class="pill" id="score">0/20</span></div></div><div class="bar"><div id="prog"></div></div><div id="quiz"><div class="topic" id="topic"></div><div class="q" id="q"></div><div id="opts"></div><div class="feedback" id="fb"></div><button class="next" id="next">Next question →</button></div><div class="result" id="result"><div class="big" id="final"></div><p id="timefinal"></p><p id="summary"></p><button class="next" style="display:inline-block" onclick="location.reload()">Try again</button> <a href="index.html"><button class="next" style="display:inline-block">Choose another set</button></a></div></div></div>
<script>const qs=[{"topic": "Contract", "q": "A buyer wants to transfer contractual rights to another person where the contract permits it. Which concept is most directly relevant?", "opts": ["Assignment", "Easement by necessity", "Joint tenancy", "Differential premium"], "ans": 0, "exp": "Assignment concerns transfer of contractual rights, subject to the contract and law."}, {"topic": "Contract", "q": "A salesperson is unsure whether a complex defect amounts to repudiatory breach and whether the client should rescind. What is the BEST professional step?", "opts": ["Give a guaranteed legal opinion", "Seek/advise the client to obtain appropriate solicitor assistance", "Ignore the issue", "Lodge a caveat for the salesperson"], "ans": 1, "exp": "The course learning outcomes expressly include recognising when to seek assistance from a solicitor."}, {"topic": "Landlord & Tenant", "q": "Which is essential to a valid lease according to the notes?", "opts": ["A 99-year term in every case", "Ownership of furniture", "Exclusive possession by the tenant", "Registration as a salesperson"], "ans": 2, "exp": "Exclusive possession is a key essential of a lease."}, {"topic": "Landlord & Tenant", "q": "A lease term must generally be:", "opts": ["Identical to the owner’s estate", "Unlimited and unknown", "Exactly one year", "Certain, definite or capable of being made definite"], "ans": 3, "exp": "The course notes identify certainty of term as an essential of a valid lease."}, {"topic": "Landlord & Tenant", "q": "A tenant remains in possession after the lease expires without the landlord’s assent to a new tenancy. This is most closely associated with:", "opts": ["Tenancy at sufferance", "Joint tenancy", "Easement", "Gift"], "ans": 0, "exp": "Holding over without a new consensual tenancy is associated with tenancy at sufferance."}, {"topic": "Landlord & Tenant", "q": "A tenancy continuing from period to period, such as month to month, is a:", "opts": ["Tenancy in common", "Periodic tenancy", "Life estate", "Mortgage"], "ans": 1, "exp": "A recurring month-to-month arrangement is a periodic tenancy."}, {"topic": "Landlord & Tenant", "q": "A tenant transfers the whole of his remaining leasehold interest to another person. This is generally an:", "opts": ["Gift by will", "Subletting necessarily", "Assignment", "Easement"], "ans": 2, "exp": "Assignment transfers the tenant’s whole remaining leasehold interest."}, {"topic": "Landlord & Tenant", "q": "A tenant grants another occupier a shorter tenancy while retaining his own leasehold interest. This is generally:", "opts": ["Assignment", "Mortgage", "Novation automatically", "Subletting"], "ans": 3, "exp": "Subletting creates a subordinate tenancy while the original tenant retains the head lease interest."}, {"topic": "Landlord & Tenant", "q": "Novation differs from assignment because novation generally involves:", "opts": ["Substitution of a party/contractual relationship with consent, creating a new contractual arrangement", "Only a change of furniture", "An easement over adjoining land", "A caveat on title"], "ans": 0, "exp": "Novation substitutes contractual parties/obligations by agreement, rather than merely assigning rights."}, {"topic": "Landlord & Tenant", "q": "The landlord’s interest that remains after granting a lease is called the:", "opts": ["Remainder of a stranger", "Reversion", "Licence", "Chattel"], "ans": 1, "exp": "The notes state that the owner’s retained interest is the reversion."}, {"topic": "Agency", "q": "A principal expressly tells an agent, “You may negotiate rent up to $5,000.” This is:", "opts": ["No authority", "Apparent authority only", "Express actual authority", "Authority by succession"], "ans": 2, "exp": "Direct authority communicated by the principal to the agent is express actual authority."}, {"topic": "Agency", "q": "A principal’s conduct causes a third party reasonably to believe that an agent has authority. This is most closely associated with:", "opts": ["Future interest", "Testamentary trust", "Tenancy at sufferance", "Apparent authority"], "ans": 3, "exp": "Apparent authority concerns the principal’s representation/conduct as perceived by third parties."}, {"topic": "Agency", "q": "A salesperson representing a seller receives an offer lower than the seller’s asking price. What duty highlighted in the notes applies?", "opts": ["Transmit all offers to the client", "Reject it without telling the seller", "Accept it personally", "Hide it until a higher offer appears"], "ans": 0, "exp": "The agent’s duties include transmitting all offers to the principal/client."}, {"topic": "Agency", "q": "Agency is described in the notes as uberrimae fidei. This means a relationship requiring:", "opts": ["No disclosure", "Utmost good faith", "No authority", "Only written communication"], "ans": 1, "exp": "Uberrimae fidei means utmost good faith."}, {"topic": "Negligence", "q": "A seller’s agent owes fiduciary duties primarily to the seller-client, but may also owe a buyer:", "opts": ["Ownership rights", "No duty under any circumstances", "A duty of care in appropriate circumstances", "A right of survivorship"], "ans": 2, "exp": "The notes distinguish fiduciary duties to the client from a duty of care that may be owed to others."}, {"topic": "Negligence", "q": "A careless factual statement by a professional causes a buyer foreseeable financial loss. Which concept is most directly relevant?", "opts": ["Gift", "Joint tenancy", "Easement by prescription", "Negligent misrepresentation"], "ans": 3, "exp": "Negligent misrepresentation concerns careless statements causing loss where a duty/standard applies."}, {"topic": "Negligence", "q": "The usual civil remedy sought for loss caused by negligence is:", "opts": ["Damages", "Automatic transfer of title", "Imprisonment as the civil remedy", "Creation of a lease"], "ans": 0, "exp": "The training questions identify monetary damages as the usual remedy for negligence loss."}, {"topic": "Real Estate Market", "q": "Which characteristic of real estate makes location especially important to value?", "opts": ["Perfect homogeneity", "Immobility", "Instant production", "No transaction costs"], "ans": 1, "exp": "Real estate is immovable; location is therefore fundamental to its market characteristics."}, {"topic": "Real Estate Market", "q": "Demand for housing rises while short-run supply is relatively slow to respond. Other things equal, what is the most plausible pressure?", "opts": ["Downward pressure on price only", "No possible effect on price", "Upward pressure on price", "Automatic conversion to commercial use"], "ans": 2, "exp": "With demand rising faster than constrained short-run supply, upward price pressure is plausible."}, {"topic": "Real Estate Market", "q": "Which statement BEST reflects the relationship between property and business cycles?", "opts": ["They are completely unrelated by definition", "Only legal title determines the cycle", "Property prices must move exactly with GDP every month", "Property activity may be influenced by broader economic/business conditions, though timing and magnitude can differ"], "ans": 3, "exp": "The notes require understanding the relationship between property and business cycles, not assuming they are identical."}];let i=0,score=0,answered=false;const start=Date.now();const letters=['A','B','C','D'];function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}setInterval(()=>{document.getElementById('timer').textContent=fmt(Math.floor((Date.now()-start)/1000))},1000);function render(){answered=false;let x=qs[i];topic.textContent=x.topic;q.textContent=(i+1)+'. '+x.q;opts.innerHTML='';fb.style.display='none';next.style.display='none';x.opts.forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+letters[j]+'.</b> '+o;b.onclick=()=>pick(j,b);opts.appendChild(b)});prog.style.width=((i)/qs.length*100)+'%';scoreEl()}function scoreEl(){document.getElementById('score').textContent=score+'/20'}function pick(j,b){if(answered)return;answered=true;let x=qs[i];[...opts.children].forEach((el,k)=>{el.disabled=true;if(k===x.ans)el.classList.add('correct')});if(j===x.ans){score++;fb.innerHTML='<b>Correct.</b> '+x.exp}else{b.classList.add('wrong');fb.innerHTML='<b>Not quite.</b> Correct answer: <b>'+letters[x.ans]+'. '+x.opts[x.ans]+'</b><br>'+x.exp}fb.style.display='block';next.style.display='inline-block';scoreEl()}next.onclick=()=>{i++;if(i<qs.length)render();else finish()};function finish(){quiz.style.display='none';result.style.display='block';prog.style.width='100%';let sec=Math.floor((Date.now()-start)/1000),pct=Math.round(score/qs.length*100);final.textContent=score+'/20 ('+pct+'%)';timefinal.textContent='Time taken: '+fmt(sec);summary.textContent=pct>=80?'Strong result. Review any misses, then move to the next set.':pct>=60?'Pass-range practice score, but review the explanations before moving on.':'Good diagnostic attempt — review the weak topics and retry later.'}render();</script></body></html>
