<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RES Practice #010</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#65708a;--accent:#315efb;--good:#137a43;--bad:#b42318}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:820px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#172554,#315efb);color:white;padding:25px;border-radius:20px;box-shadow:0 8px 24px #0002}
.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:4px 0;opacity:.92}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.pill{background:white;border-radius:999px;padding:9px 14px;box-shadow:0 3px 12px #0001;font-weight:bold}.progress{height:10px;background:#dce3f2;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:var(--accent);width:0}
.card{background:var(--card);padding:22px;border-radius:18px;box-shadow:0 5px 20px #0001;margin-top:14px}.tag{font-size:12px;color:var(--muted);font-weight:bold;text-transform:uppercase}
.q{font-size:20px;line-height:1.42;margin:10px 0 18px}.opt{width:100%;text-align:left;border:1px solid #d8deea;background:white;padding:13px 15px;margin:7px 0;border-radius:12px;font-size:16px;cursor:pointer}
.opt:hover{border-color:var(--accent);background:#f7f9ff}.opt:disabled{cursor:default}.correct{border-color:#54b67a!important;background:#edf9f1!important}.wrong{border-color:#e57a72!important;background:#fff0ef!important}
.feedback{display:none;margin-top:15px;padding:14px;border-radius:12px;line-height:1.45}.good{display:block;background:#edf9f1;color:#0b6335}.bad{display:block;background:#fff0ef;color:#8f1d16}
button.next{display:none;margin-top:15px;border:0;background:var(--accent);color:white;padding:12px 18px;border-radius:11px;font-weight:bold;cursor:pointer}.end{text-align:center}.end h2{font-size:30px}
.small{font-size:13px;color:var(--muted);line-height:1.45}.restart{border:0;background:var(--accent);color:#fff;padding:12px 18px;border-radius:11px;font-weight:bold;cursor:pointer}
</style></head><body><div class="wrap">
<div class="hero"><h1>🏠 RES Practice #010</h1><p>20 questions · Mixed Paper 1 & Paper 2 · Practice Mode</p><p>Target: 16/20 (80%)</p></div>
<div id="quiz"><div class="stats"><div class="pill" id="num"></div><div class="pill" id="score"></div></div><div class="progress"><div class="bar" id="bar"></div></div>
<div class="card"><div class="tag" id="topic"></div><div class="q" id="question"></div><div id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next" onclick="nextQ()">Next Question →</button></div>
<p class="small">These are revision questions, not official CEA examination questions. Policy-sensitive answers are framed to current official information checked in Oct 2026.</p></div></div>
<script>const qs=[{"q": "Which agency administers property-related stamp duties in Singapore?", "opts": ["IRAS", "CEA", "LTA", "JTC"], "ans": 0, "exp": "IRAS administers Singapore taxes including stamp duties.", "topic": "P1 Agencies"}, {"q": "Joint tenancy is characterised by:", "opts": ["Co-owners holding together with the right of survivorship", "Each owner necessarily having a separately disposable unequal share", "No right of survivorship in any case", "Ownership by a company only"], "ans": 0, "exp": "A key feature of joint tenancy is survivorship: on death, the deceased joint tenant's interest accrues to survivors.", "topic": "P1 Co-ownership"}, {"q": "A fixed-rate mortgage means:", "opts": ["The interest rate is fixed for the specified fixed-rate period", "The property price can never change", "Monthly instalments can never change for any reason", "The loan has no maturity date"], "ans": 0, "exp": "The defining feature is the agreed interest rate remaining fixed during the specified period.", "topic": "P1 Mortgage"}, {"q": "For an HDB resale transaction, a seller must have registered a valid Intent to Sell at least:", "opts": ["7 days before granting the OTP", "1 day before granting the OTP", "30 days after completion", "Only after the buyer exercises the OTP"], "ans": 0, "exp": "Current HDB resale terms require a valid Intent to Sell registered at least 7 days before the seller grants the OTP.", "topic": "P2 HDB"}, {"q": "Planning permission is principally concerned with:", "opts": ["Whether proposed development/use complies with planning controls", "Who inherits under a will", "Whether a mortgage rate floats", "Whether a salesperson earns commission"], "ans": 0, "exp": "Planning controls regulate development and use of land.", "topic": "P1 Planning"}, {"q": "A tenant remains after expiry and the landlord has not agreed to a new tenancy. Which concept should be considered?", "opts": ["Tenancy at sufferance", "Freehold", "Mortgage", "Trust"], "ans": 0, "exp": "Holding over after lawful possession ends without fresh assent may amount to tenancy at sufferance.", "topic": "P1 Landlord Tenant"}, {"q": "A seller says a large freestanding sculpture is 'part of the house'. It is not attached. The salesperson should:", "opts": ["Clarify expressly whether it is included rather than assume it is a fixture", "Tell buyer it automatically passes with land", "Call it an easement", "Treat it as title"], "ans": 0, "exp": "A freestanding item is likely a chattel; transaction terms should clearly state inclusions/exclusions.", "topic": "P1 Fixtures"}, {"q": "A contract has been fully carried out by both parties according to its terms. It is most naturally described as discharged by:", "opts": ["Performance", "Frustration", "Repudiation", "Misrepresentation"], "ans": 0, "exp": "Full performance is a standard mode of discharge.", "topic": "P1 Contract"}, {"q": "If two buyers purchase jointly, a salesperson should avoid assuming their stamp duty is simply split by ownership shares because:", "opts": ["Joint-purchase duty rules may apply to the whole property based on buyer profiles", "Stamp duty never applies jointly", "Only sellers pay stamp duty", "Shares are irrelevant to all taxes"], "ans": 0, "exp": "ABSD and other stamp-duty rules for joint purchasers can depend on the buyers' profiles and whole acquisition.", "topic": "P2 Stamp Duty"}, {"q": "A seller asks the salesperson to fabricate a competing offer to pressure a buyer. The salesperson should:", "opts": ["Refuse because the conduct is deceptive and unethical", "Do it if no document is created", "Do it only by phone", "Ask a colleague to make the false claim"], "ans": 0, "exp": "Inventing offers is deceptive and incompatible with ethical professional practice.", "topic": "P2 Ethics"}, {"q": "A salesperson should keep transaction/client information:", "opts": ["Handled according to confidentiality, data-protection and professional obligations", "Publicly posted by default", "Shared with any marketer", "Sold to third parties automatically"], "ans": 0, "exp": "Client information must be handled responsibly under professional and data-protection obligations.", "topic": "P2 Ethics"}, {"q": "Zoning under the Master Plan is relevant because it:", "opts": ["Guides permissible/planned land uses and development", "Determines a person's citizenship", "Creates a mortgage", "Replaces title registration"], "ans": 0, "exp": "Master Plan zoning is central to land-use planning and development control.", "topic": "P1 Planning"}, {"q": "A 1.5% agreed commission on $2m before GST is:", "opts": ["$30,000", "$20,000", "$3,000", "$300,000"], "ans": 0, "exp": "1.5% × $2,000,000 = $30,000.", "topic": "P2 Calculation"}, {"q": "Under current HDB resale terms, an unmarried Singapore Citizen buying a resale flat alone is generally required to be at least:", "opts": ["35 years old, subject to applicable scheme exceptions", "18 years old in all cases", "21 years old in all cases", "40 years old"], "ans": 0, "exp": "Current HDB terms state 35 for an unmarried citizen buying alone, with specified exceptions such as widowed/orphaned cases.", "topic": "P2 HDB"}, {"q": "A tenancy at sufferance may arise where:", "opts": ["A tenant remains after the lawful tenancy has ended without the landlord's fresh assent", "A buyer signs an OTP", "A bank grants a mortgage", "A landlord grants a new five-year lease"], "ans": 0, "exp": "It describes a former lawful tenant holding over without a new tenancy being granted.", "topic": "P1 Landlord Tenant"}, {"q": "A buyer says, 'I assume the dining chandelier is included.' It is specially fitted to the ceiling and integrated into the room. Before promising anything, the salesperson should:", "opts": ["Treat every light as a chattel automatically", "Clarify the sale terms and consider whether it is a fixture", "Tell the buyer fixtures never pass with land", "Ignore the issue until completion"], "ans": 1, "exp": "Fixture status depends on legal tests and transaction terms; a salesperson should clarify rather than make an unsupported promise.", "topic": "P1 Fixtures"}, {"q": "The MCST in a strata development is primarily concerned with:", "opts": ["Management and maintenance of common property under strata law", "Issuing passports", "Setting national interest rates", "Registering salespersons"], "ans": 0, "exp": "The management corporation manages common property and related strata responsibilities.", "topic": "P2 Strata"}, {"q": "Novation differs from assignment because novation generally:", "opts": ["Substitutes a party and creates a new contractual relationship with required consent", "Transfers only physical furniture", "Is always unilateral", "Is a type of easement"], "ans": 0, "exp": "Novation replaces a contracting party/contractual relationship and normally requires consent of relevant parties.", "topic": "P1 Landlord Tenant"}, {"q": "A salesperson conducting estate agency work generally acts through:", "opts": ["The licensed estate agent with which the salesperson is registered", "Any number of estate agents simultaneously without rules", "URA", "HDB as employer"], "ans": 0, "exp": "Salespersons conduct estate agency work under their registered estate agent and applicable CEA rules.", "topic": "P2 Regulation"}, {"q": "An agency relationship is fundamentally one in which:", "opts": ["An agent is authorised to act on behalf of a principal", "A tenant becomes owner automatically", "A mortgagee becomes tenant", "A buyer becomes regulator"], "ans": 0, "exp": "Agency involves authority for the agent to affect the principal's legal relations within the scope of authority.", "topic": "P1 Agency"}];
let i=0,score=0,locked=false;
const letters=['A','B','C','D'];
function render(){
 locked=false;
 if(i>=qs.length){finish();return}
 const q=qs[i];
 document.getElementById('num').textContent=(i+1)+' / '+qs.length;
 document.getElementById('score').textContent='Score: '+score;
 document.getElementById('bar').style.width=(i/qs.length*100)+'%';
 document.getElementById('topic').textContent=q.topic;
 document.getElementById('question').textContent=q.q;
 const box=document.getElementById('options');box.innerHTML='';
 q.opts.forEach((o,k)=>{let b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+letters[k]+'.</b> '+o;b.onclick=()=>choose(k,b);box.appendChild(b)});
 let f=document.getElementById('feedback');f.className='feedback';f.innerHTML='';
 document.getElementById('next').style.display='none';
}
function choose(k,b){
 if(locked)return;locked=true;
 const q=qs[i], buttons=[...document.querySelectorAll('.opt')];
 buttons.forEach(x=>x.disabled=true);buttons[q.ans].classList.add('correct');
 const f=document.getElementById('feedback');
 if(k===q.ans){score++;f.className='feedback good';f.innerHTML='<b>✓ Correct.</b> '+q.exp}
 else{b.classList.add('wrong');f.className='feedback bad';f.innerHTML='<b>✗ Not quite. Correct answer: '+letters[q.ans]+'.</b><br>'+q.exp}
 document.getElementById('score').textContent='Score: '+score;
 document.getElementById('next').style.display='inline-block';
}
function nextQ(){i++;render()}
function finish(){
 document.getElementById('bar').style.width='100%';
 let pct=Math.round(score/qs.length*100),msg=pct>=80?'Strong attempt — move on, then revisit your wrong answers.':pct>=60?'Getting there — review the explanations and retry later.':'Use this set as revision: focus on why each wrong option was wrong.';
 document.getElementById('quiz').innerHTML='<div class="card end"><h2>'+score+' / '+qs.length+' ('+pct+'%)</h2><p>'+msg+'</p><button class="restart" onclick="location.reload()">Try Again</button><p class="small">Practice material only. Always check current CEA/HDB/IRAS/URA rules for policy-sensitive topics.</p></div>';
}
render();
</script></body></html>
