<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RES Practice #006</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#65708a;--accent:#315efb;--good:#137a43;--bad:#b42318}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:820px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#172554,#315efb);color:white;padding:25px;border-radius:20px;box-shadow:0 8px 24px #0002}
.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:4px 0;opacity:.92}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.pill{background:white;border-radius:999px;padding:9px 14px;box-shadow:0 3px 12px #0001;font-weight:bold}.progress{height:10px;background:#dce3f2;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:var(--accent);width:0}
.card{background:var(--card);padding:22px;border-radius:18px;box-shadow:0 5px 20px #0001;margin-top:14px}.tag{font-size:12px;color:var(--muted);font-weight:bold;text-transform:uppercase}
.q{font-size:20px;line-height:1.42;margin:10px 0 18px}.opt{width:100%;text-align:left;border:1px solid #d8deea;background:white;padding:13px 15px;margin:7px 0;border-radius:12px;font-size:16px;cursor:pointer}
.opt:hover{border-color:var(--accent);background:#f7f9ff}.opt:disabled{cursor:default}.correct{border-color:#54b67a!important;background:#edf9f1!important}.wrong{border-color:#e57a72!important;background:#fff0ef!important}
.feedback{display:none;margin-top:15px;padding:14px;border-radius:12px;line-height:1.45}.good{display:block;background:#edf9f1;color:#0b6335}.bad{display:block;background:#fff0ef;color:#8f1d16}
button.next{display:none;margin-top:15px;border:0;background:var(--accent);color:white;padding:12px 18px;border-radius:11px;font-weight:bold;cursor:pointer}.end{text-align:center}.end h2{font-size:30px}
.small{font-size:13px;color:var(--muted);line-height:1.45}.restart{border:0;background:var(--accent);color:#fff;padding:12px 18px;border-radius:11px;font-weight:bold;cursor:pointer}
</style></head><body><div class="wrap">
<div class="hero"><h1>🏠 RES Practice #006</h1><p>20 questions · Mixed Paper 1 & Paper 2 · Practice Mode</p><p>Target: 16/20 (80%)</p></div>
<div id="quiz"><div class="stats"><div class="pill" id="num"></div><div class="pill" id="score"></div></div><div class="progress"><div class="bar" id="bar"></div></div>
<div class="card"><div class="tag" id="topic"></div><div class="q" id="question"></div><div id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next" onclick="nextQ()">Next Question →</button></div>
<p class="small">These are revision questions, not official CEA examination questions. Policy-sensitive answers are framed to current official information checked in Oct 2026.</p></div></div>
<script>const qs=[{"q": "During the MOP, an HDB owner asks whether buying an overseas residential apartment is harmless because it is outside Singapore. Current HDB terms generally:", "opts": ["Restrict investment in residential property in Singapore or overseas during MOP", "Restrict only Singapore property", "Allow any overseas residential purchase", "Apply only to commercial property"], "ans": 0, "exp": "The current HDB terms expressly include residential property in Singapore or overseas.", "topic": "P2 HDB"}, {"q": "When a property is sold with an existing tenancy, the buyer should understand:", "opts": ["The tenancy and its legal effect should be reviewed as part of due diligence", "The tenancy automatically disappears at sale in every case", "Tenants never have rights", "Rent belongs to the salesperson"], "ans": 0, "exp": "Existing leases can affect possession, income and obligations; their terms/legal status must be reviewed.", "topic": "P2 Leasing"}, {"q": "Seller tells salesperson not to mention a known serious title encumbrance and to say the title is 'completely clean'. The best response is to:", "opts": ["Follow the instruction because principal's wishes always override law", "Avoid making a false statement and advise appropriate disclosure/legal verification", "Advertise first and check after completion", "Tell only buyers who make a full-price offer"], "ans": 1, "exp": "An agent owes duties to the principal but cannot make misleading statements or disregard legal/professional obligations.", "topic": "P1 Agency/Contract"}, {"q": "A developer's show-flat representation should be treated carefully because:", "opts": ["Buyers should distinguish display/illustration from contractual specifications and approved plans", "Everything displayed is automatically a contractual term", "Show flats override the S&P agreement", "Furniture shown always forms part of sale"], "ans": 0, "exp": "Contractual documents/specifications govern; marketing displays must be understood in context.", "topic": "P2 New Sale"}, {"q": "A seller bought a private residential property on 10 July 2025 and plans to sell after 3 years. Which issue should be checked carefully?", "opts": ["Residential SSD, because the applicable holding period for that acquisition is four years", "HDB MOP only", "No tax issue can arise", "Industrial SSD only"], "ans": 0, "exp": "Residential property acquired on/after 4 July 2025 falls under the four-year SSD holding-period regime.", "topic": "P2 Stamp Duty"}, {"q": "The prescribed Estate Agency Agreement is important because it:", "opts": ["Records the agency appointment and key terms such as duties/commission", "Transfers property title", "Replaces the OTP", "Is a planning permission"], "ans": 0, "exp": "Prescribed agreements formalise the client-estate agent relationship and key appointment terms.", "topic": "P2 Agency Agreement"}, {"q": "A tenant grants another person occupation for 6 months while retaining 18 months on the head lease. This arrangement is most likely:", "opts": ["Assignment of the whole term", "Sublease", "Transfer of freehold", "Mortgage"], "ans": 1, "exp": "The tenant retains a reversion, pointing to a sublease.", "topic": "P1 Landlord Tenant"}, {"q": "When calculating rental yield, a basic gross yield compares:", "opts": ["Annual gross rent with property price/value", "Monthly maintenance fee with loan amount only", "BSD with ABSD", "Floor area with rent"], "ans": 0, "exp": "Gross rental yield is commonly annual gross rent divided by property price/value, before expenses.", "topic": "P2 Finance"}, {"q": "A 75% loan on a $1,000,000 value equals:", "opts": ["$750,000", "$250,000", "$75,000", "$1,750,000"], "ans": 0, "exp": "75% × $1,000,000 = $750,000.", "topic": "P2 Calculation"}, {"q": "A salesperson is unsure whether a proposed use of a shophouse unit is permitted. The best next step is:", "opts": ["Verify planning/permitted-use requirements with authoritative sources before representing suitability", "Guess based on neighbouring shops", "Promise approval", "Rely on an old advertisement"], "ans": 0, "exp": "Permitted use is a regulatory matter; authoritative verification is necessary.", "topic": "P2 Commercial"}, {"q": "If an agent secretly earns an undisclosed profit from the agency, the clearest concern is breach of:", "opts": ["Fiduciary duty", "Planning permission", "Lease tenure", "Fixture rules"], "ans": 0, "exp": "Secret profits conflict with the fiduciary duties of loyalty and disclosure.", "topic": "P1 Agency"}, {"q": "For an uncompleted private residential development, a salesperson should:", "opts": ["Understand the regulated sale process and prescribed documents before advising buyers", "Assume it is identical to every completed resale", "Promise completion dates not stated by developer", "Ignore developer licensing requirements"], "ans": 0, "exp": "Uncompleted private property transactions have specific statutory/prescribed processes and documents.", "topic": "P2 Private Property"}, {"q": "A key purpose of the Code of Ethics and Professional Client Care is to:", "opts": ["Promote ethical, professional conduct and protect consumer interests", "Set mortgage interest rates", "Determine zoning", "Issue strata titles"], "ans": 0, "exp": "Professional conduct rules govern ethical behaviour and client care in estate agency work.", "topic": "P2 Ethics"}, {"q": "A salesperson recommends a service provider in which the salesperson has a financial interest. The key issue is:", "opts": ["Conflict of interest and proper disclosure", "Fixture status", "MOP", "Joint tenancy"], "ans": 0, "exp": "A financial interest in a referral can affect impartiality and should be properly disclosed/managed.", "topic": "P2 Ethics"}, {"q": "Which is a recognised way a contract may be discharged?", "opts": ["Performance", "Changing the property's postal code", "Lodging any advertisement", "Viewing another property"], "ans": 0, "exp": "Performance of contractual obligations is a standard method of discharge.", "topic": "P1 Contract"}, {"q": "A 70% loan on $1.5m is:", "opts": ["$1.05m", "$450,000", "$700,000", "$1.5m"], "ans": 0, "exp": "70% × $1.5m = $1.05m.", "topic": "P2 Calculation"}, {"q": "A licence to enter land generally differs from a lease because a licence:", "opts": ["Necessarily transfers exclusive possession", "Generally gives permission rather than an estate in land", "Must exceed seven years", "Always appears as ownership on title"], "ans": 1, "exp": "A licence generally grants permission to do something on land without conferring a leasehold estate.", "topic": "P1 Licence"}, {"q": "A Temporary Occupation Licence (TOL) issued by the State is best understood as:", "opts": ["A freehold title", "Permission for temporary occupation/use subject to its terms", "A mortgage", "An easement automatically lasting forever"], "ans": 1, "exp": "A TOL permits temporary occupation/use and does not confer a freehold estate.", "topic": "P1 State Land"}, {"q": "A rise in mortgage interest rates, with other factors unchanged, is most likely to initially:", "opts": ["Increase buyers' borrowing capacity", "Reduce affordability and dampen housing demand", "Eliminate property cycles", "Increase the physical supply of land"], "ans": 1, "exp": "Higher borrowing costs generally reduce affordability and can weaken effective demand.", "topic": "P1 Market"}, {"q": "If an HDB seller grants an OTP before satisfying the applicable MOP, current HDB terms state that the OTP is:", "opts": ["Null and void", "Automatically extended", "Valid if the buyer agrees", "Converted to a tenancy"], "ans": 0, "exp": "HDB states a seller can only grant an OTP after satisfying MOP; an earlier OTP is null and void.", "topic": "P2 HDB"}];
let i=0,score=0,locked=false;
const letters=['A','B','C','D'];
function render(){
 locked=false;
 if(i>=qs.length){finish();return}
 const q=qs[i];
 document.getElementById('num').textContent=(i+1)+' / '+qs.length;
 document.getElementById('score').textContent='Score: '+score;
 document.getElementById('bar').style.width=(i/qs.length*100)+'%';
 document.getElementById('topic').textContent=q.topic;
 document.getElementById('question').textContent=q.q;
 const box=document.getElementById('options');box.innerHTML='';
 q.opts.forEach((o,k)=>{let b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+letters[k]+'.</b> '+o;b.onclick=()=>choose(k,b);box.appendChild(b)});
 let f=document.getElementById('feedback');f.className='feedback';f.innerHTML='';
 document.getElementById('next').style.display='none';
}
function choose(k,b){
 if(locked)return;locked=true;
 const q=qs[i], buttons=[...document.querySelectorAll('.opt')];
 buttons.forEach(x=>x.disabled=true);buttons[q.ans].classList.add('correct');
 const f=document.getElementById('feedback');
 if(k===q.ans){score++;f.className='feedback good';f.innerHTML='<b>✓ Correct.</b> '+q.exp}
 else{b.classList.add('wrong');f.className='feedback bad';f.innerHTML='<b>✗ Not quite. Correct answer: '+letters[q.ans]+'.</b><br>'+q.exp}
 document.getElementById('score').textContent='Score: '+score;
 document.getElementById('next').style.display='inline-block';
}
function nextQ(){i++;render()}
function finish(){
 document.getElementById('bar').style.width='100%';
 let pct=Math.round(score/qs.length*100),msg=pct>=80?'Strong attempt — move on, then revisit your wrong answers.':pct>=60?'Getting there — review the explanations and retry later.':'Use this set as revision: focus on why each wrong option was wrong.';
 document.getElementById('quiz').innerHTML='<div class="card end"><h2>'+score+' / '+qs.length+' ('+pct+'%)</h2><p>'+msg+'</p><button class="restart" onclick="location.reload()">Try Again</button><p class="small">Practice material only. Always check current CEA/HDB/IRAS/URA rules for policy-sensitive topics.</p></div>';
}
render();
</script></body></html>
