<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RES Practice #007</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#65708a;--accent:#315efb;--good:#137a43;--bad:#b42318}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:820px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#172554,#315efb);color:white;padding:25px;border-radius:20px;box-shadow:0 8px 24px #0002}
.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:4px 0;opacity:.92}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.pill{background:white;border-radius:999px;padding:9px 14px;box-shadow:0 3px 12px #0001;font-weight:bold}.progress{height:10px;background:#dce3f2;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:var(--accent);width:0}
.card{background:var(--card);padding:22px;border-radius:18px;box-shadow:0 5px 20px #0001;margin-top:14px}.tag{font-size:12px;color:var(--muted);font-weight:bold;text-transform:uppercase}
.q{font-size:20px;line-height:1.42;margin:10px 0 18px}.opt{width:100%;text-align:left;border:1px solid #d8deea;background:white;padding:13px 15px;margin:7px 0;border-radius:12px;font-size:16px;cursor:pointer}
.opt:hover{border-color:var(--accent);background:#f7f9ff}.opt:disabled{cursor:default}.correct{border-color:#54b67a!important;background:#edf9f1!important}.wrong{border-color:#e57a72!important;background:#fff0ef!important}
.feedback{display:none;margin-top:15px;padding:14px;border-radius:12px;line-height:1.45}.good{display:block;background:#edf9f1;color:#0b6335}.bad{display:block;background:#fff0ef;color:#8f1d16}
button.next{display:none;margin-top:15px;border:0;background:var(--accent);color:white;padding:12px 18px;border-radius:11px;font-weight:bold;cursor:pointer}.end{text-align:center}.end h2{font-size:30px}
.small{font-size:13px;color:var(--muted);line-height:1.45}.restart{border:0;background:var(--accent);color:#fff;padding:12px 18px;border-radius:11px;font-weight:bold;cursor:pointer}
</style></head><body><div class="wrap">
<div class="hero"><h1>🏠 RES Practice #007</h1><p>20 questions · Mixed Paper 1 & Paper 2 · Practice Mode</p><p>Target: 16/20 (80%)</p></div>
<div id="quiz"><div class="stats"><div class="pill" id="num"></div><div class="pill" id="score"></div></div><div class="progress"><div class="bar" id="bar"></div></div>
<div class="card"><div class="tag" id="topic"></div><div class="q" id="question"></div><div id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next" onclick="nextQ()">Next Question →</button></div>
<p class="small">These are revision questions, not official CEA examination questions. Policy-sensitive answers are framed to current official information checked in Oct 2026.</p></div></div>
<script>const qs=[{"q": "A caveat lodged against land primarily serves to:", "opts": ["Renovate the property", "Give notice of a claimed interest and protect that claim pending dealings", "Convert leasehold into freehold", "Pay property tax"], "ans": 1, "exp": "A caveat warns of a claimed interest and can protect the caveator against inconsistent dealings, subject to law.", "topic": "P1 Caveat"}, {"q": "A client asks a salesperson to hide all offers below the asking price. The prescribed agency duties and exact instruction should be checked because ordinarily an agent has a duty to:", "opts": ["Transmit offers to the principal", "Reject all offers personally", "Accept the highest offer without consent", "Choose the buyer"], "ans": 0, "exp": "Transmission of offers is a fundamental agency duty, subject to lawful instructions and applicable rules.", "topic": "P1 Agency"}, {"q": "A buyer wants to purchase two HDB resale flats at the same time for investment. Current HDB resale terms generally provide that an eligible buyer:", "opts": ["May purchase only one flat which must be owner-occupied with authorised family", "May buy unlimited HDB flats", "May buy two if using different agents", "May buy any number if no loan is used"], "ans": 0, "exp": "HDB resale terms restrict a buyer to one flat and require owner occupation under the applicable household rules.", "topic": "P2 HDB"}, {"q": "A contract that is valid until an entitled party elects to set it aside is:", "opts": ["Voidable", "Void ab initio in every case", "Automatically completed", "A caveat"], "ans": 0, "exp": "A voidable contract operates unless and until the party with the right to avoid it rescinds it.", "topic": "P1 Contract"}, {"q": "A contractual 'condition' is generally:", "opts": ["Always less important than a warranty", "A fundamental term whose breach may justify termination plus damages, depending on law", "A tax notice", "A title search"], "ans": 1, "exp": "Conditions are fundamental terms; their breach can carry more serious remedies than breach of a warranty.", "topic": "P1 Contract"}, {"q": "A 17-year-old attempts a complex property transaction alone. Which contract element immediately deserves special attention?", "opts": ["Capacity", "Easement", "Fixture", "Mortgage priority"], "ans": 0, "exp": "Capacity of parties is an essential contract consideration.", "topic": "P1 Contract"}, {"q": "The Consumer Protection (Fair Trading) Act is relevant to estate agency practice because it addresses:", "opts": ["Unfair practices in consumer transactions", "Land title registration only", "Mortgage priority only", "Intestate succession only"], "ans": 0, "exp": "Consumer protection rules are relevant to representations and unfair practices in consumer-facing transactions.", "topic": "P2 CPFTA"}, {"q": "A salesperson obtains personal data from a prospective buyer solely for a viewing. Using it later for unrelated marketing without considering consent may raise:", "opts": ["Data-protection concerns", "Mortgage priority", "Easement rights", "MOP calculation only"], "ans": 0, "exp": "Personal data use must comply with applicable data-protection obligations and purposes/consent requirements.", "topic": "P2 Data"}, {"q": "A salesperson receives confidential information about a client's urgent financial difficulty. The salesperson should:", "opts": ["Protect confidentiality and use/disclose it only as properly authorised or required", "Tell prospective buyers to force a lower price", "Post it online", "Tell neighbours"], "ans": 0, "exp": "Client confidentiality is part of professional client care.", "topic": "P2 Ethics"}, {"q": "A freestanding refrigerator merely plugged into a wall socket is ordinarily more likely to be:", "opts": ["A chattel", "An easement", "A restrictive covenant", "A legal estate"], "ans": 0, "exp": "A movable appliance with minimal attachment is ordinarily a chattel unless circumstances indicate otherwise.", "topic": "P1 Fixtures"}, {"q": "Under joint tenancy, when one joint tenant dies, the interest generally:", "opts": ["Passes to the surviving joint tenant(s) by survivorship", "Passes under the deceased's will as a separate share", "Goes automatically to CEA", "Becomes a mortgage"], "ans": 0, "exp": "The right of survivorship operates on a joint tenant's death.", "topic": "P1 Co-ownership"}, {"q": "A false claim that a property is '5 minutes' walk from an MRT when it is materially farther may raise concerns about:", "opts": ["Misleading advertising/unfair representation", "Joint tenancy", "Mortgage redemption", "Trust law only"], "ans": 0, "exp": "Materially inaccurate marketing claims can breach professional/consumer protection requirements.", "topic": "P2 Advertising"}, {"q": "In land law, 'land' generally includes:", "opts": ["Only the soil surface", "The physical land together with interests and things legally forming part of it", "Only buildings but not the ground", "Only items stated in a tenancy agreement"], "ans": 1, "exp": "The legal concept is wider than soil and includes interests in land and items legally forming part of it.", "topic": "P1 Land"}, {"q": "The equity/right of redemption refers broadly to the mortgagor's right to:", "opts": ["Redeem the mortgage by satisfying the secured obligation according to law", "Convert the property to industrial use", "Avoid all interest payments automatically", "Cancel another owner's title"], "ans": 0, "exp": "A core mortgage principle is the borrower's right to redeem the security upon satisfaction of the debt/conditions.", "topic": "P1 Mortgage"}, {"q": "A periodic tenancy is typically one that:", "opts": ["Continues from period to period until properly determined", "Can never be terminated", "Is identical to freehold", "Has no rent"], "ans": 0, "exp": "Periodic tenancies renew by periods until terminated according to applicable notice/rules.", "topic": "P1 Landlord Tenant"}, {"q": "A seller signs an agreement after being induced by a material false statement. The agreement may potentially be:", "opts": ["Voidable for misrepresentation, depending on the facts", "Automatically a mortgage", "Always void with no analysis", "An easement"], "ans": 0, "exp": "Misrepresentation may make a contract voidable and give remedies, depending on its nature and circumstances.", "topic": "P1 Contract"}, {"q": "A salesperson asked to hold a client's transaction money should:", "opts": ["Follow strict applicable rules and avoid handling money in prohibited ways", "Put it into a personal account", "Mix it with personal funds", "Use it temporarily"], "ans": 0, "exp": "Client monies are subject to strict professional/regulatory safeguards; personal commingling is unacceptable.", "topic": "P2 Ethics"}, {"q": "Agency may terminate by:", "opts": ["Expiry or other legally recognised termination circumstances", "Changing the unit number only", "A neighbour moving house", "Property tax assessment alone"], "ans": 0, "exp": "Agency can terminate by expiry, agreement, revocation/renunciation where lawful, completion and other legal events.", "topic": "P1 Agency"}, {"q": "A salesperson who represents both sides of a transaction without satisfying applicable rules risks:", "opts": ["Conflict-of-interest and regulatory breaches", "Automatic higher commission", "Obtaining freehold title", "Creating an easement"], "ans": 0, "exp": "Dual representation/conflict rules are core regulatory concerns; salespersons must comply with applicable restrictions.", "topic": "P2 Ethics"}, {"q": "A property costs $1,200,000 and earns gross annual rent of $48,000. Approximate gross rental yield is:", "opts": ["4%", "2%", "6%", "8%"], "ans": 0, "exp": "$48,000 ÷ $1,200,000 × 100% = 4%.", "topic": "P2 Calculation"}];
let i=0,score=0,locked=false;
const letters=['A','B','C','D'];
function render(){
 locked=false;
 if(i>=qs.length){finish();return}
 const q=qs[i];
 document.getElementById('num').textContent=(i+1)+' / '+qs.length;
 document.getElementById('score').textContent='Score: '+score;
 document.getElementById('bar').style.width=(i/qs.length*100)+'%';
 document.getElementById('topic').textContent=q.topic;
 document.getElementById('question').textContent=q.q;
 const box=document.getElementById('options');box.innerHTML='';
 q.opts.forEach((o,k)=>{let b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+letters[k]+'.</b> '+o;b.onclick=()=>choose(k,b);box.appendChild(b)});
 let f=document.getElementById('feedback');f.className='feedback';f.innerHTML='';
 document.getElementById('next').style.display='none';
}
function choose(k,b){
 if(locked)return;locked=true;
 const q=qs[i], buttons=[...document.querySelectorAll('.opt')];
 buttons.forEach(x=>x.disabled=true);buttons[q.ans].classList.add('correct');
 const f=document.getElementById('feedback');
 if(k===q.ans){score++;f.className='feedback good';f.innerHTML='<b>✓ Correct.</b> '+q.exp}
 else{b.classList.add('wrong');f.className='feedback bad';f.innerHTML='<b>✗ Not quite. Correct answer: '+letters[q.ans]+'.</b><br>'+q.exp}
 document.getElementById('score').textContent='Score: '+score;
 document.getElementById('next').style.display='inline-block';
}
function nextQ(){i++;render()}
function finish(){
 document.getElementById('bar').style.width='100%';
 let pct=Math.round(score/qs.length*100),msg=pct>=80?'Strong attempt — move on, then revisit your wrong answers.':pct>=60?'Getting there — review the explanations and retry later.':'Use this set as revision: focus on why each wrong option was wrong.';
 document.getElementById('quiz').innerHTML='<div class="card end"><h2>'+score+' / '+qs.length+' ('+pct+'%)</h2><p>'+msg+'</p><button class="restart" onclick="location.reload()">Try Again</button><p class="small">Practice material only. Always check current CEA/HDB/IRAS/URA rules for policy-sensitive topics.</p></div>';
}
render();
</script></body></html>
