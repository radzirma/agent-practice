<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RES Practice #008</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#65708a;--accent:#315efb;--good:#137a43;--bad:#b42318}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:820px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#172554,#315efb);color:white;padding:25px;border-radius:20px;box-shadow:0 8px 24px #0002}
.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:4px 0;opacity:.92}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.pill{background:white;border-radius:999px;padding:9px 14px;box-shadow:0 3px 12px #0001;font-weight:bold}.progress{height:10px;background:#dce3f2;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:var(--accent);width:0}
.card{background:var(--card);padding:22px;border-radius:18px;box-shadow:0 5px 20px #0001;margin-top:14px}.tag{font-size:12px;color:var(--muted);font-weight:bold;text-transform:uppercase}
.q{font-size:20px;line-height:1.42;margin:10px 0 18px}.opt{width:100%;text-align:left;border:1px solid #d8deea;background:white;padding:13px 15px;margin:7px 0;border-radius:12px;font-size:16px;cursor:pointer}
.opt:hover{border-color:var(--accent);background:#f7f9ff}.opt:disabled{cursor:default}.correct{border-color:#54b67a!important;background:#edf9f1!important}.wrong{border-color:#e57a72!important;background:#fff0ef!important}
.feedback{display:none;margin-top:15px;padding:14px;border-radius:12px;line-height:1.45}.good{display:block;background:#edf9f1;color:#0b6335}.bad{display:block;background:#fff0ef;color:#8f1d16}
button.next{display:none;margin-top:15px;border:0;background:var(--accent);color:white;padding:12px 18px;border-radius:11px;font-weight:bold;cursor:pointer}.end{text-align:center}.end h2{font-size:30px}
.small{font-size:13px;color:var(--muted);line-height:1.45}.restart{border:0;background:var(--accent);color:#fff;padding:12px 18px;border-radius:11px;font-weight:bold;cursor:pointer}
</style></head><body><div class="wrap">
<div class="hero"><h1>🏠 RES Practice #008</h1><p>20 questions · Mixed Paper 1 & Paper 2 · Practice Mode</p><p>Target: 16/20 (80%)</p></div>
<div id="quiz"><div class="stats"><div class="pill" id="num"></div><div class="pill" id="score"></div></div><div class="progress"><div class="bar" id="bar"></div></div>
<div class="card"><div class="tag" id="topic"></div><div class="q" id="question"></div><div id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next" onclick="nextQ()">Next Question →</button></div>
<p class="small">These are revision questions, not official CEA examination questions. Policy-sensitive answers are framed to current official information checked in Oct 2026.</p></div></div>
<script>const qs=[{"q": "A seller's outstanding mortgage matters at completion because:", "opts": ["The mortgage generally needs to be properly redeemed/discharged as part of conveyancing", "It automatically transfers to buyer unchanged", "It has no effect on title", "CEA pays it"], "ans": 0, "exp": "Existing secured interests are dealt with through the conveyancing completion process.", "topic": "P2 Conveyancing"}, {"q": "A statement that a property 'will definitely appreciate 20% next year' is problematic because:", "opts": ["Future market performance cannot be guaranteed and the claim may mislead", "Salespersons control market prices", "All property rises by 20% yearly", "It is required in advertisements"], "ans": 0, "exp": "Salespersons should not make unsupported guarantees about future prices or investment returns.", "topic": "P2 Marketing"}, {"q": "A listing described as 'exclusive' generally means:", "opts": ["One estate agent is appointed exclusively for the agreed period/terms", "The property can never be sold by owner", "The salesperson owns the property", "The appointment lasts forever"], "ans": 0, "exp": "Exclusive agency is governed by the agreed prescribed terms; it does not transfer ownership.", "topic": "P2 Listing"}, {"q": "In a private resale transaction, the Option to Purchase is important because:", "opts": ["Its terms govern the option rights and, upon valid exercise, can form the sale contract", "It is merely an advertisement", "It transfers title immediately when viewed", "It is a property tax bill"], "ans": 0, "exp": "The OTP is a key contractual document; valid exercise according to its terms generally creates the binding sale contract.", "topic": "P2 Private Property"}, {"q": "A buyer asks whether a wall can be removed. The salesperson has no technical confirmation. The safest professional approach is to:", "opts": ["Guarantee it can be removed", "State that approval/structural constraints should be verified with appropriate authorities/professionals", "Say all internal walls are non-structural", "Tell the buyer to proceed after completion without checks"], "ans": 1, "exp": "Salespersons should not give unsupported technical assurances; relevant approvals and professional advice should be checked.", "topic": "P1 Negligence"}, {"q": "A borrower repays the secured mortgage debt in accordance with the loan terms. The principle most directly engaged is:", "opts": ["Right of redemption", "Right of way", "Survivorship", "Caveat emptor"], "ans": 0, "exp": "The mortgagor has a right to redeem the mortgage upon satisfaction of the secured obligation.", "topic": "P1 Mortgage"}, {"q": "For a valid contract, 'offer and acceptance' primarily establish:", "opts": ["Agreement between the parties", "Planning approval", "Property tax liability", "A mortgage discharge"], "ans": 0, "exp": "A contract generally requires a sufficiently certain offer matched by valid acceptance.", "topic": "P1 Contract"}, {"q": "Before advertising a property, a salesperson should generally:", "opts": ["Have the necessary authority/consent and verify material particulars", "Advertise first and ask owner later", "Use another listing's photos without permission", "Invent a floor area if unknown"], "ans": 0, "exp": "Proper authority and accurate verified information are basic professional requirements.", "topic": "P2 Advertising"}, {"q": "A lease is legally significant because it generally creates:", "opts": ["An interest in land giving the tenant a right to possession for the term", "Only a marketing licence", "Ownership of the landlord's other properties", "A tax exemption"], "ans": 0, "exp": "A lease is a proprietary interest granting possession for its term, subject to its covenants.", "topic": "P1 Landlord Tenant"}, {"q": "An auction differs from a private treaty sale because an auction:", "opts": ["Uses competitive bidding under announced auction conditions", "Has no terms of sale", "Can only sell HDB flats", "Never forms a binding contract"], "ans": 0, "exp": "Auction is a distinct sale method using bids and auction conditions.", "topic": "P2 Sale Methods"}, {"q": "Apparent/ostensible authority focuses mainly on:", "opts": ["How the principal's representation of authority appears to a third party", "The property's floor area", "The agent's private intention only", "Stamp duty rates"], "ans": 0, "exp": "Apparent authority concerns representations attributable to the principal on which a third party may rely.", "topic": "P1 Agency"}, {"q": "A mortgage is best described as:", "opts": ["Security over property for a debt/obligation", "A transfer of rent to a tenant", "A planning zone", "A marketing method"], "ans": 0, "exp": "A mortgage secures repayment/performance by creating security over property.", "topic": "P1 Mortgage"}, {"q": "Succession concerns property passing:", "opts": ["On death according to a will or applicable intestacy/succession law", "Only by sale", "Only by mortgage", "Only by tenancy"], "ans": 0, "exp": "Succession deals with transmission of a deceased person's estate.", "topic": "P1 Succession"}, {"q": "A bank's registered mortgage and another later interest affect a property. Determining which ranks first primarily concerns:", "opts": ["Priority of interests", "Fixture tests", "Agency commission", "Planning zoning"], "ans": 0, "exp": "Competing registered interests raise priority issues.", "topic": "P1 Title"}, {"q": "A salesperson learns that a seller has not met HDB MOP but wants to 'try first' with an OTP. The salesperson should:", "opts": ["Explain that current HDB terms make an OTP granted before MOP satisfaction null and void", "Proceed if option fee is small", "Hide the MOP date", "Let the buyer decide whether HDB rules apply"], "ans": 0, "exp": "Eligibility to sell must be satisfied; HDB states such an OTP is null and void.", "topic": "P2 HDB"}, {"q": "For residential properties purchased on or after 4 July 2025, the SSD holding period is:", "opts": ["4 years", "1 year", "2 years", "10 years"], "ans": 0, "exp": "The Government increased the residential SSD holding period from three to four years for properties acquired on/after 4 July 2025.", "topic": "P2 Stamp Duty"}, {"q": "A purchaser wanting to change a property's use should NOT assume that:", "opts": ["Ownership alone guarantees approval for any desired use", "Planning controls may apply", "Approvals may be required", "Permitted use should be checked"], "ans": 0, "exp": "Ownership does not override planning, building or other regulatory controls.", "topic": "P1 Planning"}, {"q": "The completion of a property sale generally involves:", "opts": ["Conveyancing steps including transfer, payment and dealing with title/encumbrances", "Only handing over an advertisement", "Only signing an inventory", "Only paying commission"], "ans": 0, "exp": "Completion is the legal/financial conveyancing stage at which contractual obligations are completed and title is transferred.", "topic": "P2 Conveyancing"}, {"q": "Seller's Stamp Duty (SSD) for residential property is principally concerned with:", "opts": ["Disposal within the applicable holding period", "Annual rental income only", "Mortgage interest only", "Estate agency commission"], "ans": 0, "exp": "SSD can apply when residential property is disposed of within the applicable holding period.", "topic": "P2 Stamp Duty"}, {"q": "When a client asks a salesperson to inflate an advertised floor area, the salesperson should:", "opts": ["Refuse and use verified accurate information", "Do it if the owner signs a disclaimer", "Round up by any amount", "Advertise without units"], "ans": 0, "exp": "Professional advertising must be accurate; owner instruction does not justify misleading information.", "topic": "P2 Advertising"}];
let i=0,score=0,locked=false;
const letters=['A','B','C','D'];
function render(){
 locked=false;
 if(i>=qs.length){finish();return}
 const q=qs[i];
 document.getElementById('num').textContent=(i+1)+' / '+qs.length;
 document.getElementById('score').textContent='Score: '+score;
 document.getElementById('bar').style.width=(i/qs.length*100)+'%';
 document.getElementById('topic').textContent=q.topic;
 document.getElementById('question').textContent=q.q;
 const box=document.getElementById('options');box.innerHTML='';
 q.opts.forEach((o,k)=>{let b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+letters[k]+'.</b> '+o;b.onclick=()=>choose(k,b);box.appendChild(b)});
 let f=document.getElementById('feedback');f.className='feedback';f.innerHTML='';
 document.getElementById('next').style.display='none';
}
function choose(k,b){
 if(locked)return;locked=true;
 const q=qs[i], buttons=[...document.querySelectorAll('.opt')];
 buttons.forEach(x=>x.disabled=true);buttons[q.ans].classList.add('correct');
 const f=document.getElementById('feedback');
 if(k===q.ans){score++;f.className='feedback good';f.innerHTML='<b>✓ Correct.</b> '+q.exp}
 else{b.classList.add('wrong');f.className='feedback bad';f.innerHTML='<b>✗ Not quite. Correct answer: '+letters[q.ans]+'.</b><br>'+q.exp}
 document.getElementById('score').textContent='Score: '+score;
 document.getElementById('next').style.display='inline-block';
}
function nextQ(){i++;render()}
function finish(){
 document.getElementById('bar').style.width='100%';
 let pct=Math.round(score/qs.length*100),msg=pct>=80?'Strong attempt — move on, then revisit your wrong answers.':pct>=60?'Getting there — review the explanations and retry later.':'Use this set as revision: focus on why each wrong option was wrong.';
 document.getElementById('quiz').innerHTML='<div class="card end"><h2>'+score+' / '+qs.length+' ('+pct+'%)</h2><p>'+msg+'</p><button class="restart" onclick="location.reload()">Try Again</button><p class="small">Practice material only. Always check current CEA/HDB/IRAS/URA rules for policy-sensitive topics.</p></div>';
}
render();
</script></body></html>
