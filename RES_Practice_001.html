<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RES Practice #001</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#65708a;--accent:#315efb;--good:#137a43;--bad:#b42318}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:820px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#172554,#315efb);color:white;padding:25px;border-radius:20px;box-shadow:0 8px 24px #0002}
.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:4px 0;opacity:.92}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.pill{background:white;border-radius:999px;padding:9px 14px;box-shadow:0 3px 12px #0001;font-weight:bold}.progress{height:10px;background:#dce3f2;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:var(--accent);width:0}
.card{background:var(--card);padding:22px;border-radius:18px;box-shadow:0 5px 20px #0001;margin-top:14px}.tag{font-size:12px;color:var(--muted);font-weight:bold;text-transform:uppercase}
.q{font-size:20px;line-height:1.42;margin:10px 0 18px}.opt{width:100%;text-align:left;border:1px solid #d8deea;background:white;padding:13px 15px;margin:7px 0;border-radius:12px;font-size:16px;cursor:pointer}
.opt:hover{border-color:var(--accent);background:#f7f9ff}.opt:disabled{cursor:default}.correct{border-color:#54b67a!important;background:#edf9f1!important}.wrong{border-color:#e57a72!important;background:#fff0ef!important}
.feedback{display:none;margin-top:15px;padding:14px;border-radius:12px;line-height:1.45}.good{display:block;background:#edf9f1;color:#0b6335}.bad{display:block;background:#fff0ef;color:#8f1d16}
button.next{display:none;margin-top:15px;border:0;background:var(--accent);color:white;padding:12px 18px;border-radius:11px;font-weight:bold;cursor:pointer}.end{text-align:center}.end h2{font-size:30px}
.small{font-size:13px;color:var(--muted);line-height:1.45}.restart{border:0;background:var(--accent);color:#fff;padding:12px 18px;border-radius:11px;font-weight:bold;cursor:pointer}
</style></head><body><div class="wrap">
<div class="hero"><h1>🏠 RES Practice #001</h1><p>20 questions · Mixed Paper 1 & Paper 2 · Practice Mode</p><p>Target: 16/20 (80%)</p></div>
<div id="quiz"><div class="stats"><div class="pill" id="num"></div><div class="pill" id="score"></div></div><div class="progress"><div class="bar" id="bar"></div></div>
<div class="card"><div class="tag" id="topic"></div><div class="q" id="question"></div><div id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next" onclick="nextQ()">Next Question →</button></div>
<p class="small">These are revision questions, not official CEA examination questions. Policy-sensitive answers are framed to current official information checked in Oct 2026.</p></div></div>
<script>const qs=[{"q": "A client insists on a discriminatory advertisement. The salesperson should:", "opts": ["Comply with applicable anti-discrimination/professional advertising guidance and refuse improper wording", "Publish anything requested", "Hide the wording in an image", "Use coded language"], "ans": 0, "exp": "Professional property advertising must comply with applicable rules/guidelines and should not facilitate improper discrimination.", "topic": "P2 Advertising"}, {"q": "Severance of a joint tenancy generally results in:", "opts": ["The relevant co-ownership becoming tenancy in common to the extent of severance", "Automatic sale of the property", "Creation of a lease", "Cancellation of title"], "ans": 0, "exp": "Severance destroys survivorship between the relevant interests and creates tenancy-in-common treatment.", "topic": "P1 Co-ownership"}, {"q": "A floating-rate mortgage generally has an interest rate that:", "opts": ["Can vary according to the agreed benchmark/formula", "Can never change", "Is decided by the salesperson", "Equals property tax"], "ans": 0, "exp": "Floating rates vary according to contractual reference rates or formulas.", "topic": "P1 Mortgage"}, {"q": "Which agency is principally responsible for land-use planning in Singapore?", "opts": ["URA", "IRAS", "MAS", "CEA"], "ans": 0, "exp": "URA is Singapore's national land-use planning and conservation authority.", "topic": "P1 Agencies"}, {"q": "The most useful way to prepare for CEA's case-study MCQs is to:", "opts": ["Identify the legal/regulatory issue, apply the rule to the facts, then choose the best answer", "Memorise only definitions without applying them", "Always choose the longest answer", "Ignore dates and parties"], "ans": 0, "exp": "Case-study questions test interpretation and application, so structured issue-rule-application reasoning is effective.", "topic": "Study Skill"}, {"q": "Which is a macroeconomic factor that may influence the property market?", "opts": ["Condition of one unit's kitchen", "National interest-rate environment", "Colour of one seller's curtains", "One tenant's furniture choice"], "ans": 1, "exp": "Interest rates operate at the wider economy/market level and can influence financing and demand.", "topic": "P1 Market"}, {"q": "A $1.4m property earns $56,000 annual gross rent. Approximate gross yield is:", "opts": ["4%", "2.5%", "5.6%", "14%"], "ans": 0, "exp": "$56,000 ÷ $1,400,000 = 4%.", "topic": "P2 Calculation"}, {"q": "The two classic considerations used to determine whether a chattel has become a fixture are mainly:", "opts": ["Price and age", "Degree and purpose of annexation", "Colour and weight", "Ownership and insurance value"], "ans": 1, "exp": "The degree of annexation and the purpose/object of annexation are central fixture tests.", "topic": "P1 Fixtures"}, {"q": "A resale HDB buyer's HFE Letter expires before the resale application is submitted. The safest response is to:", "opts": ["Check HDB's prevailing requirements and ensure valid eligibility documentation", "Proceed because validity never matters after OTP", "Alter the date manually", "Ask the seller to approve eligibility"], "ans": 0, "exp": "Current HDB terms require relevant eligibility documentation to remain valid at required transaction stages.", "topic": "P2 HDB"}, {"q": "When one party clearly refuses to perform a contractual obligation before performance is due, this may amount to:", "opts": ["Repudiation", "An easement", "A fixture", "A caveat"], "ans": 0, "exp": "A clear refusal or conduct showing unwillingness to perform may constitute repudiatory breach.", "topic": "P1 Contract"}, {"q": "A buyer discovers a restrictive covenant during a title search. The salesperson should treat it as:", "opts": ["Potentially relevant encumbrance affecting use of the land", "A furniture inventory", "Proof of freehold", "A mortgage repayment"], "ans": 0, "exp": "A restrictive covenant can burden land and may affect permitted private use even apart from public planning controls.", "topic": "P1 Title"}, {"q": "An HDB seller registered Intent to Sell yesterday and wants to grant the OTP today. Under current resale terms, the seller should generally:", "opts": ["Wait until the required 7-day period has elapsed", "Grant it immediately", "Backdate the Intent to Sell", "Ask the buyer to waive HDB rules"], "ans": 0, "exp": "HDB requires the Intent to Sell to be registered at least 7 days before granting the OTP.", "topic": "P2 HDB"}, {"q": "A foreign buyer's citizenship status can also be relevant to:", "opts": ["ABSD profile and applicable acquisition rules", "Whether fixtures exist", "Whether a lease is fixed-term", "Whether an easement exists"], "ans": 0, "exp": "Citizenship/residency status is a key factor in ABSD and some property ownership restrictions.", "topic": "P2 Stamp Duty"}, {"q": "A buyer sees a low advertised price but the salesperson knows the seller will never consider it and it was used only to attract enquiries. The main concern is:", "opts": ["Potential misleading advertising", "Joint tenancy", "Mortgage redemption", "Fixture status"], "ans": 0, "exp": "Advertising should accurately reflect the property offering and not mislead consumers.", "topic": "P2 Advertising"}, {"q": "In general, registration of land interests is important because it:", "opts": ["Has no legal consequence", "Affects legal recognition and priority of registered dealings", "Automatically removes all mortgages", "Determines market price"], "ans": 1, "exp": "Registration is central to recognition and priority of dealings under the land registration system.", "topic": "P1 Title"}, {"q": "Estate agency advertisements should generally be:", "opts": ["Accurate and not misleading", "Guaranteed to produce a sale", "Anonymous in every case", "Based on unverified claims if marked 'urgent'"], "ans": 0, "exp": "Advertising must comply with CEA requirements and should not contain misleading or inaccurate representations.", "topic": "P2 Advertising"}, {"q": "Private treaty sale generally involves:", "opts": ["Negotiation between seller and prospective buyer rather than public bidding", "Compulsory acquisition", "A government ballot only", "A mortgage enforcement only"], "ans": 0, "exp": "Private treaty is the common negotiated method of sale.", "topic": "P2 Sale Methods"}, {"q": "A sublease generally means:", "opts": ["The tenant grants a lesser term/interest while retaining a reversion", "The tenant transfers the entire remainder necessarily", "The landlord loses ownership", "A mortgage is discharged"], "ans": 0, "exp": "A subtenant receives a lesser interest while the original tenant retains an interest/reversion.", "topic": "P1 Landlord Tenant"}, {"q": "A unit rents for $3,500 per month. Ignoring expenses, annual gross rent is:", "opts": ["$42,000", "$35,000", "$3,500", "$45,500"], "ans": 0, "exp": "$3,500 × 12 = $42,000.", "topic": "P2 Calculation"}, {"q": "An assignment of a lease generally involves:", "opts": ["Transfer of the tenant's entire remaining leasehold interest to an assignee", "Creation of a shorter sub-interest only", "Automatic sale of the freehold", "Cancellation of every covenant"], "ans": 0, "exp": "Assignment transfers the assignor's remaining leasehold interest, subject to applicable consent and covenants.", "topic": "P1 Landlord Tenant"}];
let i=0,score=0,locked=false;
const letters=['A','B','C','D'];
function render(){
 locked=false;
 if(i>=qs.length){finish();return}
 const q=qs[i];
 document.getElementById('num').textContent=(i+1)+' / '+qs.length;
 document.getElementById('score').textContent='Score: '+score;
 document.getElementById('bar').style.width=(i/qs.length*100)+'%';
 document.getElementById('topic').textContent=q.topic;
 document.getElementById('question').textContent=q.q;
 const box=document.getElementById('options');box.innerHTML='';
 q.opts.forEach((o,k)=>{let b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+letters[k]+'.</b> '+o;b.onclick=()=>choose(k,b);box.appendChild(b)});
 let f=document.getElementById('feedback');f.className='feedback';f.innerHTML='';
 document.getElementById('next').style.display='none';
}
function choose(k,b){
 if(locked)return;locked=true;
 const q=qs[i], buttons=[...document.querySelectorAll('.opt')];
 buttons.forEach(x=>x.disabled=true);buttons[q.ans].classList.add('correct');
 const f=document.getElementById('feedback');
 if(k===q.ans){score++;f.className='feedback good';f.innerHTML='<b>✓ Correct.</b> '+q.exp}
 else{b.classList.add('wrong');f.className='feedback bad';f.innerHTML='<b>✗ Not quite. Correct answer: '+letters[q.ans]+'.</b><br>'+q.exp}
 document.getElementById('score').textContent='Score: '+score;
 document.getElementById('next').style.display='inline-block';
}
function nextQ(){i++;render()}
function finish(){
 document.getElementById('bar').style.width='100%';
 let pct=Math.round(score/qs.length*100),msg=pct>=80?'Strong attempt — move on, then revisit your wrong answers.':pct>=60?'Getting there — review the explanations and retry later.':'Use this set as revision: focus on why each wrong option was wrong.';
 document.getElementById('quiz').innerHTML='<div class="card end"><h2>'+score+' / '+qs.length+' ('+pct+'%)</h2><p>'+msg+'</p><button class="restart" onclick="location.reload()">Try Again</button><p class="small">Practice material only. Always check current CEA/HDB/IRAS/URA rules for policy-sensitive topics.</p></div>';
}
render();
</script></body></html>
