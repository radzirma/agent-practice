<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RES Practice #004</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#65708a;--accent:#315efb;--good:#137a43;--bad:#b42318}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:820px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#172554,#315efb);color:white;padding:25px;border-radius:20px;box-shadow:0 8px 24px #0002}
.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:4px 0;opacity:.92}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.pill{background:white;border-radius:999px;padding:9px 14px;box-shadow:0 3px 12px #0001;font-weight:bold}.progress{height:10px;background:#dce3f2;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:var(--accent);width:0}
.card{background:var(--card);padding:22px;border-radius:18px;box-shadow:0 5px 20px #0001;margin-top:14px}.tag{font-size:12px;color:var(--muted);font-weight:bold;text-transform:uppercase}
.q{font-size:20px;line-height:1.42;margin:10px 0 18px}.opt{width:100%;text-align:left;border:1px solid #d8deea;background:white;padding:13px 15px;margin:7px 0;border-radius:12px;font-size:16px;cursor:pointer}
.opt:hover{border-color:var(--accent);background:#f7f9ff}.opt:disabled{cursor:default}.correct{border-color:#54b67a!important;background:#edf9f1!important}.wrong{border-color:#e57a72!important;background:#fff0ef!important}
.feedback{display:none;margin-top:15px;padding:14px;border-radius:12px;line-height:1.45}.good{display:block;background:#edf9f1;color:#0b6335}.bad{display:block;background:#fff0ef;color:#8f1d16}
button.next{display:none;margin-top:15px;border:0;background:var(--accent);color:white;padding:12px 18px;border-radius:11px;font-weight:bold;cursor:pointer}.end{text-align:center}.end h2{font-size:30px}
.small{font-size:13px;color:var(--muted);line-height:1.45}.restart{border:0;background:var(--accent);color:#fff;padding:12px 18px;border-radius:11px;font-weight:bold;cursor:pointer}
</style></head><body><div class="wrap">
<div class="hero"><h1>🏠 RES Practice #004</h1><p>20 questions · Mixed Paper 1 & Paper 2 · Practice Mode</p><p>Target: 16/20 (80%)</p></div>
<div id="quiz"><div class="stats"><div class="pill" id="num"></div><div class="pill" id="score"></div></div><div class="progress"><div class="bar" id="bar"></div></div>
<div class="card"><div class="tag" id="topic"></div><div class="q" id="question"></div><div id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next" onclick="nextQ()">Next Question →</button></div>
<p class="small">These are revision questions, not official CEA examination questions. Policy-sensitive answers are framed to current official information checked in Oct 2026.</p></div></div>
<script>const qs=[{"q": "A buyer relies on a salesperson's careless statement about an important property fact and suffers foreseeable financial loss. The salesperson's potential civil exposure most directly raises:", "opts": ["Negligent misstatement/negligence", "Succession", "Joint tenancy", "State lease reversion"], "ans": 0, "exp": "Professional statements may attract a duty of care; careless inaccurate advice can lead to negligence liability.", "topic": "P1 Negligence"}, {"q": "BSD is generally computed on:", "opts": ["The higher of purchase price or market value, under applicable rates", "The lower of price or market value", "Only the buyer's income", "Only the outstanding mortgage"], "ans": 0, "exp": "Stamp duty valuation generally uses consideration or market value, whichever is higher, subject to applicable rules.", "topic": "P2 Stamp Duty"}, {"q": "A salesperson receiving a referral fee or benefit that creates a conflict should:", "opts": ["Comply with disclosure/consent and professional requirements", "Hide it from the client", "Assume all referral fees are irrelevant", "Change the property address"], "ans": 0, "exp": "Financial interests/referral arrangements can create conflicts and must be handled under professional requirements.", "topic": "P2 Ethics"}, {"q": "A salesperson carelessly provides inaccurate factual advice to a client who reasonably relies on it and suffers loss. This may raise:", "opts": ["Negligent misrepresentation/negligence issues", "Only easement issues", "Only fixture issues", "No legal issue because advice is never actionable"], "ans": 0, "exp": "Careless statements in circumstances giving rise to a duty can create negligence/negligent misstatement liability.", "topic": "P1 Negligence"}, {"q": "A beneficiary under a trust primarily holds:", "opts": ["A beneficial/equitable interest subject to the trust", "A planning permit", "A mortgage licence", "A salesperson registration"], "ans": 0, "exp": "The beneficiary's interest is beneficial/equitable rather than necessarily legal title.", "topic": "P1 Trust"}, {"q": "For a foreign person interested in Singapore residential property, the salesperson should:", "opts": ["Check applicable foreign ownership restrictions/approval requirements and advise legal verification where needed", "Assume all residential property can be bought freely", "Use HDB rules only", "Guarantee approval"], "ans": 0, "exp": "Foreign ownership restrictions can apply, especially to restricted residential property; current rules and approvals must be checked.", "topic": "P2 Restrictions"}, {"q": "ABSD, where applicable, is paid:", "opts": ["In addition to BSD", "Instead of BSD in every case", "Only by sellers", "Only on commercial property"], "ans": 0, "exp": "ABSD is an additional duty on qualifying residential acquisitions and is on top of BSD.", "topic": "P2 Stamp Duty"}, {"q": "A gift of property differs from a sale primarily because a gift:", "opts": ["Is a voluntary transfer without sale consideration, subject to formalities", "Never transfers any interest", "Cannot be made during life", "Is automatically exempt from all legal consequences"], "ans": 0, "exp": "A gift is voluntary and must still comply with applicable formalities and may have legal/tax/insolvency implications.", "topic": "P1 Gift"}, {"q": "The asking price of a property is:", "opts": ["The seller's requested price, not necessarily its market value or eventual transaction price", "Always the official valuation", "Always the final sale price", "Set by CEA"], "ans": 0, "exp": "Asking price is an offer-side marketing figure; negotiation and market evidence determine outcomes.", "topic": "P2 Marketing"}, {"q": "At the time an HDB resale seller grants an OTP, the buyer should generally have:", "opts": ["A valid HDB Flat Eligibility (HFE) Letter", "Only an informal bank estimate", "A CEA licence", "A strata title in the buyer's name"], "ans": 0, "exp": "Current HDB procedures require the buyer to have a valid HFE Letter when the OTP is granted.", "topic": "P2 HDB"}, {"q": "If monthly rent is $4,000, the annual gross rent is:", "opts": ["$48,000", "$4,000", "$40,000", "$52,000"], "ans": 0, "exp": "$4,000 × 12 = $48,000.", "topic": "P2 Calculation"}, {"q": "A purchaser of a completed private property commonly conducts:", "opts": ["Title and legal due diligence through appropriate conveyancing processes", "No legal checks at all", "HDB HFE assessment", "CEA salesperson registration"], "ans": 0, "exp": "Completed private property transactions require conveyancing/title and other due diligence.", "topic": "P2 Private Property"}, {"q": "A freehold estate is best contrasted with a leasehold estate because a freehold:", "opts": ["Must always be strata-titled", "Is not limited to a fixed term in the same way as a leasehold estate", "Can never be transferred", "Is owned by the State only"], "ans": 1, "exp": "Leasehold interests run for a defined term, whereas freehold estates are not limited by such a fixed lease term.", "topic": "P1 Estates"}, {"q": "A buyer should budget beyond the purchase price because transaction costs may include:", "opts": ["Stamp duties, legal fees and financing-related costs where applicable", "Only renovation", "Only salesperson registration fee", "No other costs ever"], "ans": 0, "exp": "Property acquisition commonly involves stamp duty, legal and financing costs in addition to price.", "topic": "P2 Finance"}, {"q": "The standard of care expected of a professional salesperson is generally assessed against:", "opts": ["Reasonable competence expected in that role and circumstances", "The salesperson's personal preferred standard only", "The buyer's occupation", "The property's age only"], "ans": 0, "exp": "Professionals are expected to exercise reasonable skill and care appropriate to their role.", "topic": "P1 Negligence"}, {"q": "An easement is best described as:", "opts": ["A proprietary right enjoyed over another person's land", "A personal promise to lend money", "A tax on land", "A tenancy deposit"], "ans": 0, "exp": "An easement is a right benefiting land/person in relation to another parcel of land, such as a right of way.", "topic": "P1 Easements"}, {"q": "A landlord wants to keep the entire deposit merely because the tenant is moving out on time. The salesperson should:", "opts": ["Refer to the tenancy terms, actual breaches/deductions and applicable law rather than assume automatic forfeiture", "Tell the landlord deposits are always forfeited", "Pay it to the agent", "Convert it to commission"], "ans": 0, "exp": "Security deposits are governed by the tenancy and legitimate claims; they are not automatically forfeited.", "topic": "P2 Leasing"}, {"q": "A tenant transfers the whole remaining 18 months of a lease to another person, subject to required consent. This is most likely:", "opts": ["Subletting", "Assignment", "Licence", "Mortgage"], "ans": 1, "exp": "Transfer of the whole remaining leasehold interest is characteristic of assignment.", "topic": "P1 Landlord Tenant"}, {"q": "Which feature most clearly distinguishes direct real estate ownership from owning shares in a listed property company?", "opts": ["Direct ownership gives a proprietary interest in a specific property", "Shares always give the shareholder legal title to company properties", "Direct property can always be sold more quickly than shares", "Property shares are not affected by market conditions"], "ans": 0, "exp": "Direct ownership gives the owner an interest in the particular real property; owning company shares gives an interest in the company, not title to its individual properties.", "topic": "P1 Market"}, {"q": "When CPF funds are used for housing, a salesperson should:", "opts": ["Avoid giving unsupported CPF advice and direct clients to prevailing CPF rules/calculators where necessary", "Assume CPF can fund every amount", "Guarantee future CPF refunds", "Ignore accrued interest"], "ans": 0, "exp": "CPF housing usage is governed by prevailing CPF rules; accurate current information is essential.", "topic": "P2 Finance"}];
let i=0,score=0,locked=false;
const letters=['A','B','C','D'];
function render(){
 locked=false;
 if(i>=qs.length){finish();return}
 const q=qs[i];
 document.getElementById('num').textContent=(i+1)+' / '+qs.length;
 document.getElementById('score').textContent='Score: '+score;
 document.getElementById('bar').style.width=(i/qs.length*100)+'%';
 document.getElementById('topic').textContent=q.topic;
 document.getElementById('question').textContent=q.q;
 const box=document.getElementById('options');box.innerHTML='';
 q.opts.forEach((o,k)=>{let b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+letters[k]+'.</b> '+o;b.onclick=()=>choose(k,b);box.appendChild(b)});
 let f=document.getElementById('feedback');f.className='feedback';f.innerHTML='';
 document.getElementById('next').style.display='none';
}
function choose(k,b){
 if(locked)return;locked=true;
 const q=qs[i], buttons=[...document.querySelectorAll('.opt')];
 buttons.forEach(x=>x.disabled=true);buttons[q.ans].classList.add('correct');
 const f=document.getElementById('feedback');
 if(k===q.ans){score++;f.className='feedback good';f.innerHTML='<b>✓ Correct.</b> '+q.exp}
 else{b.classList.add('wrong');f.className='feedback bad';f.innerHTML='<b>✗ Not quite. Correct answer: '+letters[q.ans]+'.</b><br>'+q.exp}
 document.getElementById('score').textContent='Score: '+score;
 document.getElementById('next').style.display='inline-block';
}
function nextQ(){i++;render()}
function finish(){
 document.getElementById('bar').style.width='100%';
 let pct=Math.round(score/qs.length*100),msg=pct>=80?'Strong attempt — move on, then revisit your wrong answers.':pct>=60?'Getting there — review the explanations and retry later.':'Use this set as revision: focus on why each wrong option was wrong.';
 document.getElementById('quiz').innerHTML='<div class="card end"><h2>'+score+' / '+qs.length+' ('+pct+'%)</h2><p>'+msg+'</p><button class="restart" onclick="location.reload()">Try Again</button><p class="small">Practice material only. Always check current CEA/HDB/IRAS/URA rules for policy-sensitive topics.</p></div>';
}
render();
</script></body></html>
