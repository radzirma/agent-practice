<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RES Paper 1 Practice #014</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f4f6f8;margin:0;color:#18212b}
.wrap{max-width:760px;margin:auto;padding:20px} .card{background:white;border-radius:16px;padding:22px;box-shadow:0 3px 16px #0001}
h1{font-size:1.45rem;margin:0 0 6px} .meta{color:#65717e;margin-bottom:14px} .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.badge{background:#eef2f6;border-radius:999px;padding:7px 11px;font-weight:650} .bar{height:9px;background:#e8edf2;border-radius:9px;overflow:hidden;margin:14px 0}
.bar>div{height:100%;background:#374151;width:0} .q{font-size:1.08rem;font-weight:700;line-height:1.45;margin:16px 0}
.topic{font-size:.85rem;color:#65717e} button.option{width:100%;text-align:left;padding:13px 14px;margin:7px 0;border:1px solid #ccd4dc;background:#fff;border-radius:11px;font-size:1rem;cursor:pointer}
button.option:hover{background:#f7f9fb} button.option:disabled{cursor:default} .correct{border-color:#25804b!important;background:#eefaf3!important} .wrong{border-color:#b83b3b!important;background:#fff1f1!important}
.feedback{margin-top:14px;padding:13px;border-radius:10px;background:#f5f7fa;line-height:1.45;display:none} .next,.start{border:0;border-radius:10px;background:#1f2937;color:white;padding:12px 18px;font-weight:700;cursor:pointer;margin-top:14px}
.result{text-align:center;display:none} .big{font-size:2.2rem;font-weight:800} small{color:#65717e}
</style></head><body><div class="wrap"><div class="card">
<div id="quiz">
<h1>RES Paper 1 · Practice #014</h1>
<div class="meta">20 questions · Medium / Exam Standard 🟠 · Choices reshuffle every attempt</div>
<div class="top"><span class="badge" id="progress">Question 1 / 20</span><span class="badge" id="score">Score 0</span><span class="badge" id="timer">00:00</span></div>
<div class="bar"><div id="bar"></div></div><div class="topic" id="topic"></div><div class="q" id="q"></div><div id="options"></div>
<div class="feedback" id="feedback"></div><button class="next" id="next" style="display:none">Next Question</button>
</div>
<div class="result" id="result"><h1>Practice #014 Complete</h1><div class="big" id="final"></div><p id="timing"></p><p><small>Retry reshuffles every question's A/B/C/D choices, so learn the answer—not the letter.</small></p><button class="start" id="retry">Retry Practice</button></div>
</div></div>
<script>
const BASE=[{"topic": "L1 Property", "q": "Which statement best distinguishes direct real estate from a REIT?", "options": ["Direct real estate involves a direct property interest; a REIT is an indirect investment vehicle holding real-estate assets", "A REIT gives every unit-holder title to a particular strata lot", "Direct real estate is necessarily more liquid than a listed REIT", "REITs cannot derive rental income"], "answer": 0, "explanation": "The notes distinguish direct property ownership/interests from investment through a REIT."}, {"topic": "L1 Agencies", "q": "Which agency is most directly associated with land-use planning and the Master Plan?", "options": ["URA", "SLA", "BCA", "IRAS"], "answer": 0, "explanation": "URA is Singapore's land-use planning authority in the course notes."}, {"topic": "L2 Land", "q": "When deciding whether an item has become a fixture, which pair of tests is central?", "options": ["Degree and purpose of annexation", "Price and age of the item", "Ownership and market value", "Planning use and plot ratio"], "answer": 0, "explanation": "The fixture analysis in the notes uses degree and purpose/object of annexation."}, {"topic": "L2 Land", "q": "Which is the best example of an incorporeal hereditament?", "options": ["An easement", "A building", "A tree rooted in the land", "Soil"], "answer": 0, "explanation": "An easement is an intangible right connected with land; buildings, trees and soil are corporeal."}, {"topic": "L3 Future Interest", "q": "O grants a life estate to A, and when A dies the property returns to O. O's future interest is a:", "options": ["Reversion", "Remainder", "Licence", "Charge"], "answer": 0, "explanation": "A reversion is the future interest retained by the grantor when possession returns to the grantor."}, {"topic": "L3 Mortgage", "q": "A legal mortgage is best described as:", "options": ["Security over property for repayment of a debt", "A transfer by gift without consideration", "A personal permission to occupy land", "A right of survivorship"], "answer": 0, "explanation": "The notes define a mortgage as security for a debt/loan."}, {"topic": "L4 Caveat", "q": "A salesperson is owed commission and wants to lodge a caveat solely to pressure the owner to pay. According to the notes:", "options": ["Unpaid commission alone does not give the salesperson the required property interest to lodge a caveat", "Any unpaid debt automatically creates a caveatable interest", "The salesperson becomes a mortgagee", "The caveat automatically transfers title"], "answer": 0, "explanation": "A caveat requires an appropriate interest in the land; an unpaid commission claim alone is not such an interest."}, {"topic": "L4 Easement", "q": "When the same person comes to own both the dominant and servient tenements, which concept may extinguish the easement?", "options": ["Merger", "Ratification", "Novation", "Frustration"], "answer": 0, "explanation": "The notes cover merger as a way an easement may be extinguished."}, {"topic": "L5 Co-ownership", "q": "Which feature best describes tenancy in common?", "options": ["Each co-owner has a distinct undivided share that can pass through the owner's estate", "The survivor automatically takes the deceased's share", "The co-owners have no proprietary interest", "All shares must always be equal"], "answer": 0, "explanation": "Tenants in common hold distinct undivided shares and there is no automatic survivorship."}, {"topic": "L5 Succession", "q": "A non-Muslim dies intestate. Which document is generally associated with authority to administer the estate?", "options": ["Letters of administration", "Grant of probate to an executor under the will", "Option to Purchase", "Mortgage discharge"], "answer": 0, "explanation": "Letters of administration are generally associated with administration where there is no valid will/executor acting under it."}, {"topic": "L6 Contract", "q": "A buyer says, 'I accept your offer, provided completion is delayed by two months.' This is most likely:", "options": ["A counter-offer", "An unqualified acceptance", "A completed conveyance", "A deed"], "answer": 0, "explanation": "Changing a term while purporting to accept is a counter-offer rather than an unqualified acceptance."}, {"topic": "L6 Contract", "q": "Which statement best distinguishes a condition from a warranty?", "options": ["A condition is generally more fundamental; breach may justify stronger remedies than breach of a warranty", "A warranty is always more fundamental", "They are identical in importance and remedy", "Breach of a warranty always automatically ends the contract"], "answer": 0, "explanation": "The notes distinguish a condition as a more fundamental term from a warranty."}, {"topic": "L7 Tenancy", "q": "Which combination is identified in the notes as essential to a valid lease?", "options": ["Exclusive possession, a certain/definite term, and intention to create a lease", "Payment of commission, a caveat and a mortgage", "A dominant tenement, servient tenement and right of way", "A will, probate and transmission"], "answer": 0, "explanation": "The notes identify exclusive possession, certainty of term and intention to create a lease."}, {"topic": "L7 Tenancy", "q": "A tenant transfers the entire remaining lease term to T2. This is most accurately:", "options": ["An assignment", "A sublease", "A surrender", "A licence"], "answer": 0, "explanation": "Assignment transfers the tenant's entire remaining lease interest."}, {"topic": "L8 Tort", "q": "According to the trainer notes, caveat emptor does not protect against:", "options": ["Negligent or fraudulent misrepresentation", "Every defect a buyer could discover", "Every change in market price", "Every refusal by a seller to accept an offer"], "answer": 0, "explanation": "The trainer questionnaire states caveat emptor does not apply where negligent or fraudulent misrepresentation occurs."}, {"topic": "L8 Agency", "q": "A salesperson receives an offer below the seller's asking price. Which action best reflects the agent's duty in the notes?", "options": ["Transmit the offer to the client rather than suppress it merely because it is low", "Reject it personally without authority", "Ignore it because it is below asking", "Accept it automatically for the seller"], "answer": 0, "explanation": "The agency syllabus includes the duty to transmit all offers to the client."}, {"topic": "L9 Players", "q": "Which participant most directly creates new real-estate products by developing land/buildings?", "options": ["Developer", "Tenant", "Mortgagee", "Beneficiary"], "answer": 0, "explanation": "Developers are identified as market players who create new property products."}, {"topic": "L9 Market", "q": "Which statement best reflects the notes' comparison of short-term property supply and demand?", "options": ["Supply tends to be relatively inelastic in the short term, while demand can respond more readily to market stimulants", "Both are completely fixed", "Supply is always perfectly elastic", "Demand cannot respond to interest rates"], "answer": 0, "explanation": "Real-estate supply usually takes time to adjust, while demand can respond faster to market conditions."}, {"topic": "L7 Tenancy", "q": "A tenant grants T2 possession for a shorter period than the tenant's own remaining term and retains a reversion. This is:", "options": ["A sublease", "An assignment of the whole term", "A mortgage", "A novation"], "answer": 0, "explanation": "A sublease leaves the original tenant with a reversion because less than the whole remaining term is granted."}, {"topic": "L8 Negligence", "q": "For RES purposes, negligent misrepresentation specifically concerns:", "options": ["A careless false statement/advice causing reliance and loss", "Only deliberate fraud", "Any physical accident regardless of statements", "A breach of a restrictive covenant only"], "answer": 0, "explanation": "Negligent misrepresentation concerns a carelessly made false statement that causes reliance and loss."}];
let qs=[],idx=0,score=0,answered=false,startTime=0,timerId=null;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeAttempt(){
 qs=BASE.map(x=>{let arr=x.options.map((t,i)=>({t,ok:i===x.answer}));shuffle(arr);return {...x,choices:arr}});
 idx=0;score=0;answered=false;startTime=Date.now();clearInterval(timerId);timerId=setInterval(tick,1000);tick();
 $("quiz").style.display="block";$("result").style.display="none";render();
}
function tick(){let s=Math.floor((Date.now()-startTime)/1000);$("timer").textContent=fmt(s)}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function render(){
 answered=false;let x=qs[idx];$("progress").textContent=`Question ${idx+1} / ${qs.length}`;$("score").textContent=`Score ${score}`;
 $("bar").style.width=((idx)/qs.length*100)+"%";$("topic").textContent=x.topic;$("q").textContent=x.q;$("feedback").style.display="none";$("next").style.display="none";
 let box=$("options");box.innerHTML="";x.choices.forEach((c,i)=>{let b=document.createElement("button");b.className="option";b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${c.t}`;b.onclick=()=>choose(i,b);box.appendChild(b)})
}
function choose(i,b){
 if(answered)return;answered=true;let x=qs[idx],buttons=[...document.querySelectorAll(".option")];buttons.forEach(z=>z.disabled=true);
 if(x.choices[i].ok){score++;b.classList.add("correct")}else{b.classList.add("wrong");let ci=x.choices.findIndex(c=>c.ok);buttons[ci].classList.add("correct")}
 let ci=x.choices.findIndex(c=>c.ok), letter=String.fromCharCode(65+ci);$("score").textContent=`Score ${score}`;
 $("feedback").innerHTML=`<b>${x.choices[i].ok?"Correct ✓":"Not quite ✗"}</b><br>Correct answer: <b>${letter}. ${x.choices[ci].t}</b><br><br>${x.explanation}`;
 $("feedback").style.display="block";$("next").style.display="inline-block";$("next").textContent=idx===qs.length-1?"See Results":"Next Question";
}
$("next").onclick=()=>{if(idx<qs.length-1){idx++;render()}else finish()};
function finish(){
 clearInterval(timerId);let secs=Math.floor((Date.now()-startTime)/1000),pct=Math.round(score/qs.length*100);
 $("quiz").style.display="none";$("result").style.display="block";$("final").textContent=`${score} / ${qs.length} · ${pct}%`;
 $("timing").textContent=`Total time: ${fmt(secs)} · Average: ${Math.round(secs/qs.length)} sec/question`;
}
$("retry").onclick=makeAttempt;makeAttempt();
</script></body></html>
