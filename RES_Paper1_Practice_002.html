<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RES Paper 1 Practice 2</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;margin:0;background:#f4f6f8;color:#18212b}.wrap{max-width:820px;margin:auto;padding:18px}.card{background:white;border-radius:16px;padding:22px;box-shadow:0 4px 20px #0001;margin-top:14px}h1{font-size:1.45rem;margin:.2rem 0}.sub{color:#5c6875}.top{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}.pill{background:#eef2f6;padding:8px 12px;border-radius:999px;font-weight:700}.bar{height:9px;background:#e6ebef;border-radius:8px;overflow:hidden;margin:14px 0}.bar>div{height:100%;background:#1f7a4d;width:0}.topic{font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#667}.q{font-size:1.12rem;font-weight:750;line-height:1.45;margin:10px 0 16px}button.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin:9px 0;border:1px solid #cfd7df;border-radius:11px;background:#fff;font-size:1rem;cursor:pointer}button.opt:hover{background:#f7f9fb}button.opt.correct{background:#e7f6ec;border-color:#3a9b61}button.opt.wrong{background:#fdeaea;border-color:#c95151}button:disabled{cursor:default;color:inherit}.feedback{display:none;margin-top:15px;padding:13px;border-radius:10px;background:#f3f6f8;line-height:1.45}.next{display:none;margin-top:15px;border:0;border-radius:10px;background:#18212b;color:#fff;padding:12px 18px;font-weight:800;cursor:pointer}.result{display:none;text-align:center}.big{font-size:2.2rem;font-weight:900}.home{color:#185b9d;text-decoration:none}@media(max-width:520px){.wrap{padding:10px}.card{padding:16px}}</style></head><body><div class="wrap"><a class="home" href="index.html">← All Paper 1 Sets</a><div class="card"><div class="top"><div><h1>RES Paper 1 — Practice 2</h1><div class="sub">20 questions • Medium difficulty • Training-note based</div></div><div><span class="pill" id="timer">00:00</span> <span class="pill" id="score">0/20</span></div></div><div class="bar"><div id="prog"></div></div><div id="quiz"><div class="topic" id="topic"></div><div class="q" id="q"></div><div id="opts"></div><div class="feedback" id="fb"></div><button class="next" id="next">Next question →</button></div><div class="result" id="result"><div class="big" id="final"></div><p id="timefinal"></p><p id="summary"></p><button class="next" style="display:inline-block" onclick="location.reload()">Try again</button> <a href="index.html"><button class="next" style="display:inline-block">Choose another set</button></a></div></div></div>
<script>const qs=[{"topic": "Capacity", "q": "A salesperson is dealing with a client who may lack mental capacity to manage a property transaction. Which legal framework is particularly relevant?", "opts": ["Mental Capacity Act and any valid LPA", "Only the Sale of Goods Act", "Only the Road Traffic Act", "No legal framework is relevant"], "ans": 0, "exp": "The training notes specifically require familiarity with the Mental Capacity Act and Lasting Power of Attorney."}, {"topic": "Capacity", "q": "Why should a salesperson verify a party’s legal capacity before treating an agreement as straightforwardly enforceable?", "opts": ["Capacity determines postal district", "Capacity is one of the elements relevant to a valid contract", "Capacity creates an easement", "Capacity replaces consideration"], "ans": 1, "exp": "Capacity of parties is an essential contract consideration."}, {"topic": "Land Description", "q": "For a strata-titled apartment, which description is particularly relevant to identifying the unit’s legal parcel?", "opts": ["Tenant’s NRIC only", "Business name", "Strata lot", "Furniture inventory"], "ans": 2, "exp": "Strata lots are used in the legal description of strata property."}, {"topic": "Land Description", "q": "A car-park lot legally attached for use with a strata lot may be described as an:", "opts": ["Floating mortgage", "Future interest", "Licence at will", "Accessory lot"], "ans": 3, "exp": "The notes require identification of land lot, strata lot and accessory lot."}, {"topic": "Law in Singapore", "q": "Where a valid statute conflicts with a common-law rule on the same matter, which generally prevails?", "opts": ["Statute", "Custom", "Equity", "The older rule automatically"], "ans": 0, "exp": "The training notes state that statutes prevail over common law and equity."}, {"topic": "Law in Singapore", "q": "Equity is most closely associated in the notes with:", "opts": ["Postal districts", "Fairness and natural justice", "Building height only", "Bank interest rates"], "ans": 1, "exp": "The notes characterise equity by fairness and natural justice."}, {"topic": "Land", "q": "Which statement is MOST accurate?", "opts": ["Every item physically inside a property is automatically land", "Personal property can never be sold with real property", "Fixtures may form part of land, while chattels remain personal property", "An easement is a movable chattel"], "ans": 2, "exp": "The legal distinction turns on whether an item is a fixture or chattel, not merely its physical location."}, {"topic": "Interests in Land", "q": "After a purchaser validly exercises an OTP but before legal completion and registration, the purchaser is commonly described in the notes as holding:", "opts": ["No interest at all", "A mortgagee’s legal charge", "Only a personal licence", "An equitable interest"], "ans": 3, "exp": "The training material treats the exercised purchaser as having an equitable interest capable of protection by caveat."}, {"topic": "Caveat", "q": "Why may a purchaser with a recognised interest lodge a caveat during a transaction?", "opts": ["To protect the claimed interest by giving notice on the title", "To change the zoning", "To convert leasehold into freehold", "To cancel all mortgages automatically"], "ans": 0, "exp": "A caveat gives notice of a claimed interest and helps protect it during the transaction."}, {"topic": "Caveat", "q": "An estate salesperson is owed unpaid commission by a client. Based on the training notes, why can the salesperson not simply lodge a caveat over the client’s property?", "opts": ["Commission is never payable", "The salesperson does not thereby acquire the required proprietary/caveatable interest in the land", "Only tenants can lodge caveats", "Caveats are only for HDB flats"], "ans": 1, "exp": "A mere unpaid commission claim does not itself give the salesperson a caveatable proprietary interest in the property."}, {"topic": "Mortgage", "q": "A legal mortgage is best understood as:", "opts": ["A gift of the property to the bank", "A licence to occupy", "Security over property for a loan", "A restrictive covenant"], "ans": 2, "exp": "The mortgage secures repayment of a loan against the property."}, {"topic": "Mortgage", "q": "In a mortgage, the property owner who gives the security is the:", "opts": ["Mortgagee", "Lessor necessarily", "Caveator only", "Mortgagor"], "ans": 3, "exp": "The borrower/property owner is the mortgagor; the lender is the mortgagee."}, {"topic": "Mortgage", "q": "The lender under a legal mortgage is the:", "opts": ["Mortgagee", "Mortgagor", "Donee", "Lessee"], "ans": 0, "exp": "The lender taking the mortgage security is the mortgagee."}, {"topic": "Mortgage", "q": "What is the mortgagor’s right of redemption?", "opts": ["The right to ignore the loan", "The right to recover full unencumbered ownership upon satisfying the secured debt according to law", "The right to convert the property to State land", "The right to create an easement over a neighbour"], "ans": 1, "exp": "Redemption concerns the owner’s right to redeem the property from the mortgage by satisfying the debt."}, {"topic": "Mortgage", "q": "Where a legal mortgage and a later equitable mortgage compete, the notes emphasise that the legal mortgage generally has:", "opts": ["No relevance", "Only a personal right", "Priority", "Automatic extinction"], "ans": 2, "exp": "The training notes state that the legal mortgage takes priority over an equitable mortgage."}, {"topic": "Mortgage", "q": "When CPF monies are used for residential property, the notes describe CPF Board as a:", "opts": ["Developer", "Tenant at will", "Donee", "Chargee with an interest protected on title"], "ans": 3, "exp": "The course material describes CPF Board as chargee and refers to a caveat/charge-related protection."}, {"topic": "Estates", "q": "A 99-year interest granted by the State is fundamentally a:", "opts": ["Leasehold estate", "Fee simple absolute forever", "Personal licence only", "Chattel"], "ans": 0, "exp": "A fixed 99-year term is leasehold."}, {"topic": "Future Interests", "q": "At the expiry of a lease, the superior owner’s interest in getting the land back is the:", "opts": ["Remainder only", "Reversionary interest", "Licence", "Chattel interest"], "ans": 1, "exp": "Reversion is the interest remaining in the grantor/lessor after the lesser estate ends."}, {"topic": "Future Interests", "q": "A life estate is granted to A, with the property to pass to B after A dies. B’s future interest is most accurately a:", "opts": ["Licence", "Mortgage", "Remainder interest", "Periodic tenancy"], "ans": 2, "exp": "The future interest created in another person after a life estate is a remainder."}, {"topic": "Interests in Land", "q": "A tenant in possession under a valid lease has which type of right in the property compared with a dinner guest?", "opts": ["Both only personal rights", "Neither has any rights", "Guest has greater proprietary rights", "Tenant has proprietary leasehold rights; guest ordinarily has personal permission/licence"], "ans": 3, "exp": "A lease gives a proprietary interest; ordinary permission to visit is personal/licence-based."}];let i=0,score=0,answered=false;const start=Date.now();const letters=['A','B','C','D'];function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}setInterval(()=>{document.getElementById('timer').textContent=fmt(Math.floor((Date.now()-start)/1000))},1000);function render(){answered=false;let x=qs[i];topic.textContent=x.topic;q.textContent=(i+1)+'. '+x.q;opts.innerHTML='';fb.style.display='none';next.style.display='none';x.opts.forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+letters[j]+'.</b> '+o;b.onclick=()=>pick(j,b);opts.appendChild(b)});prog.style.width=((i)/qs.length*100)+'%';scoreEl()}function scoreEl(){document.getElementById('score').textContent=score+'/20'}function pick(j,b){if(answered)return;answered=true;let x=qs[i];[...opts.children].forEach((el,k)=>{el.disabled=true;if(k===x.ans)el.classList.add('correct')});if(j===x.ans){score++;fb.innerHTML='<b>Correct.</b> '+x.exp}else{b.classList.add('wrong');fb.innerHTML='<b>Not quite.</b> Correct answer: <b>'+letters[x.ans]+'. '+x.opts[x.ans]+'</b><br>'+x.exp}fb.style.display='block';next.style.display='inline-block';scoreEl()}next.onclick=()=>{i++;if(i<qs.length)render();else finish()};function finish(){quiz.style.display='none';result.style.display='block';prog.style.width='100%';let sec=Math.floor((Date.now()-start)/1000),pct=Math.round(score/qs.length*100);final.textContent=score+'/20 ('+pct+'%)';timefinal.textContent='Time taken: '+fmt(sec);summary.textContent=pct>=80?'Strong result. Review any misses, then move to the next set.':pct>=60?'Pass-range practice score, but review the explanations before moving on.':'Good diagnostic attempt — review the weak topics and retry later.'}render();</script></body></html>
