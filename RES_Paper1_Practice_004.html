<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RES Paper 1 Practice 4</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;margin:0;background:#f4f6f8;color:#18212b}.wrap{max-width:820px;margin:auto;padding:18px}.card{background:white;border-radius:16px;padding:22px;box-shadow:0 4px 20px #0001;margin-top:14px}h1{font-size:1.45rem;margin:.2rem 0}.sub{color:#5c6875}.top{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}.pill{background:#eef2f6;padding:8px 12px;border-radius:999px;font-weight:700}.bar{height:9px;background:#e6ebef;border-radius:8px;overflow:hidden;margin:14px 0}.bar>div{height:100%;background:#1f7a4d;width:0}.topic{font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#667}.q{font-size:1.12rem;font-weight:750;line-height:1.45;margin:10px 0 16px}button.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin:9px 0;border:1px solid #cfd7df;border-radius:11px;background:#fff;font-size:1rem;cursor:pointer}button.opt:hover{background:#f7f9fb}button.opt.correct{background:#e7f6ec;border-color:#3a9b61}button.opt.wrong{background:#fdeaea;border-color:#c95151}button:disabled{cursor:default;color:inherit}.feedback{display:none;margin-top:15px;padding:13px;border-radius:10px;background:#f3f6f8;line-height:1.45}.next{display:none;margin-top:15px;border:0;border-radius:10px;background:#18212b;color:#fff;padding:12px 18px;font-weight:800;cursor:pointer}.result{display:none;text-align:center}.big{font-size:2.2rem;font-weight:900}.home{color:#185b9d;text-decoration:none}@media(max-width:520px){.wrap{padding:10px}.card{padding:16px}}</style></head><body><div class="wrap"><a class="home" href="index.html">← All Paper 1 Sets</a><div class="card"><div class="top"><div><h1>RES Paper 1 — Practice 4</h1><div class="sub">20 questions • Medium difficulty • Training-note based</div></div><div><span class="pill" id="timer">00:00</span> <span class="pill" id="score">0/20</span></div></div><div class="bar"><div id="prog"></div></div><div id="quiz"><div class="topic" id="topic"></div><div class="q" id="q"></div><div id="opts"></div><div class="feedback" id="fb"></div><button class="next" id="next">Next question →</button></div><div class="result" id="result"><div class="big" id="final"></div><p id="timefinal"></p><p id="summary"></p><button class="next" style="display:inline-block" onclick="location.reload()">Try again</button> <a href="index.html"><button class="next" style="display:inline-block">Choose another set</button></a></div></div></div>
<script>const qs=[{"topic": "Trust", "q": "In a trust, the beneficiary generally holds the:", "opts": ["Equitable/beneficial interest", "Legal title only", "No enforceable interest", "State reversion"], "ans": 0, "exp": "The beneficiary is associated with the equitable or beneficial interest."}, {"topic": "Trust", "q": "A trust created by a living parent during the parent’s lifetime for a child is described in the notes as:", "opts": ["Testamentary trust", "Inter vivos trust", "Mortgage trust only", "Periodic trust"], "ans": 1, "exp": "Inter vivos means created during life."}, {"topic": "Trust", "q": "A trust that takes effect through a will upon death is a:", "opts": ["Resulting lease", "Licence", "Testamentary trust", "Caveat"], "ans": 2, "exp": "A testamentary trust is created through succession/will on death."}, {"topic": "Succession", "q": "A person who dies leaving a valid will dies:", "opts": ["Intestate", "Without succession", "Bankrupt by definition", "Testate"], "ans": 3, "exp": "Death with a valid will is testate succession."}, {"topic": "Succession", "q": "A person who dies without a valid will dies:", "opts": ["Intestate", "Testate", "As a mortgagee", "As a trustee automatically"], "ans": 0, "exp": "Death without a will is intestate succession."}, {"topic": "Succession", "q": "Before an executor can generally deal with a deceased owner’s property under a will, which document is particularly relevant?", "opts": ["TOL", "Grant of probate", "Building plan approval", "Estate agency card"], "ans": 1, "exp": "The notes identify grant of probate in assessing whether a beneficiary/executor can deal with inherited property."}, {"topic": "Succession", "q": "Where there is no will and an administrator is appointed, which grant is relevant?", "opts": ["Certificate of title only", "Option to purchase", "Letters of administration", "Temporary occupation licence"], "ans": 2, "exp": "Letters of administration are relevant to intestate administration."}, {"topic": "Gift", "q": "Which is MOST characteristic of a gift of property?", "opts": ["No stamp duty can ever arise", "It must always involve market-value cash payment", "It is revocable at any time regardless of conditions", "It is voluntary and without monetary consideration"], "ans": 3, "exp": "The notes describe a gift as voluntary and without monetary consideration; transfer duties may still arise."}, {"topic": "Gift", "q": "Parents transfer a condominium to their daughter without monetary consideration. Which statement is BEST according to the notes?", "opts": ["It may be a gift, and stamp duty may still be payable based on valuation", "It cannot be a gift because property is valuable", "It automatically becomes a lease", "It avoids all transfer formalities"], "ans": 0, "exp": "A gift can involve valuable property without monetary consideration, and stamp duty may still be payable."}, {"topic": "Contract", "q": "Which combination represents the “3Ps” emphasised in the course notes for offer and acceptance in property contracts?", "opts": ["Possession, Planning, Probate", "Parties, Property, Price", "Price, Permission, Priority", "Property, Probate, Performance"], "ans": 1, "exp": "The 3Ps are Parties, Property and Price."}, {"topic": "Contract", "q": "An advertisement inviting buyers to submit offers is generally more likely to be:", "opts": ["A mortgage", "A completed conveyance", "An invitation to treat", "A caveat"], "ans": 2, "exp": "An invitation to treat indicates willingness to receive offers and is not itself necessarily an offer."}, {"topic": "Contract", "q": "A buyer makes an offer of $1.2m. The seller replies, “I will sell for $1.25m.” The seller’s response is MOST likely:", "opts": ["Acceptance of the original offer", "A caveat", "A completed transfer", "A counter-offer"], "ans": 3, "exp": "Changing the price is generally a counter-offer rather than acceptance."}, {"topic": "Contract", "q": "Which is NOT one of the essential matters highlighted in the notes for a valid contract?", "opts": ["Guaranteed future profit", "Capacity of parties", "Legality of object", "Offer and acceptance"], "ans": 0, "exp": "A guaranteed future profit is not an essential element of contract formation."}, {"topic": "Contract", "q": "A contract whose object is illegal is generally:", "opts": ["Valid because price was agreed", "Legally defective/void rather than enforceable as an ordinary valid contract", "Automatically a lease", "Converted into a gift"], "ans": 1, "exp": "Legality of object is required for a valid contract."}, {"topic": "Contract", "q": "A false statement of material fact induces a buyer to contract. Which doctrine is most directly relevant?", "opts": ["Reversion", "Easement", "Misrepresentation", "Joint tenancy"], "ans": 2, "exp": "Misrepresentation concerns false statements inducing a contract."}, {"topic": "Contract", "q": "Caveat emptor is best translated in this context as:", "opts": ["Seller beware", "Mortgagee beware", "Tenant owns all fixtures", "Buyer beware"], "ans": 3, "exp": "Caveat emptor means buyer beware, subject to qualifications such as misrepresentation and duties of disclosure."}, {"topic": "Contract", "q": "Why does caveat emptor not give a seller or agent a free licence to lie about defects?", "opts": ["Fraudulent or negligent misrepresentation may create liability", "Because every defect voids title automatically", "Because buyers never need to inspect", "Because contracts require no disclosure rules"], "ans": 0, "exp": "The training notes specifically distinguish caveat emptor from misrepresentation and disclosure obligations."}, {"topic": "Contract", "q": "A term goes to the root of the contract and its breach may justify termination. It is more likely a:", "opts": ["Warranty", "Condition", "Licence", "Caveat"], "ans": 1, "exp": "A condition is more fundamental than a warranty; breach can support stronger remedies."}, {"topic": "Contract", "q": "A less fundamental contractual promise whose breach ordinarily gives a damages remedy is more likely a:", "opts": ["Condition only", "Easement", "Warranty", "Estate"], "ans": 2, "exp": "A warranty is generally collateral/less fundamental, with damages as the usual remedy."}, {"topic": "Contract", "q": "Which event may discharge a contract?", "opts": ["A neighbour selling another property", "Merely changing one’s mind without legal basis", "A salesperson taking annual leave", "Performance of the contractual obligations"], "ans": 3, "exp": "Performance is a recognised way a contract may be discharged."}];let i=0,score=0,answered=false;const start=Date.now();const letters=['A','B','C','D'];function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}setInterval(()=>{document.getElementById('timer').textContent=fmt(Math.floor((Date.now()-start)/1000))},1000);function render(){answered=false;let x=qs[i];topic.textContent=x.topic;q.textContent=(i+1)+'. '+x.q;opts.innerHTML='';fb.style.display='none';next.style.display='none';x.opts.forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+letters[j]+'.</b> '+o;b.onclick=()=>pick(j,b);opts.appendChild(b)});prog.style.width=((i)/qs.length*100)+'%';scoreEl()}function scoreEl(){document.getElementById('score').textContent=score+'/20'}function pick(j,b){if(answered)return;answered=true;let x=qs[i];[...opts.children].forEach((el,k)=>{el.disabled=true;if(k===x.ans)el.classList.add('correct')});if(j===x.ans){score++;fb.innerHTML='<b>Correct.</b> '+x.exp}else{b.classList.add('wrong');fb.innerHTML='<b>Not quite.</b> Correct answer: <b>'+letters[x.ans]+'. '+x.opts[x.ans]+'</b><br>'+x.exp}fb.style.display='block';next.style.display='inline-block';scoreEl()}next.onclick=()=>{i++;if(i<qs.length)render();else finish()};function finish(){quiz.style.display='none';result.style.display='block';prog.style.width='100%';let sec=Math.floor((Date.now()-start)/1000),pct=Math.round(score/qs.length*100);final.textContent=score+'/20 ('+pct+'%)';timefinal.textContent='Time taken: '+fmt(sec);summary.textContent=pct>=80?'Strong result. Review any misses, then move to the next set.':pct>=60?'Pass-range practice score, but review the explanations before moving on.':'Good diagnostic attempt — review the weak topics and retry later.'}render();</script></body></html>
