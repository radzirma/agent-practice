<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RES Paper 1 Practice 3</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;margin:0;background:#f4f6f8;color:#18212b}.wrap{max-width:820px;margin:auto;padding:18px}.card{background:white;border-radius:16px;padding:22px;box-shadow:0 4px 20px #0001;margin-top:14px}h1{font-size:1.45rem;margin:.2rem 0}.sub{color:#5c6875}.top{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}.pill{background:#eef2f6;padding:8px 12px;border-radius:999px;font-weight:700}.bar{height:9px;background:#e6ebef;border-radius:8px;overflow:hidden;margin:14px 0}.bar>div{height:100%;background:#1f7a4d;width:0}.topic{font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#667}.q{font-size:1.12rem;font-weight:750;line-height:1.45;margin:10px 0 16px}button.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin:9px 0;border:1px solid #cfd7df;border-radius:11px;background:#fff;font-size:1rem;cursor:pointer}button.opt:hover{background:#f7f9fb}button.opt.correct{background:#e7f6ec;border-color:#3a9b61}button.opt.wrong{background:#fdeaea;border-color:#c95151}button:disabled{cursor:default;color:inherit}.feedback{display:none;margin-top:15px;padding:13px;border-radius:10px;background:#f3f6f8;line-height:1.45}.next{display:none;margin-top:15px;border:0;border-radius:10px;background:#18212b;color:#fff;padding:12px 18px;font-weight:800;cursor:pointer}.result{display:none;text-align:center}.big{font-size:2.2rem;font-weight:900}.home{color:#185b9d;text-decoration:none}@media(max-width:520px){.wrap{padding:10px}.card{padding:16px}}</style></head><body><div class="wrap"><a class="home" href="index.html">← All Paper 1 Sets</a><div class="card"><div class="top"><div><h1>RES Paper 1 — Practice 3</h1><div class="sub">20 questions • Medium difficulty • Training-note based</div></div><div><span class="pill" id="timer">00:00</span> <span class="pill" id="score">0/20</span></div></div><div class="bar"><div id="prog"></div></div><div id="quiz"><div class="topic" id="topic"></div><div class="q" id="q"></div><div id="opts"></div><div class="feedback" id="fb"></div><button class="next" id="next">Next question →</button></div><div class="result" id="result"><div class="big" id="final"></div><p id="timefinal"></p><p id="summary"></p><button class="next" style="display:inline-block" onclick="location.reload()">Try again</button> <a href="index.html"><button class="next" style="display:inline-block">Choose another set</button></a></div></div></div>
<script>const qs=[{"topic": "Estates", "q": "Government Land Sales sites are commonly granted for a defined term. Which interest remains with the State at the end of that term?", "opts": ["Reversionary interest", "Tenant’s chattel", "Easement by necessity automatically", "Buyer’s commission"], "ans": 0, "exp": "The grantor retains the reversionary interest in leasehold land."}, {"topic": "Easements", "q": "Two adjoining houses were under one owner and shared a facility. One house is sold. Which statement is BEST?", "opts": ["An easement can never arise after severance", "Rights may arise on severance depending on the legal basis and circumstances; ownership separation is important", "The buyer automatically owns both houses", "The shared facility becomes a chattel"], "ans": 1, "exp": "Easement issues become relevant when dominant and servient land are separately owned; the precise basis must be established."}, {"topic": "Easements", "q": "Which feature is essential to the classic concept of an easement?", "opts": ["It must last exactly 99 years", "It must involve cash rent", "It must benefit dominant land over servient land", "It must be a movable item"], "ans": 2, "exp": "An easement is a right benefiting one parcel of land over another."}, {"topic": "Licence vs Lease", "q": "A person buys a cinema ticket and is permitted to occupy a seat for the show. This is best characterised as a:", "opts": ["Lease of the cinema", "Mortgage", "Easement", "Licence"], "ans": 3, "exp": "Permission to enter/use premises for a limited purpose such as watching a movie is a licence."}, {"topic": "Licence vs Lease", "q": "A tenant rents an office with exclusive possession for a certain term. This arrangement is MOST consistent with a:", "opts": ["Lease", "Bare licence only", "Easement", "Gift"], "ans": 0, "exp": "Exclusive possession for a certain term is characteristic of a lease."}, {"topic": "Licence vs Lease", "q": "Which factor most strongly distinguishes a lease from a mere licence?", "opts": ["Colour of the premises", "Exclusive possession for a term", "Whether the occupier owns a car", "Whether the agreement is one page"], "ans": 1, "exp": "Exclusive possession is central to a lease, whereas a licence generally gives permission without a proprietary estate."}, {"topic": "Easements", "q": "If the same person becomes owner of both the dominant and servient tenements, an existing easement between them may be extinguished by:", "opts": ["Novation", "Consideration", "Merger/unity of ownership", "Bankruptcy only"], "ans": 2, "exp": "An easement cannot operate over one’s own land in the same way; unity of ownership can extinguish it."}, {"topic": "Covenants", "q": "An owner promises that no durian tree will be grown on the land. This is best described as a:", "opts": ["Positive covenant", "Licence", "Mortgage", "Restrictive covenant"], "ans": 3, "exp": "A promise not to do something on land is restrictive/negative in nature."}, {"topic": "Covenants", "q": "A restrictive covenant differs from an easement because a restrictive covenant primarily:", "opts": ["Imposes a restriction on use rather than granting a right of use over another’s land", "Transfers legal title", "Creates a tenancy automatically", "Is always movable property"], "ans": 0, "exp": "A restrictive covenant restricts conduct/use; an easement grants a land-related right over another parcel."}, {"topic": "Registration of Titles", "q": "Which dealing is specifically identified in the notes as one that may appear on title?", "opts": ["A grocery receipt", "A mortgage", "A verbal dinner invitation", "A tenant’s utility bill"], "ans": 1, "exp": "Transfers, mortgages, charges and certain leases are examples of dealings notified on title."}, {"topic": "Registration of Titles", "q": "The notes specifically mention leases exceeding what duration as dealings notified on title?", "opts": ["1 year", "3 years", "7 years", "30 years only"], "ans": 2, "exp": "The training notes state leases exceeding 7 years."}, {"topic": "Registration of Titles", "q": "The Torrens system is associated in the training notes with which principles?", "opts": ["Degree and purpose", "Offer and acceptance", "Supply and demand", "Mirror and curtain"], "ans": 3, "exp": "The notes refer to the Torrens system and the mirror and curtain principles."}, {"topic": "Caveat", "q": "Which statement BEST describes a caveat?", "opts": ["It is a notice lodged to protect/notify a claimed interest in land", "It is itself a transfer of ownership", "It is a planning permission", "It is a tenancy agreement"], "ans": 0, "exp": "A caveat is a notice of a claimed interest; it does not itself transfer ownership."}, {"topic": "State Lands", "q": "A Temporary Occupation Licence (TOL) issued by the State is best understood as:", "opts": ["A freehold title", "Temporary permission to occupy/use State land subject to its terms", "A mortgage", "A permanent easement"], "ans": 1, "exp": "A TOL is temporary permission from the State, not an estate equivalent to freehold ownership."}, {"topic": "State Lands", "q": "Differential premium is most relevant where:", "opts": ["A buyer changes estate agents", "A tenant buys furniture", "A proposed change or intensification of use affects the terms/value of State land rights", "A caveat is withdrawn"], "ans": 2, "exp": "The notes require understanding when differential premium is payable in relation to State land/development changes."}, {"topic": "Registration of Titles", "q": "What is the practical importance of checking registered interests before advising a purchaser?", "opts": ["It guarantees future market price", "It determines the buyer’s favourite district", "It removes the need for any contract", "Registered interests and encumbrances may affect the title and priority of rights"], "ans": 3, "exp": "Title searches reveal registered dealings/encumbrances and help establish priority and the state of title."}, {"topic": "Co-Ownership", "q": "Which feature is most characteristic of a joint tenancy?", "opts": ["Right of survivorship", "Each co-owner must hold a visibly unequal share", "Each share always passes under a will", "It can exist only between spouses"], "ans": 0, "exp": "Joint tenancy is associated with the right of survivorship."}, {"topic": "Co-Ownership", "q": "An investor wants his identifiable share to pass under his estate to a chosen beneficiary rather than automatically to the surviving co-owner. Which form is generally more suitable?", "opts": ["Joint tenancy", "Tenancy in common", "Licence", "Periodic tenancy"], "ans": 1, "exp": "A tenant in common has a distinct share that can pass through succession rather than survivorship."}, {"topic": "Co-Ownership", "q": "Two owners hold 70% and 30% beneficial shares. This arrangement is most consistent with:", "opts": ["Joint tenancy only", "A bare licence", "Tenancy in common", "A mortgage"], "ans": 2, "exp": "Tenancy in common can accommodate distinct/unequal shares."}, {"topic": "Trust", "q": "In a trust, the trustee generally holds the:", "opts": ["Mortgagee’s interest automatically", "Equitable interest only", "No interest of any kind", "Legal interest"], "ans": 3, "exp": "The trustee holds legal title/interest for the beneficiary."}];let i=0,score=0,answered=false;const start=Date.now();const letters=['A','B','C','D'];function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}setInterval(()=>{document.getElementById('timer').textContent=fmt(Math.floor((Date.now()-start)/1000))},1000);function render(){answered=false;let x=qs[i];topic.textContent=x.topic;q.textContent=(i+1)+'. '+x.q;opts.innerHTML='';fb.style.display='none';next.style.display='none';x.opts.forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+letters[j]+'.</b> '+o;b.onclick=()=>pick(j,b);opts.appendChild(b)});prog.style.width=((i)/qs.length*100)+'%';scoreEl()}function scoreEl(){document.getElementById('score').textContent=score+'/20'}function pick(j,b){if(answered)return;answered=true;let x=qs[i];[...opts.children].forEach((el,k)=>{el.disabled=true;if(k===x.ans)el.classList.add('correct')});if(j===x.ans){score++;fb.innerHTML='<b>Correct.</b> '+x.exp}else{b.classList.add('wrong');fb.innerHTML='<b>Not quite.</b> Correct answer: <b>'+letters[x.ans]+'. '+x.opts[x.ans]+'</b><br>'+x.exp}fb.style.display='block';next.style.display='inline-block';scoreEl()}next.onclick=()=>{i++;if(i<qs.length)render();else finish()};function finish(){quiz.style.display='none';result.style.display='block';prog.style.width='100%';let sec=Math.floor((Date.now()-start)/1000),pct=Math.round(score/qs.length*100);final.textContent=score+'/20 ('+pct+'%)';timefinal.textContent='Time taken: '+fmt(sec);summary.textContent=pct>=80?'Strong result. Review any misses, then move to the next set.':pct>=60?'Pass-range practice score, but review the explanations before moving on.':'Good diagnostic attempt — review the weak topics and retry later.'}render();</script></body></html>
